name: Lembretes push

on:
  schedule:
    - cron: '0 * * * *'   # de hora em hora (horário UTC)
  workflow_dispatch: {}    # permite disparar manualmente para testar

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Instalar dependências
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Enviar lembretes
        working-directory: scripts
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js
