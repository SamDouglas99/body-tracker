name: Lembretes push

on:
  schedule:
    - cron: '0 * * * *'   # de hora em hora (horário UTC)
  workflow_dispatch: {}    # permite disparar manualmente para testar

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          VP: ${{ secrets.VAPID_PRIVATE }}
        run: |
          if [ -n "$SA" ] && [ -n "$VP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secrets ainda nao configurados (FIREBASE_SERVICE_ACCOUNT / VAPID_PRIVATE). Robo em espera — nada a fazer."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: Instalar dependências
        if: steps.cfg.outputs.ready == 'true'
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Enviar lembretes
        if: steps.cfg.outputs.ready == 'true'
        working-directory: scripts
        env:
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node send-reminders.js
