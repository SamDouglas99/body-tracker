name: Lembretes push (Supabase)

on:
  schedule:
    - cron: '*/15 * * * *'   # a cada 15 min (UTC) — honra horários com minutos (ex.: 09:10)
  workflow_dispatch:       # disparo manual
    inputs:
      test:
        description: 'Enviar notificação de TESTE agora (ignora o horário)'
        type: boolean
        default: false

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar configuração
        id: cfg
        env:
          SR: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VP: ${{ secrets.VAPID_PRIVATE }}
        run: |
          if [ -n "$SR" ] && [ -n "$VP" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Secrets ainda nao configurados (SUPABASE_SERVICE_ROLE / VAPID_PRIVATE). Robo em espera — nada a fazer."
          fi
      - uses: actions/checkout@v4
        if: steps.cfg.outputs.ready == 'true'
      - uses: actions/setup-node@v4
        if: steps.cfg.outputs.ready == 'true'
        with:
          node-version: '20'
      - name: Instalar dependências
        if: steps.cfg.outputs.ready == 'true'
        working-directory: scripts
        run: npm install --no-audit --no-fund
      - name: Enviar lembretes
        if: steps.cfg.outputs.ready == 'true'
        working-directory: scripts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE: ${{ secrets.SUPABASE_SERVICE_ROLE }}
          VAPID_PUBLIC: ${{ secrets.VAPID_PUBLIC }}
          VAPID_PRIVATE: ${{ secrets.VAPID_PRIVATE }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
          TEST_PUSH: ${{ inputs.test }}
        run: node send-reminders-supabase.js
