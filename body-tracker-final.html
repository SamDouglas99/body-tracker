<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<title>Body Tracker Pro 💪</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBlw4eUTiY9tj2DVrOriGGhfabn91POR0c",authDomain:"body-tracker-6631d.firebaseapp.com",projectId:"body-tracker-6631d",storageBucket:"body-tracker-6631d.firebasestorage.app",messagingSenderId:"526453249400",appId:"1:526453249400:web:1353e6dfb5442d7f5be48d"};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
window._fb={
  async getEntries(p){const q=query(collection(db,`entries_${p}`),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},
  async saveEntry(p,e){const r=doc(collection(db,`entries_${p}`));await setDoc(r,e);},
  async getSettings(p){const s=await getDoc(doc(db,"settings",p));return s.exists()?s.data():null;},
  async saveSettings(p,d){await setDoc(doc(db,"settings",p),d);},
  async getWorkouts(){const q=query(collection(db,"workouts"),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},
  async saveWorkout(s){await addDoc(collection(db,"workouts"),s);},
  listenEntries(p,cb){const q=query(collection(db,`entries_${p}`),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});},
  listenWorkouts(cb){const q=query(collection(db,"workouts"),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});}
};
if(document.readyState==="complete"){if(window._btInit)window._btInit();}
else{window.addEventListener("load",()=>{if(window._btInit)window._btInit();});}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08080e;--bg2:#0d0d18;--bg3:#131324;--bg4:#181830;--bg5:#1f1f38;
  --border:#242436;--border2:#2e2e48;--muted:#6060848;--text:#eeeeff;--sub:#a0a0c8;
  --him:#e2e240;--him2:#a0e240;--him3:#ffaa00;--himb:rgba(226,226,64,.1);--himl:rgba(226,226,64,.4);
  --good:#4ade80;--bad:#f87171;--warn:#fbbf24;--info:#60a5fa;--purple:#a78bfa;
  --r:12px;--font:'Space Mono',monospace;--font2:'Syne',sans-serif;
  --pull:#4a9eff;--push:#ff6b4a;--legs:#e2e240;--upper:#c084fc;--lower:#fb923c;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font2);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#shell{display:flex;min-height:100vh;overflow-x:hidden}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:200;display:flex;flex-direction:column}
#main{margin-left:220px;flex:1;min-height:100vh;overflow-x:hidden;max-width:100%}
#content{padding:0 0 60px;overflow-x:hidden}
.sb-header{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo{font-family:var(--font2);font-size:18px;font-weight:800;margin-bottom:12px}
.him-mode .sb-logo span{color:var(--him)}
.pb{padding:8px 4px;background:transparent;border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-family:var(--font);text-align:center;color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.pb .pe{font-size:20px;display:block;margin-bottom:3px}
.pb.him.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.sb-nav{flex:1;padding:12px 0;overflow-y:auto}
.sn{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;transition:all .15s;border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:var(--font2)}
.sn:hover{color:var(--text);background:var(--bg3)}
.him-mode .sn.active{color:var(--him);border-left-color:var(--him);background:var(--himb)}
.sn .si{font-size:15px;width:18px;text-align:center}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:9px;color:var(--muted);letter-spacing:1px}
#topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;overflow:hidden}
.meal-check-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.meal-check-btn.done{background:rgba(74,222,128,.2);border-color:var(--good)}
.meal-check-btn.skipped{background:rgba(248,113,113,.15);border-color:var(--bad)}

.tb-title{font-family:var(--font2);font-size:21px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.him-mode .tb-accent{color:var(--him)}
.tb-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
.tb-badge{padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
.him-mode .tb-badge{background:var(--himb);color:var(--him);border:1px solid var(--himl)}
.page{padding:22px 24px;max-width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;overflow:hidden;word-break:break-word}
.card-accent{background:linear-gradient(135deg,var(--bg4),var(--bg3));border:1px solid var(--border2);border-radius:var(--r);padding:18px;overflow:hidden;word-break:break-word}
.lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700}
.sec-title{font-family:var(--font2);font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);padding:20px 24px 12px;display:flex;align-items:center;gap:8px;overflow:hidden}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}
.him-mode .accent-val{color:var(--him)}
.big-num{font-size:40px;font-weight:800;line-height:1;font-family:var(--font2)}
.him-mode .big-num{color:var(--him)}
.bar{height:7px;background:var(--bg5);border-radius:4px;overflow:hidden}
.bar.sm{height:4px}
.fill{height:100%;border-radius:3px;transition:width 1s ease}
.him-mode .fill{background:linear-gradient(90deg,var(--him),var(--him2))}
.him-mode .fill-warm{background:linear-gradient(90deg,var(--him),var(--him3))}
.badge{display:inline-block;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.him-mode .badge{background:var(--himb);border:1px solid var(--himl);color:var(--him)}
.badge-good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4);color:var(--good)}
.badge-warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--warn)}
.badge-bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--bad)}
.badge-info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.4);color:var(--info)}
.badge-purple{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.4);color:var(--purple)}
input[type=number],input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font2);font-size:14px;font-weight:700;padding:12px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--muted)}
.him-mode input:focus,.him-mode select:focus{border-color:var(--him)}
.him-mode .finput{border-color:rgba(226,226,64,.3)}
.flabel{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:14px 22px;border:none;border-radius:10px;font-family:var(--font2);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.him-mode .btn-primary{background:var(--him);color:#08080e}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:6px;cursor:pointer}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.trow:last-child{border:none}
.diff-up{color:var(--good)}
.diff-dn{color:var(--bad)}
.diff-0{color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stab{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-family:var(--font2);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .2s}
.him-mode .stab.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.chart-wrap{height:220px;position:relative}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:12px;font-weight:700}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:13px;line-height:2;font-weight:700;color:var(--sub)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
/* ── WORKOUT TRACKER ── */
.wo-day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.wo-day{padding:10px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;min-width:0;overflow:hidden}
.wo-day .wd-label{font-size:8px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.wo-day .wd-type{font-size:10px;font-weight:800;margin-bottom:2px}
.wo-day .wd-dot{width:6px;height:6px;border-radius:50%;margin:0 auto;background:var(--border2)}
.wo-day.pull .wd-type{color:var(--pull)}
.wo-day.push .wd-type{color:var(--push)}
.wo-day.legs .wd-type{color:var(--legs)}
.wo-day.upper .wd-type{color:var(--upper)}
.wo-day.lower .wd-type{color:var(--lower)}
.wo-day.pull.active,.wo-day.pull:hover{background:rgba(74,158,255,.1);border-color:var(--pull)}
.wo-day.pull.active .wd-dot{background:var(--pull)}
.wo-day.push.active,.wo-day.push:hover{background:rgba(255,107,74,.1);border-color:var(--push)}
.wo-day.push.active .wd-dot{background:var(--push)}
.wo-day.legs.active,.wo-day.legs:hover{background:rgba(226,226,64,.1);border-color:var(--legs)}
.wo-day.legs.active .wd-dot{background:var(--legs)}
.wo-day.upper.active,.wo-day.upper:hover{background:rgba(192,132,252,.1);border-color:var(--upper)}
.wo-day.upper.active .wd-dot{background:var(--upper)}
.wo-day.lower.active,.wo-day.lower:hover{background:rgba(251,146,60,.1);border-color:var(--lower)}
.wo-day.lower.active .wd-dot{background:var(--lower)}
.wo-day.rest .wd-type{color:var(--muted);font-size:9px}
/* Exercise card in logging mode */
.ex-log-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ex-log-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
.ex-log-name{font-size:14px;font-weight:800;letter-spacing:-0.2px}
.ex-log-prev{font-size:10px;color:var(--muted)}
.ex-log-body{padding:12px 14px}
.set-row{display:grid;grid-template-columns:80px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px;padding:8px;border-radius:8px;background:var(--bg4)}
.set-row.done-row{border-left:3px solid var(--good)}
.set-badge{font-size:9px;padding:4px 7px;border-radius:5px;text-align:center;letter-spacing:0.3px;font-weight:700}
.set-badge.warm{background:rgba(96,165,250,.15);color:var(--info)}
.set-badge.adj{background:rgba(251,191,36,.15);color:var(--warn)}
.set-badge.work{background:rgba(74,222,128,.15);color:var(--good)}
.set-label{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;font-weight:700}
.set-inp{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font2);font-size:16px;font-weight:800;padding:10px 6px;text-align:center;width:100%;outline:none;-webkit-appearance:none}
.set-inp:focus{border-color:var(--good)}
.set-done-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border2);background:var(--bg5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.set-done-btn.done{background:rgba(74,222,128,.2);border-color:var(--good)}
.set-prev{font-size:9px;color:var(--muted);text-align:center}
/* Timer */
#rest-timer{position:fixed;bottom:70px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;z-index:150;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:180px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#timer-display{font-size:24px;font-weight:800;font-family:var(--font2);color:var(--good);transition:color .3s,transform .1s;line-height:1}
#rest-timer.show{display:flex}
#timer-skip{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:4px 10px;font-family:var(--font);font-size:9px;cursor:pointer}
/* Workout history */
.wo-hist-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.wo-hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wo-type-chip{padding:4px 12px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase}
.chip-pull{background:rgba(74,158,255,.15);color:var(--pull);border:1px solid rgba(74,158,255,.4)}
.chip-push{background:rgba(255,107,74,.15);color:var(--push);border:1px solid rgba(255,107,74,.4)}
.chip-legs{background:rgba(226,226,64,.15);color:var(--legs);border:1px solid rgba(226,226,64,.4)}
.chip-upper{background:rgba(192,132,252,.15);color:var(--upper);border:1px solid rgba(192,132,252,.4)}
.chip-lower{background:rgba(251,146,60,.15);color:var(--lower);border:1px solid rgba(251,146,60,.4)}
.wo-hist-ex{font-size:10px;color:var(--sub);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.wo-hist-ex:last-child{border:none}
.wo-hist-sets{font-size:9px;color:var(--muted);margin-left:8px}
/* Progress chart filters */
.cf{background:var(--bg4);border:1px solid var(--border2);border-radius:6px;font-family:var(--font);font-size:9px;padding:5px 10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all .2s}
.him-mode .cf.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
/* Meal cards */
.meal-tab-btn{padding:5px 12px;border-radius:20px;font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);background:var(--bg3);border:1px solid var(--border2);transition:all .2s}
.meal-tab-btn.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--good)}
.meal-option{background:var(--bg4);border-radius:8px;padding:12px;margin-bottom:8px;font-size:11px;color:var(--sub);line-height:1.8;border-left:3px solid var(--border2);word-break:break-word;overflow-wrap:break-word}
.meal-option.opt1{border-left-color:var(--him)}
.meal-option.opt2{border-left-color:var(--info)}
.meal-option.opt3{border-left-color:var(--purple)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(8,8,14,.95);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal-box{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:28px 22px;width:100%;max-width:400px}
/* Mobile */
/* ── MOBILE NAV (hidden on desktop) ── */
/* ── Program switcher bar (fixed, above mobile nav) ── */
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:200;padding:4px 0 calc(4px + env(safe-area-inset-bottom))}
.mn{flex:1;background:none;border:none;font-family:var(--font2);font-size:8px;font-weight:800;letter-spacing:0;text-transform:uppercase;cursor:pointer;color:var(--muted);padding:6px 1px;border-top:3px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px;-webkit-tap-highlight-color:transparent;overflow:hidden;min-width:0}
.mn .mi{font-size:22px;line-height:1}
.him-mode .mn.active{color:var(--him);border-top-color:var(--him)}

/* ── MOBILE ≤720px ── */
@media(max-width:720px){
  #sidebar{display:none}
  #main{margin-left:0}
  #mobile-nav{display:flex !important}
  .grid3,.grid4{grid-template-columns:1fr 1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .page{padding:14px}
  .wo-day-grid{grid-template-columns:repeat(7,1fr);gap:4px}
  .set-row{grid-template-columns:72px 1fr 1fr 42px}
  #content{padding-bottom:calc(76px + env(safe-area-inset-bottom))}
  input[type=number],input[type=text],select,.set-inp{font-size:16px !important}
}

/* ── iPHONE 16 — 430px ── */
@media(max-width:430px){

  /* ── Safe areas & layout ── */
  #topbar{
    padding:10px 14px;
    padding-top:calc(10px + env(safe-area-inset-top));
  }
  #mobile-nav{
    padding:4px 0 calc(6px + env(safe-area-inset-bottom));
  }
  #content{
    padding-bottom:calc(72px + env(safe-area-inset-bottom));
  }
  #sidebar{display:none}
  #main{margin-left:0}
  #mobile-nav{display:flex !important}

  /* ── Topbar ── */
  .tb-title{font-size:18px;font-weight:800}
  .tb-sub{font-size:11px;font-weight:700;color:var(--sub)}
  .tb-badge{font-size:10px;padding:5px 12px;font-weight:800}

  /* ── Typography global ── */
  body{font-size:14px}
  .lbl{font-size:10px;letter-spacing:1.5px;font-weight:700}
  .sec-title{font-size:13px;font-weight:800;padding:14px 14px 10px}
  .big-num{font-size:34px;font-weight:800}
  .flabel{font-size:11px;font-weight:700}
  .trow{padding:11px 0}

  /* ── Page & Cards ── */
  .page{padding:12px;max-width:100vw;overflow-x:hidden}
  .card{padding:14px;border-radius:14px}
  .card-accent{padding:14px;border-radius:14px}

  /* ── Grids ── */
  .grid2{grid-template-columns:1fr 1fr;gap:10px}
  .grid3,.grid4{grid-template-columns:1fr 1fr;gap:10px}
  .fgrid{grid-template-columns:1fr 1fr;gap:10px}

  /* ── Nav bottom ── */
  .mn{font-size:9px;font-weight:800;padding:5px 1px;gap:3px}
  .mn .mi{font-size:23px}

  /* ── Inputs — prevent iOS zoom (must be ≥16px) ── */
  input[type=number],
  input[type=text],
  input[type=email],
  select{font-size:16px !important;padding:12px 14px;font-weight:700}
  .set-inp{font-size:16px !important;font-weight:800 !important;padding:10px 6px}

  /* ── Buttons ── */
  .btn{padding:14px 20px;font-size:12px;font-weight:800;border-radius:10px}
  .btn-ghost{font-size:10px;padding:8px 14px}

  .stab{flex-shrink:0;white-space:nowrap}

  .wo-day-grid{grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:14px}

  .ex-log-card{border-radius:12px;margin-bottom:10px}
  .ex-log-header{padding:13px 14px}
  .ex-log-name{font-size:14px;font-weight:800}
  .ex-log-body{padding:10px 12px}
  .set-row{
    grid-template-columns:68px 1fr 1fr 40px;

  }
  .set-badge{font-size:9px;padding:4px 6px;font-weight:700}
  .set-label{font-size:10px;font-weight:700;margin-top:3px}

  .wo-hist-card{padding:13px}
  .wo-type-chip{font-size:10px;padding:4px 10px;font-weight:800}

  /* ── Timer ── */
  #rest-timer{
    bottom:calc(76px + env(safe-area-inset-bottom));
    right:12px;padding:10px 14px;border-radius:12px
  }
  #timer-display{font-size:22px;font-weight:800}

  /* ── Modal ── */
  .modal-box{padding:20px 16px;border-radius:16px;max-width:calc(100vw - 32px);width:100%}

  /* ── Medidas — 2 colunas ── */
  .medidas-grid{grid-template-columns:1fr 1fr !important;gap:10px !important}

  /* ── Meal options ── */
  .meal-option{padding:11px 12px;font-size:12px;line-height:1.8;border-radius:8px}
  .meal-check-btn{width:40px;height:40px;font-size:18px;border-width:2px}

  /* ── Badges ── */
  .badge{font-size:9px;padding:3px 8px;font-weight:700}
  .badge-good,.badge-warn,.badge-bad,.badge-info,.badge-purple{font-size:9px;padding:3px 8px}

  /* ── Progress bars ── */
  .bar{height:7px;border-radius:4px}
  .bar.sm{height:5px}

  /* ── Charts ── */
  .chart-wrap{height:200px}

  /* ── Empty states ── */
  .empty-ico{font-size:44px}
  .empty-txt{font-size:13px;font-weight:700;line-height:2}
  .no-data{font-size:12px;font-weight:700}

  .diff-up,.diff-dn,.diff-0{font-size:11px;font-weight:700}

  /* ── Nutrition 5-col total → 3 col on mobile ── */
  .nutri-total-grid{grid-template-columns:repeat(3,1fr) !important;gap:6px !important}

  /* ── General overflow prevention ── */
  .page,.card,.card-accent{max-width:100%;box-sizing:border-box}
  img,canvas{max-width:100%}
  /* Force all text to wrap */
  *{-webkit-hyphens:auto;hyphens:auto;word-break:break-word}
  /* Exception for numbers/badges */
  .big-num,.badge,.tb-badge,.wo-type-chip,.set-badge{word-break:normal;hyphens:none}

  /* ── Inline font size overrides ── */
  /* Reduce large inline fonts for readability on small screen */
  [style*="font-size:36px"]{font-size:28px !important}
  [style*="font-size:34px"]{font-size:26px !important}
  [style*="font-size:32px"]{font-size:24px !important}

  [style*="font-size:26px"]{font-size:20px !important}
  [style*="font-size:24px"]{font-size:18px !important}

  /* ── Modal responsive ── */
  .modal-box{max-width:calc(100vw - 32px) !important;width:100% !important}

  /* ── Buttons full width on mobile ── */
  [style*="min-width:200px"]{width:100% !important;min-width:unset !important}

  /* ── Week bar 7 days ── */
  .wo-day-grid{gap:2px !important}
  .wo-day .wd-type{font-size:8px !important}

  /* ── Registrar form ── */
  .fgrid{grid-template-columns:1fr 1fr !important}
}

// ── Profile data ──
function getD(){
  const p=PROFILES[CP],s=getSettings(),entries=getEntries();
  const initW=s?.weight||p.initialWeight||60;
  const goalW=s?.goal||p.goalWeight||55;
  const h=s?.height||p.height||1.65;
  const latest=entries.length>0?entries[entries.length-1]:null;
  const curW=latest?.weight||initW;
  const totalD=goalW-initW;
  const progress=totalD!==0?Math.min(Math.max(((curW-initW)/totalD)*100,0),100):100;
  const remaining=(goalW-curW).toFixed(1);
  const bmi=h?(curW/(h*h)).toFixed(1):null;
  const bmiInfo=getBMI(bmi);
  const wp=entries.length>=2?((entries[entries.length-1].weight-entries[entries.length-2].weight).toFixed(1)):null;
  const weeks=Math.abs(remaining)>0.1?Math.ceil(Math.abs(remaining)/0.3):0;
  const bf=estimateBF(latest,h);
  return{p,s,entries,initW,goalW,h,latest,curW,totalD,progress,remaining,bmi,bmiInfo,wp,weeks,bf};
}
function getBMI(b){
  if(!b)return{label:'—',color:'var(--muted)'};
  const n=parseFloat(b);
  if(n<18.5)return{label:'Abaixo do peso',color:'var(--info)'};
  if(n<25)return{label:'Peso normal',color:'var(--good)'};
  if(n<30)return{label:'Sobrepeso',color:'var(--warn)'};
  return{label:'Obesidade',color:'var(--bad)'};
}
function estimateBF(l,h){
  if(!l||!h)return null;
  if(CP==='him'&&l.waist&&l.neck){
    const v=495/(1.0324-0.19077*Math.log10(l.waist-l.neck)+0.15456*Math.log10(h*100))-450;
    return Math.max(4,Math.min(50,parseFloat(v.toFixed(1))));
  }
  if(false){
    const v=495/(1.29579-0.35004*Math.log10(l.waist+l.hip-l.neck)+0.22100*Math.log10(h*100))-450;
    return Math.max(10,Math.min(55,parseFloat(v.toFixed(1))));
  }
  return null;
}
function fmtD(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtFull(d){return new Date(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});}

// ── Workout stats ──
function getMaxLoad(exName){
  return getWorkouts().reduce((mx,s)=>{
    const ex=s.exercises?.find(e=>e.name===exName);
    if(ex){ex.sets.forEach(st=>{if(st.weight&&st.weight>mx)mx=st.weight;});}
    return mx;
  },0);
}
function getLastLoad(exName,type){
  const last=getLastWorkout(type);
  if(!last)return null;
  const ex=last.exercises?.find(e=>e.name===exName);
  if(!ex)return null;
  const ws=ex.sets.filter(s=>s.t==='work'&&s.weight);
  if(!ws.length)return null;
  return{weight:ws[0].weight,reps:ws[0].reps,all:ws.map(s=>`${s.weight}kg×${s.reps}`).join(' / ')};
}
function getVolumeHistory(exName){
  return getWorkouts()
    .filter(s=>s.exercises?.find(e=>e.name===exName))
    .slice(-12)
    .map(s=>{
      const ex=s.exercises.find(e=>e.name===exName);
      const max=ex.sets.filter(st=>st.t==='work'&&st.weight).reduce((m,st)=>st.weight>m?st.weight:m,0);
      return{date:fmtD(s.date),maxW:max};
    });
}
function getTotalSessions(){return getWorkouts().length;}
function getThisWeekSessions(){
  const now=new Date(),wk=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((wk+6)%7));mon.setHours(0,0,0,0);
  return getWorkouts().filter(s=>new Date(s.date)>=mon).length;
}

function buildDashboard(){
  const {p,entries,initW,goalW,curW,progress,remaining,bmi,bmiInfo,wp,weeks,bf}=getD();
  const isLoss=goalW<initW;
  const latest=entries.length>0?entries[entries.length-1]:null;
  const ac=p.accentHex;
  const sessions=getTotalSessions(),thisWeek=getThisWeekSessions();
  const wpHtml=wp?`<div style="font-size:11px;color:${parseFloat(wp)>0?'var(--good)':'var(--bad)'};margin-top:6px">${parseFloat(wp)>0?'▲':'▼'} ${Math.abs(wp)}kg esta semana</div>`:'';
  const pcards=p.priorityKeys.map(k=>{
    const m=p.measurements.find(x=>x.key===k);if(!m)return'';
    const val=latest?.[k];const pct=val&&m.target?Math.min((parseFloat(val)/m.target)*100,100):0;
    return`<div class="card" style="border-color:${ac}30"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px"><span style="font-size:9px;color:var(--sub)">${m.label}</span><span class="badge">⚡</span></div><div style="font-size:20px;font-weight:700;color:${val?ac:'var(--border2)'};">${val||'—'}<span style="font-size:10px;color:var(--muted)">${val?'cm':''}</span></div>${m.target?`<div style="font-size:8px;color:var(--muted);margin:3px 0">Meta: ${m.target}cm</div>`:''}${m.target?`<div class="bar sm" style="margin-top:4px"><div class="fill fill-warm" style="width:${Math.max(pct,2)}%"></div></div>`:''}</div>`;
  }).join('');

  let evalHtml='';
  if(entries.length>=2){
    const last=entries[entries.length-1],prev=entries[entries.length-2];
    const wg=(last.weight-prev.weight).toFixed(1);
    const good=isLoss?(wg<=-0.2&&wg>=-0.5):(wg>=0.2&&wg<=0.5);
    const rows=p.measurements.filter(m=>last[m.key]&&prev[m.key]).map(m=>{
      const d=(parseFloat(last[m.key])-parseFloat(prev[m.key])).toFixed(1);
      const cls=parseFloat(d)>0?'diff-up':parseFloat(d)<0?'diff-dn':'diff-0';
      return`<div class="trow"><div style="display:flex;gap:8px;align-items:center"><span style="font-size:12px">${m.icon}</span><span style="font-size:10px;color:var(--sub)">${m.label}</span>${m.priority?`<span class="badge">Focus</span>`:''}</div><div style="display:flex;gap:12px;align-items:center"><span style="font-size:12px;font-weight:700;color:${ac}">${last[m.key]}${m.unit}</span><span class="${cls}" style="font-size:10px;font-weight:700">${parseFloat(d)>0?'+':''}${d}${m.unit}</span></div></div>`;
    }).join('');
    evalHtml=`<div class="sec-title">📊 Avaliação Semanal</div><div class="page" style="padding-top:0"><div class="card"><div style="display:flex;gap:8px;align-items:center;margin-bottom:12px"><div style="width:8px;height:8px;border-radius:50%;background:${good?'var(--good)':'var(--warn)'}"></div><span style="font-size:12px;color:${good?'var(--good)':'var(--warn)'}">${good?'Semana excelente! ✓':isLoss?'Déficit insuficiente':'Aumente as calorias'}</span></div>${rows}</div></div>`;
  }

  return`<div class="page">
    <div class="grid2" style="margin-bottom:14px">

        <div class="card"><div style="font-size:18px;margin-bottom:4px">🔬</div><div style="font-size:18px;font-weight:700;color:${ac}">${bf?`${bf}%`:'—'}</div><div class="lbl" style="margin:0">% Gordura</div></div>

    const macroBar=(val,meta,color)=>{
      const pct=Math.min(Math.round((val/meta)*100),100);

      return`<div style="height:5px;background:var(--bg5);border-radius:3px;overflow:hidden;margin-top:3px"><div style="width:${Math.max(pct,val>0?3:0)}%;height:100%;background:${over?'var(--warn)':color};border-radius:3px;transition:width .8s"></div></div>`;

    return`<div class="sec-title">🥗 Macros Consumidos Hoje</div>

      const last=vals[vals.length-1],prev=vals[vals.length-2];
      const diff=parseFloat((last-prev).toFixed(1));

      const pts=vals.map((v,i)=>`${Math.round(i*(W/Math.max(vals.length-1,1)))},${Math.round(H-((v-mn)/range)*(H-6)+3)}`).join(' ');

        </svg>
      </div>`;
    }).filter(Boolean).join('');
    if(!sparks)return'';
    return`<div class="sec-title">📈 Progresso — Medidas Foco</div>
      <div class="page" style="padding-top:0"><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">${sparks}</div></div>`;

}

function buildWeekBar(){
  const today=new Date().getDay();// 0=Sun
  const map={1:'pull',2:'push',3:'legs',4:'rest',5:'upper',6:'lower',0:'rest'};
  const todayType=map[today];
  const labels={pull:'Pull',push:'Push',legs:'Legs',upper:'Upper',lower:'Lower',rest:'Rest'};
  const days=getActiveSchedule().map((d,i)=>{
    const jsDay=[1,2,3,4,5,6,0][i];
    const isToday=jsDay===today;
    const t=d.type;
    return`<div class="wo-day ${t}${isToday?' active':''}" onclick="go('treinos');activeWorkoutType='${t}';setTimeout(()=>{woSubTab='log';render();},10)">
      <div class="wd-label">${d.day}</div>
      <div class="wd-type">${labels[t]||'—'}</div>
      <div class="wd-dot"></div>
    </div>`;
  }).join('');
  const todayLabel=todayType!=='rest'?`<div style="font-size:11px;color:var(--sub);margin-top:10px">Hoje: <strong style="color:${getWorkoutProgram()[todayType]?.color||'var(--muted)'}">${getWorkoutProgram()[todayType]?.label||'Descanso'}</strong> · <button onclick="go('treinos');activeWorkoutType='${todayType}';setTimeout(()=>{woSubTab='log';render();},10)" style="background:none;border:none;color:var(--him);font-family:var(--font);font-size:10px;cursor:pointer;letter-spacing:1px;text-decoration:underline">Iniciar →</button></div>`:'<div style="font-size:11px;color:var(--muted);margin-top:10px">Hoje: Descanso 💤</div>';
  return`<div class="card-accent" style="margin-top:0"><div class="lbl">Semana Push·Pull·Legs·Upper·Lower</div><div class="wo-day-grid">${days}</div>${todayLabel}</div>`;
}

// MEDIDAS
// ══════════════════════════════════════
function buildMedidas(){
  const {p,entries}=getD();
  const latest=entries.length>0?entries[entries.length-1]:null;
  const prev=entries.length>=2?entries[entries.length-2]:null;
  const ac=p.accentHex;
  const cards=p.measurements.map(m=>{
    const val=latest?.[m.key],pval=prev?.[m.key];
    const diff=val&&pval?(parseFloat(val)-parseFloat(pval)).toFixed(1):null;
    const pct=val&&m.target?Math.min((parseFloat(val)/m.target)*100,100):0;
    const dfmt=diff!=null?`<span class="${parseFloat(diff)>0?'diff-up':parseFloat(diff)<0?'diff-dn':'diff-0'}" style="font-size:10px;font-weight:700">${parseFloat(diff)>0?'+':''}${diff}${m.unit}</span>`:'';
    return`<div class="card" style="${m.priority?`border-color:${ac}30;`:''}padding:12px">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
        <span style="font-size:18px;line-height:1">${m.icon}</span>
        ${m.priority?`<span class="badge" style="font-size:7px;padding:2px 5px">⚡</span>`:''}
      </div>
      <div style="font-size:11px;color:var(--sub);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${m.label}</div>
      <div style="font-size:22px;font-weight:700;color:${val?ac:'var(--border2)'};line-height:1">${val||'—'}<span style="font-size:11px;color:var(--muted);font-weight:400">${val?m.unit:''}</span></div>
      ${dfmt?`<div style="margin-top:2px">${dfmt}</div>`:''}
      ${m.target?`<div style="font-size:8px;color:var(--muted);margin-top:3px">→ ${m.target}${m.unit}</div>`:''}
      ${m.target&&val?`<div class="bar sm" style="margin-top:6px"><div class="fill${m.priority?' fill-warm':''}" style="width:${Math.max(pct,2)}%"></div></div>`:''}
    </div>`;
  }).join('');
  return`<div class="page"><div class="sec-title" style="padding:0 0 14px">📋 Todas as Medidas</div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px" class="medidas-grid">${cards}</div></div>`;
}

function buildRegistrar(){
  const {p}=getD();
  const today=new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long',year:'numeric'});
  const ac=p.accentHex;
  const pri=p.measurements.filter(m=>m.priority||m.key==='weight').map(m=>`<div><label class="flabel">${m.icon} ${m.label}</label><input type="number" step="0.1" id="f_${m.key}" placeholder="${m.key==='weight'?'kg':'cm'}" class="${m.priority?'finput':''}"/></div>`).join('');
  const oth=p.measurements.filter(m=>!m.priority&&m.key!=='weight').map(m=>`<div><label class="flabel">${m.icon} ${m.label}</label><input type="number" step="0.1" id="f_${m.key}" placeholder="—"/></div>`).join('');
  return`<div class="page">
    <div style="font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:18px">${today}</div>
    <div class="sec-title" style="padding:0 0 12px;font-size:10px">⚡ Prioridades</div>
    <div class="fgrid" style="margin-bottom:20px">${pri}</div>
    <div class="sec-title" style="padding:0 0 12px;font-size:10px">📏 Outras Medidas</div>
    <div class="fgrid" style="margin-bottom:24px">${oth}</div>
    <button class="btn btn-primary" id="save-btn" onclick="saveEntry()" style="width:100%">💾 Salvar Medição</button>
    <div style="font-size:9px;color:var(--muted);margin-top:10px">* Apenas peso é obrigatório</div>
  </div>`;
}
function saveEntry(){
  const p=PROFILES[CP];
  const w=document.getElementById('f_weight')?.value;
  if(!w){alert('Informe o peso!');return;}
  const btn=document.getElementById('save-btn');
  btn.textContent='Salvando...';btn.disabled=true;
  const entry={date:new Date().toISOString(),id:Date.now()};
  p.measurements.forEach(m=>{const v=document.getElementById('f_'+m.key)?.value;if(v)entry[m.key]=parseFloat(v);});
  _cache.entries[CP].push(entry);
  const done=()=>{btn.textContent='✓ Salvo!';setTimeout(()=>go('dashboard'),900);};
  if(window._fb){window._fb.saveEntry(CP,entry).then(done).catch(e=>{console.error(e);done();});}else{done();}
}

function setChartKey(k,btn){

  if(!canvas)return;
  const data=entries.slice(-16).map(e=>({x:fmtD(e.date),y:parseFloat(e[k]||0)})).filter(d=>d.y>0);
  if(charts.main){charts.main.destroy();}
  if(data.length<2){canvas.parentElement.innerHTML='<div class="no-data">Registre ao menos 2 medições</div>';return;}
  charts.main=mkLine(canvas,data,p.accentHex);
}
function setWoChart(name,btn){
  woPrgExercise=name;
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('active'));

}
function mkLine(canvas,data,color){

function rmCalc(){

function doneSet(exIdx,si,restSecs,exIdxOrName){
  const btn=document.getElementById(`btn_${exIdx}_${si}`);
  const row=document.getElementById(`srow_${exIdx}_${si}`);
  if(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'✓':'○';}
  if(row){row.classList.toggle('done-row');}
  if(btn&&btn.classList.contains('done')&&restSecs>0){
    // Look up exercise name safely
    let exName='';
    try{
      const prog=getWorkoutProgram();
      if(activeWorkoutType&&prog[activeWorkoutType]){
        exName=prog[activeWorkoutType].exercises[exIdxOrName]?.name||'';
      }
    }catch(e){}
    startTimer(restSecs,exName);
  }
}

// ── Vibration helpers ──
function vibrEnabled(){return localStorage.getItem('bt_vibr')!=='off';}
function toggleVibration(){
  const on=vibrEnabled();
  localStorage.setItem('bt_vibr',on?'off':'on');
  const btn=document.getElementById('vibr-toggle');
  if(btn){btn.textContent=on?'🔕':'📳';btn.style.color=on?'var(--muted)':'var(--him)';}
  if(!on&&'vibrate' in navigator) navigator.vibrate([100,50,100]);
}
function vibrate(pattern){
  if(vibrEnabled()&&'vibrate' in navigator) navigator.vibrate(pattern);
}

function startTimer(secs, exName=''){
  stopTimer();
  timerSeconds=secs;
  const el=document.getElementById('rest-timer');
  const disp=document.getElementById('timer-display');
  const exEl=document.getElementById('timer-exercise');
  const vBtn=document.getElementById('vibr-toggle');
  if(!el||!disp)return;
  if(exEl) exEl.textContent=exName||'';
  if(vBtn){vBtn.textContent=vibrEnabled()?'📳':'🔕';vBtn.style.color=vibrEnabled()?'var(--him)':'var(--muted)';}
  el.classList.add('show');
  updateTimerDisplay();
  // Short vibration when timer starts
  vibrate([50]);
  timerInterval=setInterval(()=>{
    timerSeconds--;
    updateTimerDisplay();
    // Warning at 10s — 2 short pulses
    if(timerSeconds===10) vibrate([80,40,80]);
    // Warning at 5s — pulse every second
    if(timerSeconds>0&&timerSeconds<=5) vibrate([60]);
    if(timerSeconds<=0) stopTimer();
  },1000);
}
function updateTimerDisplay(){
  const disp=document.getElementById('timer-display');
  if(disp){
    const m=Math.floor(timerSeconds/60),s=timerSeconds%60;
    disp.textContent=`${m}:${String(s).padStart(2,'0')}`;
    disp.style.color=timerSeconds<=10?'var(--bad)':timerSeconds<=30?'var(--warn)':'var(--good)';
    // Pulse animation when low
    if(timerSeconds<=5&&timerSeconds>0) disp.style.transform='scale(1.1)';
    else disp.style.transform='scale(1)';
  }
}
function stopTimer(){
  clearInterval(timerInterval);timerInterval=null;
  const el=document.getElementById('rest-timer');
  if(el)el.classList.remove('show');
  // Final vibration — 3 strong pulses = ready!
  vibrate([200,100,200,100,200]);
}

function calcSessionVolume(session){
  // Tonelagem = soma de (carga × reps) em séries de trabalho
  let total=0;
  session.exercises?.forEach(ex=>{
    ex.sets.filter(s=>s.t==='work'&&s.weight&&s.reps).forEach(s=>{total+=s.weight*s.reps;});
  });
  return parseFloat(total.toFixed(1));
}
function calcSessionSets(session){
  let total=0;
  session.exercises?.forEach(ex=>{
    total+=ex.sets.filter(s=>s.t==='work'&&s.done).length;
  });
  return total;
}
function saveWorkoutSession(){
  const prog=getWorkoutProgram()[activeWorkoutType];
  if(!prog){alert('Selecione um treino primeiro!');return;}
  const session={id:Date.now(),date:new Date().toISOString(),type:activeWorkoutType,exercises:[]};
  prog.exercises.forEach((ex,ei)=>{
    const sets=[];
    ex.sets.forEach((s,si)=>{
      const w=parseFloat(document.getElementById(`w_${ei}_${si}`)?.value)||0;
      const r=parseInt(document.getElementById(`r_${ei}_${si}`)?.value)||0;
      const done=document.getElementById(`btn_${ei}_${si}`)?.classList.contains('done')||false;
      sets.push({t:s.t,weight:w,reps:r,done});
    });
    session.exercises.push({name:ex.name,sets});
  });
  // Calcular volume da sessão e do último treino igual
  const tonnage=calcSessionVolume(session);
  const totalSets=calcSessionSets(session);
  session.tonnage=tonnage;
  session.totalSets=totalSets;
  const lastSame=getWorkouts().slice().reverse().find(s=>s.type===activeWorkoutType);
  const lastTonnage=lastSame?calcSessionVolume(lastSame):0;
  const lastSets=lastSame?calcSessionSets(lastSame):0;
  const tonnageDiff=lastTonnage>0?parseFloat((tonnage-lastTonnage).toFixed(1)):null;
  const setsDiff=lastSets>0?totalSets-lastSets:null;
  saveWorkout(session);
  stopTimer();
  woSubTab='history';
  render();
  // Resumo de volume pós-treino
  setTimeout(()=>{
    const tLine=tonnage>0?`\n📦 Tonelagem: ${tonnage}kg${tonnageDiff!==null?` (${tonnageDiff>=0?'+':''}${tonnageDiff}kg vs último)`:''}`:'' ;
    const sLine=`\n✅ Séries completadas: ${totalSets}${setsDiff!==null?` (${setsDiff>=0?'+':''}${setsDiff} vs último)`:''}`;
    alert(`💪 Treino salvo! Continue evoluindo!${sLine}${tLine}`);
  },100);
}

function buildWoHistory(tabs){
  const sessions=getWorkouts();
  const ac=PROFILES[CP].accentHex;
  const chipClass={pull:'chip-pull',push:'chip-push',legs:'chip-legs',upper:'chip-upper',lower:'chip-lower'};
  const labels={pull:'Pull',push:'Push',legs:'Legs',upper:'Upper',lower:'Lower'};

  // Stats
  const totalW=sessions.length;
  const thisWeek=getThisWeekSessions();
  const typeCount={pull:0,push:0,legs:0,upper:0,lower:0};
  sessions.forEach(s=>{if(typeCount[s.type]!==undefined)typeCount[s.type]++;});

  const stats=`<div class="grid4" style="margin-bottom:20px">
    <div class="card"><div style="font-size:22px;font-weight:700;color:${ac}">${totalW}</div><div class="lbl" style="margin:4px 0">Total treinos</div></div>
    <div class="card"><div style="font-size:22px;font-weight:700;color:var(--good)">${thisWeek}</div><div class="lbl" style="margin:4px 0">Esta semana</div></div>
    <div class="card"><div style="font-size:22px;font-weight:700;color:var(--info)">${Math.round(totalW/Math.max(1,Math.ceil((Date.now()-(sessions[0]?new Date(sessions[0].date):Date.now()))/(7*24*3600*1000))))}</div><div class="lbl" style="margin:4px 0">Média /semana</div></div>
    <div class="card">${Object.entries(typeCount).map(([t,n])=>`<div class="trow" style="padding:3px 0"><span style="font-size:9px;" class="wo-type-chip ${chipClass[t]||''}">${labels[t]}</span><span style="font-size:11px;font-weight:700;color:${ac}">${n}x</span></div>`).join('')}</div>
  </div>`;

  const list=sessions.length===0?`<div class="card empty"><div class="empty-ico">🏋️</div><div class="empty-txt">Nenhum treino registrado ainda.<br>Vá em "Registrar Treino" e comece!</div></div>`:
    [...sessions].reverse().map(s=>{
      const prog=getWorkoutProgram()[s.type]||{};
      const exRows=s.exercises?.map(ex=>{
        const workSets=ex.sets.filter(st=>st.t==='work'&&st.weight>0);
        if(!workSets.length)return'';
        return`<div class="wo-hist-ex">💪 ${ex.name} <span class="wo-hist-sets">${workSets.map(st=>`${st.weight}kg×${st.reps}`).join(' · ')}</span></div>`;
      }).join('')||'';
      return`<div class="wo-hist-card">
        <div class="wo-hist-header">
          <div>
            <span class="wo-type-chip ${chipClass[s.type]||''}">${labels[s.type]||s.type}</span>
            <span style="font-size:10px;color:var(--muted);margin-left:8px">${fmtFull(s.date)}</span>
          </div>
          <div style="text-align:right">
            <div style="font-size:10px;color:var(--muted)">${s.exercises?.filter(ex=>ex.sets.some(st=>st.done)).length||0}/${s.exercises?.length||0} exerc.</div>
            ${calcSessionSets(s)>0?`<div style="font-size:9px;color:var(--good)">${calcSessionSets(s)} séries · ${s.tonnage||calcSessionVolume(s)}kg</div>`:''}
          </div>
        </div>
        ${exRows}
      </div>`;
    }).join('');

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📚 Histórico de Treinos</div>
    ${tabs}
    ${stats}
    ${list}
  </div>`;
}

function buildWoProgress(tabs){
  const ac=PROFILES[CP].accentHex;
  const workouts=getWorkouts();

  const grouped=Object.entries(getWorkoutProgram()).map(([key,prog])=>{
    const cards=prog.exercises.map(ex=>{
      const max=getMaxLoad(ex.name);
      const hist=getVolumeHistory(ex.name);
      const first=hist[0]?.maxW||max;
      const gain=parseFloat((max-first).toFixed(1));
      const lastSession=workouts.slice().reverse().find(s=>s.type===key);
      const lastWorkSets=lastSession?.exercises?.find(e=>e.name===ex.name)?.sets?.filter(s=>s.t==='work'&&s.weight>0)||[];
      const lastStr=lastWorkSets.map(s=>`${s.weight}kg×${s.reps}`).join(' / ')||'—';
      const sessions=workouts.filter(s=>s.exercises?.find(e=>e.name===ex.name)).length;
      return`<div class="card" style="${max>0?`border-color:${prog.color}30`:''}">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:6px">
          <div style="flex:1;min-width:0"><div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div><div style="font-size:9px;color:var(--muted);margin-top:2px">${sessions} sessões</div></div>
          <div style="text-align:right;margin-left:8px;flex-shrink:0"><div style="font-size:20px;font-weight:700;color:${max>0?ac:'var(--border2)'}">${max>0?max+'kg':'—'}</div>${gain>0?`<div style="font-size:9px;color:var(--good)">+${gain}kg</div>`:''}</div>
        </div>
        <div style="font-size:9px;color:var(--sub);padding:5px 8px;background:var(--bg4);border-radius:6px"><span style="color:var(--muted)">Último: </span>${lastStr}</div>
      </div>`;
    }).join('');
    return`<div style="margin-bottom:20px">
      <div class="sec-title" style="padding:0 0 10px"><span style="color:${prog.color}">${prog.label}</span><span style="font-size:9px;color:var(--muted);margin-left:8px">${prog.day}</span></div>
      <div class="grid3">${cards}</div>
    </div>`;
  }).join('');

  const muscleMap={
    'Peito':     {keys:['Supino Inclinado Máq/Halter','Supino Reto Máq/Smith','Voador','Crucifixo Inclinado Cabo'],color:'var(--push)'},
    'Costas':    {keys:['Remada Curvada','Remada Baixa Pgd. Aberta','Serrote','Pulley Frente Triângulo','Pulley Frente Aberto','Remada Baixa Triângulo'],color:'var(--pull)'},
    'Ombros':    {keys:['Elevação Lateral Sentado','Elev. Lateral Máq/Cabo Uni.'],color:'var(--upper)'},
    'Bíceps':    {keys:['Rosca Direta Cabo','Rosca Direta Banco 45°'],color:'var(--pull)'},
    'Tríceps':   {keys:['Tríceps Polia Alta','Tríceps Francês c/ Corda'],color:'var(--push)'},
    'Quadríceps':{keys:['Agachamento Hack','Leg Press 45','Extensor'],color:'var(--legs)'},
    'Posterior': {keys:['Stiff','Flexor Deitado','Flexor Sentado'],color:'var(--lower)'},
    'Glúteos':   {keys:['Elevação de Quadril'],color:'var(--lower)'},
    'Panturrilha':{keys:['Panturrilha em Pé','Panturrilha Sentado'],color:'var(--legs)'},
  };
  const muscleVolumes=Object.entries(muscleMap).map(([muscle,cfg])=>{
    const cutoff=new Date(Date.now()-7*24*3600*1000);
    const weekSets=workouts.filter(s=>new Date(s.date)>=cutoff).reduce((sum,s)=>{
      cfg.keys.forEach(n=>{const ex=s.exercises?.find(e=>e.name===n);if(ex)sum+=ex.sets.filter(st=>st.t==='work').length;});return sum;},0);
    const totalSets=workouts.reduce((sum,s)=>{cfg.keys.forEach(n=>{const ex=s.exercises?.find(e=>e.name===n);if(ex)sum+=ex.sets.filter(st=>st.t==='work'&&st.done).length;});return sum;},0);
    return{muscle,color:cfg.color,totalSets,weekSets};
  });
  const maxWeekSets=Math.max(...muscleVolumes.map(m=>m.weekSets),1);
  const avgWeek=muscleVolumes.reduce((s,m)=>s+m.weekSets,0)/muscleVolumes.length;
  const alerts=[];
  muscleVolumes.forEach(m=>{
    if(m.weekSets===0&&workouts.some(s=>new Date(s.date)>new Date(Date.now()-7*24*3600*1000)))alerts.push({type:'bad',msg:`${m.muscle} não foi trabalhada essa semana`});
    else if(m.weekSets>0&&m.weekSets<avgWeek*0.4&&avgWeek>0)alerts.push({type:'warn',msg:`${m.muscle} com volume baixo (${m.weekSets} séries)`});
  });
  const entries=getEntries();
  const latest=entries.length>0?entries[entries.length-1]:null;
  const bilateral=latest?[
    {label:'Bíceps',l:latest.bicep_l,r:latest.bicep_r},
    {label:'Antebraço',l:latest.forearm_l,r:latest.forearm_r},
    {label:'Coxa Sup.',l:latest.thigh_sup_l,r:latest.thigh_sup_r},
    {label:'Coxa Inf.',l:latest.thigh_inf_l,r:latest.thigh_inf_r},
    {label:'Panturrilha',l:latest.calf_l,r:latest.calf_r},
  ].filter(b=>b.l&&b.r):[];

  window._radarData=muscleVolumes.map(m=>m.weekSets);
  window._radarLabels=muscleVolumes.map(m=>m.muscle);

  const balanceSection=`
    <div class="sec-title" style="padding:0 0 14px">⚖️ Equilíbrio Muscular</div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;margin-bottom:12px;color:var(--sub)">🕸️ Radar — Volume Semanal</div>
      <div style="height:260px;position:relative"><canvas id="radarChart"></canvas></div>
      <div style="font-size:9px;color:var(--muted);text-align:center;margin-top:8px">Área maior = mais volume semanal nesse grupo</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;margin-bottom:14px;color:var(--sub)">📊 Volume por Grupo</div>
      ${muscleVolumes.map(m=>{
        const pct=maxWeekSets>0?(m.weekSets/maxWeekSets)*100:0;
        const status=m.weekSets===0?'var(--bad)':m.weekSets<avgWeek*0.5?'var(--warn)':'var(--good)';
        return`<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:11px;color:var(--text)">${m.muscle}</span>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:9px;color:var(--muted)">${m.totalSets} total</span>
              <span style="font-size:12px;font-weight:700;color:${status}">${m.weekSets}/sem</span>
            </div>
          </div>
          <div class="bar"><div class="fill" style="width:${Math.max(pct,m.weekSets>0?4:0)}%;background:${m.color}"></div></div>
        </div>`;
      }).join('')}
    </div>
    ${alerts.length>0?`<div class="card" style="margin-bottom:14px;border-color:rgba(251,191,36,.3)">
      <div style="font-size:10px;font-weight:700;margin-bottom:10px;color:var(--warn)">⚠️ Alertas</div>
      ${alerts.map(a=>`<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span>${a.type==='bad'?'🔴':'🟡'}</span><span style="font-size:11px;color:var(--sub)">${a.msg}</span></div>`).join('')}
    </div>`:'<div class="card" style="margin-bottom:14px;border-color:rgba(74,222,128,.3)"><div style="font-size:11px;color:var(--good);text-align:center;padding:8px">✅ Sem desequilíbrios essa semana</div></div>'}
    ${bilateral.length>0?`<div class="card">
      <div style="font-size:10px;font-weight:700;margin-bottom:12px;color:var(--sub)">📐 Bilateral (Esq. vs Dir.)</div>
      ${bilateral.map(b=>{
        const diff=parseFloat((b.l-b.r).toFixed(1));
        const abs=Math.abs(diff);
        const status=abs<1?'var(--good)':abs<2?'var(--warn)':'var(--bad)';
        return`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:11px">${b.label}</span>
            <span style="font-size:10px;color:${status}">${abs===0?'✅ Simétrico':abs<1?`✅ Δ${abs}cm`:abs<2?`⚠️ Δ${abs}cm`:`🔴 Δ${abs}cm`}</span>
          </div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center">
            <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:var(--muted)">Esq</div><div style="font-size:15px;font-weight:700;color:${diff>0?ac:'var(--sub)'}">${b.l}cm</div></div>
            <span style="font-size:10px;color:var(--muted)">vs</span>
            <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:var(--muted)">Dir</div><div style="font-size:15px;font-weight:700;color:${diff<0?ac:'var(--sub)'}">${b.r}cm</div></div>
          </div>
        </div>`;
      }).join('')}
    </div>`:''}
    <div class="card" style="margin-top:14px">
      <div style="font-size:10px;font-weight:700;margin-bottom:10px;color:var(--sub)">📈 Ver Relatório de Evolução</div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">
        ${['semanal','mensal','trimestral','semestral'].map(p=>`<button onclick="showEvolutionCard('${p}')" style="padding:7px 14px;border-radius:20px;font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:var(--himb);border:1px solid var(--himl);color:var(--him)">${{semanal:'📅 Semana',mensal:'📆 Mês',trimestral:'📊 Trimestre',semestral:'🗓️ Semestre'}[p]}</button>`).join('')}
      </div>
    </div>`;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📊 Evolução por Exercício</div>
    ${tabs}
    ${workouts.length===0?`<div class="card empty"><div class="empty-ico">📊</div><div class="empty-txt">Registre treinos para ver a evolução de carga</div></div>`:`<div>${grouped}</div>${balanceSection}`}
  </div>`;
}

function getWeekPlan(){
  try{ return JSON.parse(localStorage.getItem('bt_weekplan_'+getWeekKey())||'{}'); }catch{ return {}; }
}
function saveWeekPlan(plan){
  localStorage.setItem('bt_weekplan_'+getWeekKey(), JSON.stringify(plan));
}
function toggleWeekPlan(dayIdx, woType){
  const plan=getWeekPlan();
  const key='day_'+dayIdx;
  if(plan[key]===woType) delete plan[key];
  else plan[key]=woType;
  saveWeekPlan(plan);
  render();
}
function markWeekDayDone(dayIdx){
  const plan=getWeekPlan();
  plan['done_'+dayIdx]=!plan['done_'+dayIdx];
  saveWeekPlan(plan);
  render();
}

function buildWoPlanner(tabs){
  const ac=PROFILES[CP].accentHex;
  const prog=getWorkoutProgram();
  const schedule=getActiveSchedule();
  const plan=getWeekPlan();
  const workouts=getWorkouts();

  // Get this week's actual sessions
  const now=new Date();
  const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const thisWeekSessions=workouts.filter(s=>new Date(s.date)>=mon);

  // Day names for current week
  const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const DAYS_SHORT=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const todayDow=(now.getDay()+6)%7; // 0=Mon

  const woTypes=Object.entries(prog);
  const typeColors={pull:'var(--pull)',push:'var(--push)',legs:'var(--legs)',upper:'var(--upper)',lower:'var(--lower)',a:'var(--pull)',b:'var(--push)',c:'var(--legs)',d:'var(--pull)',e:'var(--push)',f:'var(--lower)',rest:'var(--muted)'};

  let planned=0, done=0, total=7;
  const dayCards=DAYS.map((day,i)=>{
    const isToday=i===todayDow;
    const plannedType=plan['day_'+i]||schedule[i]?.type||'rest';
    const isDone=plan['done_'+i]||thisWeekSessions.some(s=>s.type===plannedType&&new Date(s.date)>=mon&&new Date(s.date).getDay()===((i+1)%7));
    const color=typeColors[plannedType]||'var(--muted)';
    const label=prog[plannedType]?.label?.split('—')[0]?.trim()||'Rest';
    if(plannedType!=='rest') planned++;
    if(isDone&&plannedType!=='rest') done++;
    return`<div class="card" style="padding:12px;${isToday?`border-color:${ac};`:''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:11px;font-weight:800;color:${isToday?ac:'var(--sub)'}">${DAYS_SHORT[i]}${isToday?' <span style="font-size:8px;background:var(--himb);color:var(--him);padding:1px 5px;border-radius:8px">hoje</span>':''}</div>
          <div style="font-size:10px;color:${color};font-weight:700;margin-top:2px">${label}</div>
        </div>
        ${plannedType!=='rest'?`<button onclick="markWeekDayDone(${i})"
          style="width:32px;height:32px;border-radius:50%;border:2px solid ${isDone?'var(--good)':'var(--border2)'};
                 background:${isDone?'rgba(74,222,128,.2)':'var(--bg4)'};cursor:pointer;font-size:14px;flex-shrink:0">
          ${isDone?'✅':'○'}
        </button>`:'<div style="font-size:18px">😴</div>'}
      </div>
      <!-- Change workout type -->
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${[...woTypes.map(([k])=>k),'rest'].map(t=>`<button onclick="toggleWeekPlan(${i},'${t}')"
          style="padding:3px 8px;border-radius:12px;font-family:var(--font2);font-size:8px;font-weight:700;cursor:pointer;
                 border:1px solid ${plannedType===t?(typeColors[t]||'var(--border2)'):'var(--border2)'};
                 background:${plannedType===t?'rgba(255,255,255,.07)':'transparent'};
                 color:${plannedType===t?(typeColors[t]||'var(--muted)'):'var(--muted)'}"
          >${t==='rest'?'Rest':(prog[t]?.label?.split('—')[0]?.trim()||t.toUpperCase())}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  const adherePct=planned>0?Math.round(done/planned*100):0;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📅 Planejamento da Semana</div>
    ${tabs}

    <!-- Summary -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;text-align:center">
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Planejados</div>
        <div style="font-size:22px;font-weight:800;color:${ac}">${planned}</div>
      </div>
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Feitos</div>
        <div style="font-size:22px;font-weight:800;color:${done===planned&&planned>0?'var(--good)':'var(--good)'}">${done}</div>
      </div>
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Aderência</div>
        <div style="font-size:22px;font-weight:800;color:${adherePct>=80?'var(--good)':adherePct>=50?'var(--warn)':'var(--bad)'}">${adherePct}%</div>
      </div>
    </div>
    <div class="bar" style="margin-bottom:16px"><div class="fill" style="width:${Math.max(adherePct,2)}%"></div></div>

    <!-- Day cards -->
    <div style="display:flex;flex-direction:column;gap:10px">${dayCards}</div>

    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.8">
      💡 Toque nos botões abaixo de cada dia para alterar o treino.<br>Marque ✅ quando completar.
    </div>
  </div>`;
}

function buildWoEdit(tabs){
  const ac=PROFILES[CP].accentHex;
  const prog=getWorkoutProgram();

  // Get custom overrides
  let custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom={program:activeProgram,overrides:{}};}

  const progLabel=activeProgram===1?'Programa 1 — Push/Pull/Legs':'Programa 2 — A/B/C/D/E/F';

  const woSections=Object.entries(prog).map(([key,wo])=>{
    const exList=wo.exercises.map((ex,ei)=>`
      <div style="display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.04)">
        <div>
          <div style="font-size:11px;font-weight:700">${ex.name}</div>
          <div style="font-size:9px;color:var(--muted)">${ex.sets.filter(s=>s.t==='work').length} séries trabalho · ${ex.sets.find(s=>s.t==='work')?.r||'—'} reps</div>
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="editExercise('${key}',${ei})" style="padding:5px 10px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--info);font-family:var(--font);font-size:9px;cursor:pointer">✏️ Editar</button>
          <button onclick="deleteExercise('${key}',${ei})" style="padding:5px 10px;background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--bad);font-family:var(--font);font-size:9px;cursor:pointer">🗑️</button>
        </div>
      </div>`).join('');

    return`<div style="margin-bottom:16px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div style="font-size:11px;font-weight:700;color:${wo.color}">${wo.label}</div>
        <button onclick="addExercise('${key}')" style="padding:5px 12px;background:var(--himb);border:1px solid var(--himl);border-radius:6px;color:var(--him);font-family:var(--font);font-size:9px;letter-spacing:1px;cursor:pointer">+ Adicionar</button>
      </div>
      <div class="card">${exList}</div>
    </div>`;
  }).join('');

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">⚙️ Editar Exercícios</div>
    ${tabs}
    <div class="card-accent" style="margin-bottom:16px;border-color:${ac}30">
      <div style="font-size:9px;color:${ac};letter-spacing:2px;text-transform:uppercase;margin-bottom:4px">Editando: ${progLabel}</div>
      <div style="font-size:10px;color:var(--sub)">Alterações salvas localmente neste dispositivo.</div>

let _editCtx={woKey:null,exIdx:null,isNew:false};

function editExercise(woKey,exIdx){
  const prog=getWorkoutProgram();
  const ex=prog[woKey]?.exercises[exIdx];
  if(!ex)return;
  _editCtx={woKey,exIdx,isNew:false};
  document.getElementById('edit-modal-title').textContent=`Editar: ${ex.name}`;
  document.getElementById('edit-ex-name').value=ex.name;
  const workSets=ex.sets.filter(s=>s.t==='work');
  document.getElementById('edit-ex-sets').value=workSets.length||2;
  document.getElementById('edit-ex-reps').value=workSets[0]?.r||'6–10';
  document.getElementById('edit-ex-rest').value=workSets[0]?.rest||150;
  document.getElementById('edit-modal').style.display='flex';
}

function addExercise(woKey){
  _editCtx={woKey,exIdx:null,isNew:true};
  document.getElementById('edit-modal-title').textContent='Adicionar Exercício';
  document.getElementById('edit-ex-name').value='';
  document.getElementById('edit-ex-sets').value='2';
  document.getElementById('edit-ex-reps').value='6–10';
  document.getElementById('edit-ex-rest').value='150';
  document.getElementById('edit-modal').style.display='flex';
}

function closeEditModal(){
  document.getElementById('edit-modal').style.display='none';
}

function saveEditExercise(){
  const name=document.getElementById('edit-ex-name').value.trim();
  if(!name){alert('Digite o nome do exercício');return;}
  const sets=parseInt(document.getElementById('edit-ex-sets').value)||2;
  const reps=document.getElementById('edit-ex-reps').value.trim()||'6–10';
  const rest=parseInt(document.getElementById('edit-ex-rest').value)||150;

  // Build sets array
  const newSets=[
    {t:'warm',l:'Aquecimento',s:1,r:'10–15',rest:60},
    {t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:90},
  ];
  for(let i=0;i<sets;i++) newSets.push({t:'work',l:`Série ${i+1}`,s:1,r:reps,rest});
  const newEx={name,sets:newSets};

  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}

  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  const wk=_editCtx.woKey;
  // Apply existing overrides
  if(custom.overrides[wk]) baseProg[wk].exercises=custom.overrides[wk];

  if(_editCtx.isNew){
    baseProg[wk].exercises.push(newEx);
  } else {
    baseProg[wk].exercises[_editCtx.exIdx]=newEx;
  }
  custom.overrides[wk]=baseProg[wk].exercises;
  saveCustomProgram(custom);
  closeEditModal();
  render();
}

function deleteExercise(woKey,exIdx){
  if(!confirm('Excluir este exercício?'))return;
  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}
  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  if(custom.overrides[woKey]) baseProg[woKey].exercises=custom.overrides[woKey];
  baseProg[woKey].exercises.splice(exIdx,1);
  custom.overrides[woKey]=baseProg[woKey].exercises;
  saveCustomProgram(custom);
  render();
}

function resetCustomProgram(){
  if(!confirm('Restaurar o programa original? Todas as edições serão perdidas.'))return;
  localStorage.removeItem('bt_custom_prog');
  render();
}

function getMercadoSelections(){
  try{return JSON.parse(localStorage.getItem('bt_mercado_sel')||'{}');}catch{return {};}
}
function saveMercadoSelections(sel){
  localStorage.setItem('bt_mercado_sel', JSON.stringify(sel));
}

function calcMercadoList(selections){
  // totals: {ingredient: {qty, unit, meals: []}}
  const totals = {};
  MEAL_KEYS.forEach((key, mi) => {
    const optNum = selections[key] || 1;
    const ingKey = `${key}_${optNum}`;
    const ings = MEAL_INGREDIENTS[ingKey] || [];
    ings.forEach(([name, qty, unit]) => {
      if(!totals[name]) totals[name] = {qty:0, unit, meals:[]};
      totals[name].qty += qty;
      if(!totals[name].meals.includes(MEAL_NAMES_MKT[mi]))
        totals[name].meals.push(MEAL_NAMES_MKT[mi]);
    });
  });
  return totals;
}

function fmtQty(qty, unit){
  // Convert units intelligently
  if(unit === 'ml'){
    if(qty >= 1000) return `${(qty/1000).toFixed(qty%1000===0?0:1)}L`;
    return `${qty}ml`;
  }
  if(unit === 'g'){
    if(qty >= 1000) return `${(qty/1000).toFixed(qty%1000===0?0:2).replace(/\.?0+$/,'')}kg`;
    return `${qty}g`;
  }
  if(unit === 'un') return `${qty} un`;
  if(unit === 'col') return qty === 1 ? `1 col` : `${qty} col`;
  return `${qty} ${unit}`;
}

function getMktWeeks(){
  try{ return JSON.parse(localStorage.getItem('bt_mkt_weeks')||'[]'); }catch{ return []; }
}
function saveMktWeek(spent){
  const w=getMktWeeks();
  w.push({date:new Date().toISOString().slice(0,10),spent:parseFloat(spent)});
  // keep last 12 weeks
  if(w.length>12) w.splice(0,w.length-12);
  localStorage.setItem('bt_mkt_weeks',JSON.stringify(w));
}

function checkDeload(){
  // Check if deload is needed based on training volume and weeks
  const workouts=getWorkouts();
  if(workouts.length<12) return null;
  // Find consecutive training weeks
  const now=new Date();
  let consecutiveWeeks=0;
  for(let w=0;w<12;w++){
    const wStart=new Date(now); wStart.setDate(now.getDate()-(w+1)*7);
    const wEnd=new Date(now); wEnd.setDate(now.getDate()-w*7);
    const sessionsInWeek=workouts.filter(s=>{const d=new Date(s.date);return d>=wStart&&d<wEnd;}).length;
    if(sessionsInWeek>=3) consecutiveWeeks++;
    else break;
  }
  if(consecutiveWeeks>=4){
    const lastDeload=localStorage.getItem('bt_last_deload');
    const weeksSinceDeload=lastDeload?Math.floor((now-new Date(lastDeload))/(7*24*3600*1000)):99;
    if(weeksSinceDeload>=4) return consecutiveWeeks;
  }
  return null;
}

function getConsumedMacros(){
  // Returns macros consumed today based on checked meals and chosen options
  const log=getMealLog(getTodayKey());
  let kcal=0,prot=0,carb=0,gord=0,fibra=0;
  for(let i=0;i<6;i++){
    const entry=log['meal_'+i];
    if(!entry) continue;
    const optIdx=(entry.option||1)-1;
    const macros=ALL_MEAL_MACROS[i]?.[optIdx]||ALL_MEAL_MACROS[i]?.[0]||{kcal:0,prot:0,carb:0,gord:0,fibra:0};
    kcal+=macros.kcal; prot+=macros.prot; carb+=macros.carb;
    gord+=macros.gord; fibra+=macros.fibra;
  }
  return{kcal:Math.round(kcal),prot:parseFloat(prot.toFixed(1)),carb:parseFloat(carb.toFixed(1)),gord:parseFloat(gord.toFixed(1)),fibra:parseFloat(fibra.toFixed(1))};
}

function getMealStats(){
  const totalMeals=6; // refeições por dia no plano
  // Today
  const todayLog=getMealLog(getTodayKey());
  const todayDone=Object.keys(todayLog).filter(k=>k.startsWith('meal_')).length;
  // This week
  let weekDone=0, weekTotal=0;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dk=d.toISOString().slice(0,10);
    const log=getMealLog(dk);
    const done=Object.keys(log).filter(k=>k.startsWith('meal_')).length;
    if(i===0||done>0){ weekTotal+=totalMeals; weekDone+=done; }
  }
  // Streak
  let streak=0;
  for(let i=0;i<60;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dk=d.toISOString().slice(0,10);
    const log=getMealLog(dk);
    const done=Object.keys(log).filter(k=>k.startsWith('meal_')).length;
    if(done>=totalMeals) streak++;
    else if(i>0) break;
  }
  // Most skipped meal
  const skipCount=Array(totalMeals).fill(0);
  for(let i=0;i<30;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const log=getMealLog(d.toISOString().slice(0,10));
    for(let m=0;m<totalMeals;m++){
      if(!log['meal_'+m]) skipCount[m]++;
    }
  }
  const mostSkippedIdx=skipCount.indexOf(Math.max(...skipCount));
  // Water today
  const water=parseInt(localStorage.getItem('bt_water_'+getTodayKey())||'0');
  return{todayDone,todayTotal:totalMeals,weekDone,weekTotal,streak,mostSkippedIdx,skipCount,water};
}

  const cur=parseInt(localStorage.getItem(key)||'0');

}

const MEAL_TIMES=[
  {meal:'Pré-Treino',hour:4,min:25,icon:'⚡'},
  {meal:'Pós-Treino',hour:7,min:0,icon:'💪'},
  {meal:'Almoço',hour:11,min:55,icon:'🍛'},

function scheduleMealReminders(){
  if(localStorage.getItem('bt_reminders')==='off') return;
  _mealTimers.forEach(t=>clearTimeout(t));
  _mealTimers=[];
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date();
  MEAL_TIMES.forEach(({meal,hour,min,icon})=>{
    const target=new Date();
    target.setHours(hour,min,0,0);
    const diff=target-now;
    if(diff>0 && diff<24*3600*1000){
      const t=setTimeout(()=>{
        sendNotif(`${icon} Hora da refeição!`,`${meal} — confira seu plano alimentar`,`meal_${meal}`);
      },diff);
      _mealTimers.push(t);
    }
  });
}

    _mealTimers.forEach(t=>clearTimeout(t));

function buildEvolutionReport(period){
  const entries=getEntries();
  const workouts=getWorkouts();
  if(entries.length<2&&workouts.length<2)return null;
  const now=new Date();
  const days={semanal:7,mensal:30,trimestral:90,semestral:180}[period]||7;
  const cutoff=new Date(now-days*24*3600*1000);
  const recent=entries.filter(e=>new Date(e.date)>=cutoff);
  const recentWo=workouts.filter(w=>new Date(w.date)>=cutoff);
  const msgs=[];
  const achievements=[];
  const improvements=[];

  // Peso
  if(recent.length>=2){
    const first=recent[0],last=recent[recent.length-1];
    const wDiff=parseFloat((last.weight-first.weight).toFixed(1));
    const goal=_cache.settings.him?.goal||80;
    if(wDiff>0) achievements.push(`Ganhou ${wDiff}kg — avançando para ${goal}kg! 💪`);
    else if(wDiff<0) improvements.push(`Peso caiu ${Math.abs(wDiff)}kg — revise as calorias`);
    else improvements.push('Peso estável — aumente as calorias em 200kcal');
  }

  // Medidas prioritárias
  if(recent.length>=2){
    const first=recent[0],last=recent[recent.length-1];
    const p=PROFILES[CP];
    p.priorityKeys.forEach(k=>{
      const m=p.measurements.find(x=>x.key===k);
      if(!m||!first[k]||!last[k])return;
      const diff=parseFloat((last[k]-first[k]).toFixed(1));
      if(diff>0) achievements.push(`${m.label}: +${diff}cm 📈`);
      else if(diff<-0.5) improvements.push(`${m.label}: -${Math.abs(diff)}cm — foco nessa região`);
    });
  }

  // Treinos
  if(recentWo.length>0){
    const expected=Math.round(days/7*5);
    const consistency=Math.round((recentWo.length/expected)*100);
    if(consistency>=80) achievements.push(`${recentWo.length} treinos em ${days} dias — consistência de ${consistency}%! 🔥`);
    else if(consistency<50) improvements.push(`Só ${recentWo.length} treinos em ${days} dias (esperado ~${expected}) — mais consistência!`);
    // PR de carga
    const allEx=Object.values(getWorkoutProgram()).flatMap(w=>w.exercises);
    allEx.forEach(ex=>{
      const recentSessions=recentWo.filter(s=>s.exercises?.find(e=>e.name===ex.name));
      if(recentSessions.length>=2){
        const firstMax=recentSessions[0].exercises.find(e=>e.name===ex.name)?.sets.filter(s=>s.t==='work'&&s.weight).reduce((m,s)=>Math.max(m,s.weight),0)||0;
        const lastMax=recentSessions[recentSessions.length-1].exercises.find(e=>e.name===ex.name)?.sets.filter(s=>s.t==='work'&&s.weight).reduce((m,s)=>Math.max(m,s.weight),0)||0;
        if(lastMax>firstMax) achievements.push(`PR: ${ex.name} ${firstMax}→${lastMax}kg! 🏆`);
      }
    });
    // Deload check
    const deloadNeeded=checkDeload();
    if(deloadNeeded) improvements.push(`Você treinou ${deloadNeeded} semanas seguidas — semana de deload recomendada! Vá ao Guia para mais detalhes`);
    // Desequilíbrio
    const typeCount={pull:0,push:0,legs:0,upper:0,lower:0};
    recentWo.forEach(s=>{if(typeCount[s.type]!==undefined)typeCount[s.type]++;});
    const minType=Object.entries(typeCount).sort(([,a],[,b])=>a-b)[0];
    const maxType=Object.entries(typeCount).sort(([,a],[,b])=>b-a)[0];
    if(maxType[1]>0&&minType[1]<maxType[1]*0.4)
      improvements.push(`Desequilíbrio: ${getWorkoutProgram()[minType[0]]?.label||minType[0]} com só ${minType[1]}x — equalize o volume`);
  }

  return{achievements,improvements,period};
}

function showEvolutionCard(period){
  const report=buildEvolutionReport(period);
  if(!report)return;
  const existing=document.getElementById('evo-card');
  if(existing)existing.remove();
  const card=document.createElement('div');
  card.id='evo-card';
  const labels={semanal:'📅 Semana',mensal:'📆 Mês',trimestral:'📊 Trimestre',semestral:'🗓️ Semestre'};
  card.style.cssText='position:fixed;top:0;left:0;right:0;z-index:500;background:var(--bg2);border-bottom:2px solid var(--him);padding:16px 18px;max-height:70vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.7)';
  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:var(--font2);font-size:15px;font-weight:800;color:var(--him)">${labels[period]} — Relatório de Evolução</div>
      <button onclick="document.getElementById('evo-card').remove()" style="background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer">✕</button>
    </div>
    ${report.achievements.length?`
      <div style="font-size:9px;color:var(--good);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">✅ Conquistas</div>
      ${report.achievements.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--good);flex-shrink:0">▶</span><span style="font-size:11px;color:var(--sub);line-height:1.6">${a}</span></div>`).join('')}`:''}
    ${report.improvements.length?`
      <div style="font-size:9px;color:var(--warn);letter-spacing:2px;text-transform:uppercase;margin:12px 0 8px">⚠️ Pontos de Melhora</div>
      ${report.improvements.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--warn);flex-shrink:0">▶</span><span style="font-size:11px;color:var(--sub);line-height:1.6">${a}</span></div>`).join('')}`:''}
    ${!report.achievements.length&&!report.improvements.length?'<div style="font-size:11px;color:var(--muted);text-align:center;padding:12px">Registre mais dados para ver sua evolução!</div>':''}
    <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">
      ${['semanal','mensal','trimestral','semestral'].map(p=>`<button onclick="showEvolutionCard('${p}')" style="padding:5px 12px;border-radius:20px;font-family:var(--font);font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:${p===period?'var(--himb)':'var(--bg3)'};border:1px solid ${p===period?'var(--himl)':'var(--border2)'};color:${p===period?'var(--him)':'var(--muted)'}">${{semanal:'Semana',mensal:'Mês',trimestral:'Trimestre',semestral:'Semestre'}[p]}</button>`).join('')}
    </div>`;
  document.body.prepend(card);
  // Notificação push
  if(report.achievements.length)
    sendNotif('Body Tracker 💪',report.achievements[0]);
}

function checkAndShowEvolutionReport(){
  const workouts=getWorkouts();
  const entries=getEntries();
  if(entries.length<2&&workouts.length<3)return;
  const lastShown=parseInt(localStorage.getItem('bt_last_report')||'0');
  const now=Date.now();
  if(now-lastShown > 6*24*3600*1000){ // mostra a cada ~6 dias
    localStorage.setItem('bt_last_report',now);
    setTimeout(()=>showEvolutionCard('semanal'),2000);
  }
}

// ══════════════════════════════════════
// INIT
// ══════════════════════════════════════
window._btInit = async function(){
  document.getElementById('shell').className='him-mode';
  document.getElementById('mobile-nav').className='him-mode';
  if(window.innerWidth<=720) document.getElementById('mobile-nav').style.display='flex';
  requestNotifPermission();
  setTimeout(scheduleMealReminders,2000);
  showSyncStatus('⟳ Sincronizando...','var(--info)');
  try{
    const [sHim,eHim,workouts]=await Promise.all([
      window._fb.getSettings('him'),
      window._fb.getEntries('him'),
      window._fb.getWorkouts()
    ]);
    _cache.settings.him=sHim||{weight:63,goal:80,height:1.71};
    _cache.entries.him=eHim;
    _cache.workouts=workouts;
    if(!sHim) await window._fb.saveSettings('him',_cache.settings.him);
    showSyncStatus('✓ Sincronizado','var(--good)');
    window._fb.listenEntries('him',data=>{_cache.entries.him=data;render();});
    window._fb.listenWorkouts(data=>{_cache.workouts=data;render();});
  }catch(e){
    console.error('Firebase:',e);
    showSyncStatus('⚠ Offline','var(--warn)');
    _cache.settings.him={weight:63,goal:80,height:1.71};
  }
  render();
  setTimeout(checkAndShowEvolutionReport,3000);
};
if(window._fb){window._btInit();}
else{let t=0;const w=setInterval(()=>{t++;if(window._fb){clearInterval(w);window._btInit();}else if(t>30){clearInterval(w);_cache.settings.him={weight:63,goal:80,height:1.71};document.getElementById('shell').className='him-mode';document.getElementById('mobile-nav').className='him-mode';if(window.innerWidth<=720)document.getElementById('mobile-nav').style.display='flex';render();}},100);}

// ── Service Worker registration ──
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('./sw.js').then(reg=>{
      console.log('SW registered:', reg.scope);
    }).catch(err=>{
      console.log('SW registration failed:', err);
    });
  });
}
</script>
