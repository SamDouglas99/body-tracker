<head>

<title>Body Tracker Pro 💪</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
import { getStorage, ref, uploadBytes, getDownloadURL, deleteObject, listAll } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-storage.js";
const firebaseConfig={apiKey:"AIzaSyBlw4eUTiY9tj2DVrOriGGhfabn91POR0c",authDomain:"body-tracker-6631d.firebaseapp.com",projectId:"body-tracker-6631d",storageBucket:"body-tracker-6631d.firebasestorage.app",messagingSenderId:"526453249400",appId:"1:526453249400:web:1353e6dfb5442d7f5be48d"};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
const storage=getStorage(fbApp);
window._fb={
  async getEntries(p){const q=query(collection(db,`entries_${p}`),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},
  async saveEntry(p,e){const r=doc(collection(db,`entries_${p}`));await setDoc(r,e);},
  async getSettings(p){const s=await getDoc(doc(db,"settings",p));return s.exists()?s.data():null;},
  async saveSettings(p,d){await setDoc(doc(db,"settings",p),d);},
  async getWorkouts(){const q=query(collection(db,"workouts"),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},
  async saveWorkout(s){await addDoc(collection(db,"workouts"),s);},
  listenEntries(p,cb){const q=query(collection(db,`entries_${p}`),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});},
  listenWorkouts(cb){const q=query(collection(db,"workouts"),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});},
  async uploadPhoto(profile,photoId,blob){
    const r=ref(storage,`photos/${profile}/${photoId}.jpg`);
    await uploadBytes(r,blob,{contentType:'image/jpeg'});
    return await getDownloadURL(r);
  },
  async deletePhoto(profile,photoId){
    const r=ref(storage,`photos/${profile}/${photoId}.jpg`);
    await deleteObject(r).catch(()=>{});
  },
  async getPhotos(profile){
    const r=ref(storage,`photos/${profile}`);
    const list=await listAll(r).catch(()=>({items:[]}));
    const urls=await Promise.all(list.items.map(async item=>({
      id:item.name.replace('.jpg',''),
      url:await getDownloadURL(item)
    })));
    return urls;
  },
  async savePhotoMeta(profile,meta){
    await setDoc(doc(db,'photo_meta',profile),meta);
  },
  async getPhotoMeta(profile){
    const s=await getDoc(doc(db,'photo_meta',profile));
    return s.exists()?s.data():{photos:[]};
  }
};
if(document.readyState==="complete"){if(window._btInit)window._btInit();}
else{window.addEventListener("load",()=>{if(window._btInit)window._btInit();});}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  color-scheme:dark;
  --bg:#08080e;--bg2:#0d0d18;--bg3:#131324;--bg4:#181830;--bg5:#1f1f38;
  --border:#242436;--border2:#2e2e48;--muted:#606084;--text:#eeeeff;--sub:#a0a0c8;
  --him:#e2e240;--him2:#a0e240;--him3:#ffaa00;--himb:rgba(226,226,64,.1);--himl:rgba(226,226,64,.4);
  --good:#4ade80;--bad:#f87171;--warn:#fbbf24;--info:#60a5fa;--purple:#a78bfa;
  --r:12px;--font:'Space Mono',monospace;--font2:'Syne',sans-serif;
  --pull:#4a9eff;--push:#ff6b4a;--legs:#e2e240;--upper:#c084fc;--lower:#fb923c;
}
/* ── LIGHT THEME (dark/light toggle) ── */
html[data-theme="light"]{
  color-scheme:light;
  --bg:#eceef5;--bg2:#ffffff;--bg3:#ffffff;--bg4:#f3f4fa;--bg5:#e7e9f2;
  --border:#e3e5ef;--border2:#d2d5e3;--muted:#6b7086;--text:#161824;--sub:#454a60;
  --him:#96770a;--him2:#6f8a00;--him3:#c07600;--himb:rgba(150,119,10,.10);--himl:rgba(150,119,10,.35);
  --good:#12934a;--bad:#d63030;--warn:#bd7708;--info:#2564d6;--purple:#7a3ded;
  --pull:#2064d6;--push:#dd4720;--legs:#96770a;--upper:#7a3ded;--lower:#bd7708;
}
html[data-theme="light"] .trow{border-bottom-color:rgba(0,0,0,.07)}
html[data-theme="light"] .wo-hist-ex{border-bottom-color:rgba(0,0,0,.05)}
html[data-theme="light"] .btn-primary{color:#fffef5}
html[data-theme="light"] .him-mode .btn-primary{color:#1a1500}
html[data-theme="light"] #rest-timer{box-shadow:0 8px 32px rgba(0,0,0,.18)}
html[data-theme="light"] ::-webkit-scrollbar-thumb{background:var(--border2)}
html,body{background:var(--bg);color:var(--text);font-family:var(--font2);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
#shell{display:flex;min-height:100vh;overflow-x:hidden}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:200;display:flex;flex-direction:column}
#main{margin-left:220px;flex:1;min-height:100vh;overflow-x:hidden;max-width:100%}
#content{padding:0 0 60px;overflow-x:hidden}
.sb-header{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo{font-family:var(--font2);font-size:18px;font-weight:800;margin-bottom:12px}
.him-mode .sb-logo span{color:var(--him)}
.pb{padding:8px 4px;background:transparent;border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-family:var(--font);text-align:center;color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.pb .pe{font-size:20px;display:block;margin-bottom:3px}
.pb.him.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.sb-nav{flex:1;padding:12px 0;overflow-y:auto}
.sn{display:flex;align-items:center;gap:10px;padding:12px 16px;cursor:pointer;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;transition:all .15s;border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:var(--font2)}
.sn:hover{color:var(--text);background:var(--bg3)}
.him-mode .sn.active{color:var(--him);border-left-color:var(--him);background:var(--himb)}
.sn .si{font-size:15px;width:18px;text-align:center}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:9px;color:var(--muted);letter-spacing:1px}
#topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;overflow:hidden}
.meal-check-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;transition:all .2s}
.meal-check-btn.done{background:rgba(74,222,128,.2);border-color:var(--good)}
.meal-check-btn.skipped{background:rgba(248,113,113,.15);border-color:var(--bad)}

.tb-title{font-family:var(--font2);font-size:21px;font-weight:800;letter-spacing:-0.3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.him-mode .tb-accent{color:var(--him)}
.tb-sub{font-size:11px;color:var(--muted);margin-top:3px;font-weight:700}
.tb-badge{padding:6px 14px;border-radius:20px;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800;white-space:nowrap}
.him-mode .tb-badge{background:var(--himb);color:var(--him);border:1px solid var(--himl)}
.page{padding:22px 24px;max-width:100%;box-sizing:border-box}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:18px;overflow:hidden;word-break:break-word}
.card-accent{background:linear-gradient(135deg,var(--bg4),var(--bg3));border:1px solid var(--border2);border-radius:var(--r);padding:18px;overflow:hidden;word-break:break-word}
.lbl{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px;font-weight:700}
.sec-title{font-family:var(--font2);font-size:13px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);padding:20px 24px 12px;display:flex;align-items:center;gap:8px;overflow:hidden}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}
.him-mode .accent-val{color:var(--him)}
.big-num{font-size:40px;font-weight:800;line-height:1;font-family:var(--font2)}
.him-mode .big-num{color:var(--him)}
.bar{height:7px;background:var(--bg5);border-radius:4px;overflow:hidden}
.bar.sm{height:4px}
.fill{height:100%;border-radius:3px;transition:width 1s ease}
.him-mode .fill{background:linear-gradient(90deg,var(--him),var(--him2))}
.him-mode .fill-warm{background:linear-gradient(90deg,var(--him),var(--him3))}
.badge{display:inline-block;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.him-mode .badge{background:var(--himb);border:1px solid var(--himl);color:var(--him)}
.badge-good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4);color:var(--good)}
.badge-warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--warn)}
.badge-bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--bad)}
.badge-info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.4);color:var(--info)}
.badge-purple{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.4);color:var(--purple)}
input[type=number],input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:10px;color:var(--text);font-family:var(--font2);font-size:14px;font-weight:700;padding:12px 14px;outline:none;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--muted)}
.him-mode input:focus,.him-mode select:focus{border-color:var(--him)}
.him-mode .finput{border-color:rgba(226,226,64,.3)}
.flabel{display:block;font-size:10px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:6px;font-weight:700}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:14px 22px;border:none;border-radius:10px;font-family:var(--font2);font-size:12px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.him-mode .btn-primary{background:var(--him);color:#08080e}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:6px;cursor:pointer}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.trow:last-child{border:none}
.diff-up{color:var(--good)}
.diff-dn{color:var(--bad)}
.diff-0{color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stab{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-family:var(--font2);font-size:10px;font-weight:700;letter-spacing:0.5px;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .2s}
.him-mode .stab.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.chart-wrap{height:220px;position:relative}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:12px;font-weight:700}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:13px;line-height:2;font-weight:700;color:var(--sub)}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
/* ── WORKOUT TRACKER ── */
.wo-day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.wo-day{padding:10px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .2s;min-width:0;overflow:hidden}
.wo-day .wd-label{font-size:8px;color:var(--muted);letter-spacing:0.5px;text-transform:uppercase;margin-bottom:4px;font-weight:700}
.wo-day .wd-type{font-size:10px;font-weight:800;margin-bottom:2px}
.wo-day .wd-dot{width:6px;height:6px;border-radius:50%;margin:0 auto;background:var(--border2)}
.wo-day.pull .wd-type{color:var(--pull)}
.wo-day.push .wd-type{color:var(--push)}
.wo-day.legs .wd-type{color:var(--legs)}
.wo-day.upper .wd-type{color:var(--upper)}
.wo-day.lower .wd-type{color:var(--lower)}
.wo-day.pull.active,.wo-day.pull:hover{background:rgba(74,158,255,.1);border-color:var(--pull)}
.wo-day.pull.active .wd-dot{background:var(--pull)}
.wo-day.push.active,.wo-day.push:hover{background:rgba(255,107,74,.1);border-color:var(--push)}
.wo-day.push.active .wd-dot{background:var(--push)}
.wo-day.legs.active,.wo-day.legs:hover{background:rgba(226,226,64,.1);border-color:var(--legs)}
.wo-day.legs.active .wd-dot{background:var(--legs)}
.wo-day.upper.active,.wo-day.upper:hover{background:rgba(192,132,252,.1);border-color:var(--upper)}
.wo-day.upper.active .wd-dot{background:var(--upper)}
.wo-day.lower.active,.wo-day.lower:hover{background:rgba(251,146,60,.1);border-color:var(--lower)}
.wo-day.lower.active .wd-dot{background:var(--lower)}
.wo-day.rest .wd-type{color:var(--muted);font-size:9px}
/* Exercise card in logging mode */
.ex-log-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ex-log-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
.ex-log-name{font-size:14px;font-weight:800;letter-spacing:-0.2px}
.ex-log-prev{font-size:10px;color:var(--muted)}
.ex-log-body{padding:12px 14px}
.set-row{display:grid;grid-template-columns:80px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px;padding:8px;border-radius:8px;background:var(--bg4)}
.set-row.done-row{border-left:3px solid var(--good)}
.set-badge{font-size:9px;padding:4px 7px;border-radius:5px;text-align:center;letter-spacing:0.3px;font-weight:700}
.set-badge.warm{background:rgba(96,165,250,.15);color:var(--info)}
.set-badge.adj{background:rgba(251,191,36,.15);color:var(--warn)}
.set-badge.work{background:rgba(74,222,128,.15);color:var(--good)}
.set-label{font-size:10px;color:var(--muted);text-align:center;margin-top:2px;font-weight:700}
.set-inp{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font2);font-size:16px;font-weight:800;padding:10px 6px;text-align:center;width:100%;outline:none;-webkit-appearance:none}
.set-inp:focus{border-color:var(--good)}
.set-done-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border2);background:var(--bg5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.set-done-btn.done{background:rgba(74,222,128,.2);border-color:var(--good)}
.set-prev{font-size:9px;color:var(--muted);text-align:center}
.set-delta{font-size:8px;font-weight:800;text-align:center;margin-top:4px;line-height:1.15;letter-spacing:.2px;min-height:10px}
/* Timer */
#rest-timer{position:fixed;bottom:70px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px 16px;z-index:150;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.5);min-width:180px}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}
#timer-display{font-size:24px;font-weight:800;font-family:var(--font2);color:var(--good);transition:color .3s,transform .1s;line-height:1}
#rest-timer.show{display:flex}
#timer-skip{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:4px 10px;font-family:var(--font);font-size:9px;cursor:pointer}
/* Workout history */
.wo-hist-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.wo-hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wo-type-chip{padding:4px 12px;border-radius:12px;font-size:10px;font-weight:800;letter-spacing:0.5px;text-transform:uppercase}
.chip-pull{background:rgba(74,158,255,.15);color:var(--pull);border:1px solid rgba(74,158,255,.4)}
.chip-push{background:rgba(255,107,74,.15);color:var(--push);border:1px solid rgba(255,107,74,.4)}
.chip-legs{background:rgba(226,226,64,.15);color:var(--legs);border:1px solid rgba(226,226,64,.4)}
.chip-upper{background:rgba(192,132,252,.15);color:var(--upper);border:1px solid rgba(192,132,252,.4)}
.chip-lower{background:rgba(251,146,60,.15);color:var(--lower);border:1px solid rgba(251,146,60,.4)}
.chip-a1,.chip-a2{background:rgba(255,107,74,.15);color:var(--push);border:1px solid rgba(255,107,74,.4)}
.chip-b1,.chip-b2{background:rgba(74,158,255,.15);color:var(--pull);border:1px solid rgba(74,158,255,.4)}
.chip-c1{background:rgba(226,226,64,.15);color:var(--legs);border:1px solid rgba(226,226,64,.4)}
.chip-c2{background:rgba(251,146,60,.15);color:var(--lower);border:1px solid rgba(251,146,60,.4)}
.wo-day.a1 .wd-type,.wo-day.a2 .wd-type{color:var(--push)}
.wo-day.b1 .wd-type,.wo-day.b2 .wd-type{color:var(--pull)}
.wo-day.c1 .wd-type{color:var(--legs)}
.wo-day.c2 .wd-type{color:var(--lower)}
.wo-day.a1.active,.wo-day.a1:hover,.wo-day.a2.active,.wo-day.a2:hover{background:rgba(255,107,74,.1);border-color:var(--push)}
.wo-day.a1.active .wd-dot,.wo-day.a2.active .wd-dot{background:var(--push)}
.wo-day.b1.active,.wo-day.b1:hover,.wo-day.b2.active,.wo-day.b2:hover{background:rgba(74,158,255,.1);border-color:var(--pull)}
.wo-day.b1.active .wd-dot,.wo-day.b2.active .wd-dot{background:var(--pull)}
.wo-day.c1.active,.wo-day.c1:hover{background:rgba(226,226,64,.1);border-color:var(--legs)}
.wo-day.c1.active .wd-dot{background:var(--legs)}
.wo-day.c2.active,.wo-day.c2:hover{background:rgba(251,146,60,.1);border-color:var(--lower)}
.wo-day.c2.active .wd-dot{background:var(--lower)}
.wo-hist-ex{font-size:10px;color:var(--sub);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.wo-hist-ex:last-child{border:none}
.wo-hist-sets{font-size:9px;color:var(--muted);margin-left:8px}
/* Progress chart filters */
.cf{background:var(--bg4);border:1px solid var(--border2);border-radius:6px;font-family:var(--font);font-size:9px;padding:5px 10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all .2s}
.him-mode .cf.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
/* Meal cards */
.meal-tab-btn{padding:5px 12px;border-radius:20px;font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);background:var(--bg3);border:1px solid var(--border2);transition:all .2s}
.meal-tab-btn.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--good)}
.meal-option{background:var(--bg4);border-radius:8px;padding:12px;margin-bottom:8px;font-size:11px;color:var(--sub);line-height:1.8;border-left:3px solid var(--border2);word-break:break-word;overflow-wrap:break-word}

}

<script>
'use strict';

// ══════════════════════════════════════
// WORKOUT PROGRAM (Push/Pull/Legs/Upper/Lower)
// ══════════════════════════════════════
const WORKOUT_PROGRAM = {
  pull: {
    label:'PULL — Puxar', day:'Segunda', color:'var(--pull)',
    exercises:[
      // 6 exercícios + protocolo adicional · ~60min
      {name:'Remada Curvada',          sets:[{t:'warm',l:'Aquecimento',s:2,r:'10–15',rest:60},{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:105},{t:'adj',l:'Ajuste 2',s:1,r:'2–4',rest:105},{t:'work',l:'Trabalho',s:3,r:'6–10',rest:150}]},
      {name:'Barra Fixa',              sets:[{t:'warm',l:'Aquecimento',s:1,r:'5–8',rest:90},{t:'work',l:'Trabalho',s:4,r:'6–10',rest:150,note:'Carga extra ao chegar em 10 reps limpas'}]},

      {name:'Rosca Direta Cabo',       sets:[{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:90},{t:'work',l:'Trabalho',s:2,r:'8–12',rest:90,note:'Rest pause na última'}]},
      {name:'Rosca Martelo Halteres',  sets:[{t:'work',l:'Trabalho',s:3,r:'8–12',rest:90,note:'Braquial + braquiorradial — espessura de braço'}]},
      // ── Protocolo adicional ──
      {name:'🦵 Panturrilha em Pé',   sets:[{t:'work',l:'Adicional 1',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 2',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 3',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 4 · Drop',s:1,r:'20–25',rest:45}]},
    ]
  },
  push: {
    label:'PUSH — Empurrar', day:'Terça', color:'var(--push)',
    exercises:[
      // 6 exercícios · ~16 séries de trabalho · ~60min — ombro enfatizado
      {name:'Supino Inclinado Halteres',sets:[{t:'warm',l:'Aquecimento',s:2,r:'10–15',rest:60},{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:105},{t:'adj',l:'Ajuste 2',s:1,r:'2–4',rest:105},{t:'work',l:'Trabalho',s:3,r:'6–10',rest:150}]},
      {name:'Supino Reto Barra',        sets:[{t:'warm',l:'Aquecimento',s:1,r:'10–15',rest:60},{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:105},{t:'work',l:'Trabalho',s:3,r:'6–10',rest:150,note:'Composto livre — maior recrutamento'}]},
      {name:'Paralela',                 sets:[{t:'warm',l:'Aquecimento',s:1,r:'8–10',rest:60},{t:'work',l:'Trabalho',s:3,r:'8–12',rest:120,note:'Tronco inclinado p/ frente = peito. Carga extra ao dominar 12 reps'}]},
      {name:'Desenvolvimento Militar Halteres',sets:[{t:'warm',l:'Aquecimento',s:1,r:'10–15',rest:60},{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:90},{t:'work',l:'Trabalho',s:3,r:'8–12',rest:120,note:'OHP livre — deltóide anterior + medial + tríceps'}]},
      {name:'Elevação Lateral Sentado', sets:[{t:'adj',l:'Ajuste 1',s:1,r:'8–12',rest:60},{t:'work',l:'Trabalho',s:4,r:'10–15',rest:60,note:'4 séries — deltóide medial prioridade. Drop set na última'}]},
      {name:'Tríceps Testa (Skull Crusher)',sets:[{t:'warm',l:'Aquecimento',s:1,r:'10–15',rest:60},{t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:90},{t:'work',l:'Trabalho',s:3,r:'8–12',rest:120,note:'Barra EZ ou halteres — cotovelos fixos, foco no longo'}]},

      {name:'🦵 Panturrilha em Pé',    sets:[{t:'work',l:'Adicional 1',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 2',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 3',s:1,r:'15–20',rest:45},{t:'work',l:'Adicional 4 · Drop',s:1,r:'20–25',rest:45}]},
    ]
  },
  legs: {
    label:'LEGS — Pernas', day:'Quarta', color:'var(--legs)',
    exercises:[
      // 6 exercícios · ~17 séries de trabalho · ~60min — glúteo prioridade
      {name:'Agachamento Livre',    sets:[{t:'warm',l:'Aquecimento',s:3,r:'8–12',rest:90},{t:'adj',l:'Ajuste 1',s:2,r:'4–6',rest:120},{t:'work',l:'Trabalho',s:4,r:'6–10',rest:180,note:'Prioridade #1 — desça fundo, glúteo+coxa'}]},

function switchProgram(n){
  activeProgram=n;
  localStorage.setItem('bt_program',n);
  activeWorkoutType=null;
  render();
}

// ── Gestão de exercícios (customizações salvas no localStorage) ──
function getCustomProgram(){
  try{ return JSON.parse(localStorage.getItem('bt_custom_prog')||'null'); }catch{ return null; }
}
function saveCustomProgram(prog){
  localStorage.setItem('bt_custom_prog', JSON.stringify(prog));
}
function getWorkoutProgram(){
  // Retorna o programa ativo com customizações aplicadas
  const base = JSON.parse(JSON.stringify(getActiveProgram())); // deep clone
  const custom = getCustomProgram();
  if(!custom || custom.program !== activeProgram) return base;
  Object.entries(custom.overrides||{}).forEach(([key,data])=>{
    if(base[key]) base[key].exercises = data;
  });
  return base;
}

// ── Profile data ──
function getD(){
  const p=PROFILES[CP],s=getSettings(),entries=getEntries();
  const initW=s?.weight||p.initialWeight||60;
  const goalW=s?.goal||p.goalWeight||55;
  const h=s?.height||p.height||1.65;
  const latest=entries.length>0?entries[entries.length-1]:null;
  const curW=latest?.weight||initW;
  const totalD=goalW-initW;
  const progress=totalD!==0?Math.min(Math.max(((curW-initW)/totalD)*100,0),100):100;
  const remaining=(goalW-curW).toFixed(1);
  const bmi=h?(curW/(h*h)).toFixed(1):null;
  const bmiInfo=getBMI(bmi);
  const wp=entries.length>=2?((entries[entries.length-1].weight-entries[entries.length-2].weight).toFixed(1)):null;
  const weeks=Math.abs(remaining)>0.1?Math.ceil(Math.abs(remaining)/0.3):0;
  const bf=estimateBF(latest,h);
  return{p,s,entries,initW,goalW,h,latest,curW,totalD,progress,remaining,bmi,bmiInfo,wp,weeks,bf};
}
function getBMI(b){
  if(!b)return{label:'—',color:'var(--muted)'};
  const n=parseFloat(b);
  if(n<18.5)return{label:'Abaixo do peso',color:'var(--info)'};
  if(n<25)return{label:'Peso normal',color:'var(--good)'};
  if(n<30)return{label:'Sobrepeso',color:'var(--warn)'};
  return{label:'Obesidade',color:'var(--bad)'};
}
function estimateBF(l,h){
  if(!l||!h)return null;
  if(CP==='him'&&l.waist&&l.neck){
    const v=495/(1.0324-0.19077*Math.log10(l.waist-l.neck)+0.15456*Math.log10(h*100))-450;
    return Math.max(4,Math.min(50,parseFloat(v.toFixed(1))));
  }
  if(false){
    const v=495/(1.29579-0.35004*Math.log10(l.waist+l.hip-l.neck)+0.22100*Math.log10(h*100))-450;
    return Math.max(10,Math.min(55,parseFloat(v.toFixed(1))));
  }
  return null;
}
function fmtD(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtFull(d){return new Date(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});}

// ── Workout stats ──
function getMaxLoad(exName){
  return getWorkouts().reduce((mx,s)=>{
    const ex=s.exercises?.find(e=>e.name===exName);
    if(ex){ex.sets.forEach(st=>{if(st.weight&&st.weight>mx)mx=st.weight;});}
    return mx;
  },0);
}
function getLastLoad(exName,type){
  const last=getLastWorkout(type);
  if(!last)return null;
  const ex=last.exercises?.find(e=>e.name===exName);
  if(!ex)return null;
  const ws=ex.sets.filter(s=>s.t==='work'&&s.weight);
  if(!ws.length)return null;
  return{weight:ws[0].weight,reps:ws[0].reps,all:ws.map(s=>`${s.weight}kg×${s.reps}`).join(' / ')};
}
function getVolumeHistory(exName){
  return getWorkouts()
    .filter(s=>s.exercises?.find(e=>e.name===exName))
    .slice(-12)
    .map(s=>{
      const ex=s.exercises.find(e=>e.name===exName);
      const max=ex.sets.filter(st=>st.t==='work'&&st.weight).reduce((m,st)=>st.weight>m?st.weight:m,0);
      return{date:fmtD(s.date),maxW:max};
    });
}
function getTotalSessions(){return getWorkouts().length;}
function getThisWeekSessions(){
  const now=new Date(),wk=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((wk+6)%7));mon.setHours(0,0,0,0);
  return getWorkouts().filter(s=>new Date(s.date)>=mon).length;
}

  const fld=(m,cls='')=>{
    const lastVal=migrLast[m.key];

}
function saveEntry(){
  const p=PROFILES[CP];
  const w=document.getElementById('f_weight')?.value;
  if(!w){alert('Informe o peso!');return;}
  const btn=document.getElementById('save-btn');
  btn.textContent='Salvando...';btn.disabled=true;

  // Start with last entry values as base (preserves fields not filled today)
  const entries=getEntries();
  const last=entries.length>0?{...entries[entries.length-1]}:{};
  // Remove metadata from last entry
  delete last.id; delete last.date;

  // Migrate old field names → new ones (one-time compat)
  const migrations={'bicep_l':'bicep_rel_l','bicep_r':'bicep_rel_r'};
  Object.entries(migrations).forEach(([oldKey,newKey])=>{
    if(last[oldKey]!==undefined && last[newKey]===undefined){
      last[newKey]=last[oldKey];
    }
    delete last[oldKey];
  });

  const entry={...last, date:new Date().toISOString(), id:Date.now()};

  // Override with today's filled fields
  p.measurements.forEach(m=>{
    const v=document.getElementById('f_'+m.key)?.value;
    if(v!==undefined && v!=='') entry[m.key]=parseFloat(v);
  });

  _cache.entries[CP].push(entry);
  const done=()=>{btn.textContent='✓ Salvo!';setTimeout(()=>go('dashboard'),900);};
  if(window._fb){window._fb.saveEntry(CP,entry).then(done).catch(e=>{console.error(e);done();});}else{done();}
}

async function loadPhotoMeta(){
  if(!window._fb) return;
  try{
    const meta=await window._fb.getPhotoMeta(CP);
    _photoMeta=meta||{photos:[]};
    if(!_photoMeta.photos) _photoMeta.photos=[];
  }catch(e){ _photoMeta={photos:[]}; }
}

async function uploadProgressPhoto(file, label, category='frontal'){
  if(!file||!window._fb) return;
  _photoLoading=true; render();
  try{
    // Compress image before upload
    const compressed=await compressImage(file, 800);
    const photoId='photo_'+Date.now();
    const url=await window._fb.uploadPhoto(CP, photoId, compressed);
    // Save meta in Firestore
    const entry={
      id:photoId,
      url,
      date:localDayKey(),
      label:label||'',
      category:category||'frontal',
      weight:getD().curW||0,
    };
    _photoMeta.photos.push(entry);
    await window._fb.savePhotoMeta(CP, _photoMeta);
    // Also save URL to localStorage as cache
    try{localStorage.setItem('bt_photo_cache_'+photoId, url);}catch(e){}
  }catch(e){
    showSyncStatus('❌ Erro ao enviar foto: '+e.message,'var(--bad)');
  }
  _photoLoading=false; evSubTab='fotos'; render();
}

async function deletePhoto(photoId){
  if(!confirm('Excluir esta foto?')) return;
  try{
    await window._fb.deletePhoto(CP, photoId);
    _photoMeta.photos=_photoMeta.photos.filter(p=>p.id!==photoId);
    await window._fb.savePhotoMeta(CP, _photoMeta);
    if(_compareA===photoId) _compareA=null;
    if(_compareB===photoId) _compareB=null;
    localStorage.removeItem('bt_photo_cache_'+photoId);
  }catch(e){ showSyncStatus('❌ Erro ao excluir','var(--bad)'); }
  render();
}

function compressImage(file, maxW){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    const url=URL.createObjectURL(file);
    img.onload=()=>{
      const ratio=Math.min(maxW/img.width, maxW/img.height, 1);
      const canvas=document.createElement('canvas');
      canvas.width=Math.round(img.width*ratio);
      canvas.height=Math.round(img.height*ratio);
      canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);
      URL.revokeObjectURL(url);
      canvas.toBlob(blob=>blob?resolve(blob):reject(new Error('Compression failed')),'image/jpeg',0.82);
    };
    img.onerror=reject;
    img.src=url;
  });
}

  const uploadSection=`
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">📸 Nova Foto</div>
      <div style="margin-bottom:12px">
        <label class="flabel">Rótulo (ex: Semana 1, Mês 3)</label>
        <input type="text" id="photo-label" placeholder="Ex: Início, 1 mês, 3 meses..." style="width:100%"/>
      </div>
      <div style="margin-bottom:14px">
        <label class="flabel">Posição</label>
        <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px">${catBtns}</div>
      </div>
      ${uploadButtons}
    </div>`;


  // Photo grid — grouped by category
  const CAT_LABELS={frontal:{label:'Frontal',icon:'🧍'},costas:{label:'Costas',icon:'🔄'},lateral:{label:'Lateral',icon:'↔️'}};
  const activeCat=window._photoCat||'frontal';
  const catPhotos=photos.filter(p=>(p.category||'frontal')===activeCat);
  const catTabs=`<div style="display:flex;gap:8px;margin-bottom:12px">
    ${Object.entries(CAT_LABELS).map(([id,{label,icon}])=>`
      <button onclick="window._photoCat='${id}';render()"
        style="flex:1;padding:8px 4px;border-radius:10px;font-family:var(--font2);font-size:11px;font-weight:700;cursor:pointer;
               border:2px solid ${activeCat===id?ac:'var(--border2)'};
               background:${activeCat===id?'var(--himb)':'var(--bg4)'};
               color:${activeCat===id?ac:'var(--muted)'};text-align:center">
        <div style="font-size:18px;margin-bottom:2px">${icon}</div>${label}
        <div style="font-size:9px;opacity:.7">${photos.filter(p=>(p.category||'frontal')===id).length} fotos</div>
      </button>`).join('')}
  </div>`;
  const selectTip=catPhotos.length>=2&&!(_compareA&&_compareB)?
    `<div style="font-size:10px;color:var(--info);text-align:center;margin-bottom:10px;padding:8px;background:rgba(96,165,250,.1);border-radius:8px">
      💡 Toque em 2 fotos para comparar lado a lado
    </div>`:'';

  const photoGrid=photos.length===0
    ?`<div class="card empty"><div class="empty-ico">📸</div><div class="empty-txt">Nenhuma foto ${CAT_LABELS[activeCat]?.label||''} ainda.<br>Adicione acima!</div></div>`
    :`${selectTip}<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      ${catPhotos.map(p=>{
        const isA=_compareA===p.id, isB=_compareB===p.id;
        const selected=isA||isB;
        return`<div style="border-radius:12px;overflow:hidden;border:2px solid ${isA?ac:isB?'var(--info)':'var(--border)'};cursor:pointer;position:relative"
          onclick="(function(){
            if(_compareA===null&&!_compareB) _compareA='${p.id}';
            else if(_compareA&&!_compareB&&_compareA!=='${p.id}') _compareB='${p.id}';
            else if(_compareA==='${p.id}') _compareA=null;
            else if(_compareB==='${p.id}') _compareB=null;
            else{_compareA='${p.id}';_compareB=null;}
            render();
          })()">
          <img src="${p.url}" style="width:100%;aspect-ratio:3/4;object-fit:cover;display:block" loading="lazy"/>
          ${selected?`<div style="position:absolute;top:6px;left:6px;background:${isA?ac:'var(--info)'};color:#08080e;border-radius:20px;padding:2px 8px;font-size:10px;font-weight:800">${isA?'A':'B'}</div>`:''}
          <div style="padding:8px;background:var(--bg4)">
            <div style="font-size:11px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${p.label||'Sem rótulo'}</div>
            <div style="display:flex;justify-content:space-between;align-items:center;margin-top:2px">
              <div style="font-size:9px;color:var(--muted)">${new Date(p.date).toLocaleDateString('pt-BR')} · ${p.weight}kg</div>
              <button onclick="event.stopPropagation();deletePhoto('${p.id}')"
                style="background:none;border:none;color:var(--bad);cursor:pointer;font-size:14px;padding:2px 4px;flex-shrink:0">🗑️</button>
            </div>
          </div>
        </div>`;
      }).join('')}
    </div>`;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📸 Fotos de Progresso</div>
    ${subtabs}
    ${compareSection}
    ${uploadSection}
    <div class="sec-title" style="padding:0 0 12px">🗓️ Histórico de Fotos (${photos.length})</div>
    ${catTabs}
    ${photoGrid}
  </div>`;
}

// METAS EDITÁVEIS
// ══════════════════════════════════════
function getCustomTargets(){
  try{ return JSON.parse(localStorage.getItem('bt_custom_targets')||'{}'); }catch{ return {}; }
}
function saveCustomTarget(key, val){
  const t=getCustomTargets();
  if(val===''||isNaN(parseFloat(val))) delete t[key];
  else t[key]=parseFloat(val);
  localStorage.setItem('bt_custom_targets',JSON.stringify(t));
}
function getTarget(measurement){
  const custom=getCustomTargets();
  return custom[measurement.key]!==undefined ? custom[measurement.key] : measurement.target;
}
function resetAllTargets(){
  if(!confirm('Redefinir todas as metas para os valores padrão?')) return;
  localStorage.removeItem('bt_custom_targets');
  render();
}

function buildMetas(subtabs){
  const ac=PROFILES[CP].accentHex;
  const p=PROFILES[CP];
  const custom=getCustomTargets();
  const entries=getEntries();
  const latest=entries.length>0?entries[entries.length-1]:null;

  const groups=[
    {label:'⚖️ Peso',keys:['weight']},
    {label:'🫁 Tronco',keys:['chest','waist','hip','shoulder','neck']},
    {label:'💪 Braços',keys:['bicep_rel_l','bicep_rel_r','bicep_con_l','bicep_con_r','forearm_l','forearm_r']},
    {label:'🦵 Pernas',keys:['glutes','thigh_sup_l','thigh_sup_r','thigh_inf_l','thigh_inf_r','calf_l','calf_r']},
  ];

  const groupCards=groups.map(g=>{
    const rows=g.keys.map(k=>{
      const m=p.measurements.find(x=>x.key===k); if(!m) return'';
      const cur=latest?.[k]||null;
      const tgt=getTarget(m);
      const isCustom=custom[k]!==undefined;
      const pct=cur&&tgt?Math.min(Math.round(parseFloat(cur)/tgt*100),100):0;
      return`<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,.05)">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:8px">
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;display:flex;align-items:center;gap:6px">
              ${m.icon} ${m.label}
              ${isCustom?`<span style="font-size:8px;background:rgba(96,165,250,.15);color:var(--info);padding:1px 6px;border-radius:8px;font-weight:700">editada</span>`:''}
            </div>
            ${cur?`<div style="font-size:10px;color:var(--muted);margin-top:1px">Atual: ${cur}${m.unit}</div>`:'<div style="font-size:10px;color:var(--muted)">Sem registro</div>'}
          </div>
          <div style="display:flex;align-items:center;gap:6px;flex-shrink:0">
            <span style="font-size:10px;color:var(--muted)">${m.unit}</span>
            <input type="number" step="${m.unit==='kg'?'0.5':'1'}" min="0"
              value="${tgt}"
              onchange="saveCustomTarget('${k}',this.value);render()"
              style="width:70px;background:var(--bg4);border:1px solid ${isCustom?ac:'var(--border2)'};border-radius:8px;
                     color:${isCustom?ac:'var(--text)'};font-family:var(--font2);font-size:16px;font-weight:700;
                     padding:6px 8px;text-align:center;outline:none;-webkit-appearance:none"/>
          </div>
        </div>
        ${cur&&tgt?`<div class="bar sm"><div class="fill" style="width:${Math.max(pct,2)}%;background:${pct>=100?'var(--good)':ac}"></div></div>
        <div style="font-size:9px;color:var(--muted);text-align:right;margin-top:2px">${pct}% da meta</div>`:''}
      </div>`;
    }).join('');
    return`<div class="card" style="margin-bottom:12px">
      <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px">${g.label}</div>
      ${rows}
    </div>`;
  }).join('');

  const hasCustom=Object.keys(custom).length>0;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">🎯 Editar Metas</div>
    ${subtabs}
    <div class="card-accent" style="margin-bottom:14px;border-color:${ac}28">
      <div style="font-size:11px;color:var(--sub);line-height:1.8;margin-bottom:${hasCustom?'10px':'0'}">
        Toque no valor de qualquer meta para editar diretamente.<br>
        Metas editadas aparecem destacadas em <span style="color:${ac}">amarelo</span>.
      </div>
      ${hasCustom?`<button onclick="resetAllTargets()"
        style="padding:8px 16px;background:transparent;border:1px solid var(--border2);border-radius:8px;
               font-family:var(--font2);font-size:10px;font-weight:700;color:var(--muted);cursor:pointer">
        ↺ Redefinir tudo para o padrão
      </button>`:''}
    </div>
    ${groupCards}
  </div>`;
}

        <div class="card"><div style="font-size:24px;margin-bottom:6px">💪</div><div style="font-size:28px;font-weight:700;color:${ac}">${getTotalSessions()}</div><div class="lbl" style="margin:3px 0">Treinos Totais</div><div style="font-size:10px;color:var(--muted)">${getThisWeekSessions()} esta semana</div></div>
      </div>

        <div class="card"><div style="font-weight:700;margin-bottom:12px;font-size:12px">IMC — Classificação</div>${[['<18,5','Abaixo do peso','var(--info)'],['18,5–24,9','Normal','var(--good)'],['25–29,9','Sobrepeso','var(--warn)'],['≥30','Obesidade','var(--bad)']].map(([r,l,c])=>`<div class="trow"><span style="font-size:10px;color:var(--sub)">${r}</span><span style="font-size:10px;color:${c}">${l}</span></div>`).join('')}</div>
        <div class="card"><div style="font-weight:700;margin-bottom:12px;font-size:12px">% Gordura — ${'Homem'}</div>${(CP==='him'?[['<10%','Atleta','var(--info)'],['10–14%','Excelente','var(--good)'],['15–19%','Bom','var(--good)'],['20–24%','Médio','var(--warn)'],['≥25%','Excesso','var(--bad)']]:[ ['<14%','Atleta','var(--info)'],['14–20%','Excelente','var(--good)'],['21–24%','Bom','var(--good)'],['25–31%','Médio','var(--warn)'],['≥32%','Excesso','var(--bad)']]).map(([r,l,c])=>`<div class="trow"><span style="font-size:10px;color:var(--sub)">${r}</span><span style="font-size:10px;color:${c}">${l}</span></div>`).join('')}</div>

    </div>`;
  }
  if(evSubTab==='1rm'){

      ${subtabs}

      <!-- Calculator -->
      <div class="card" style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">Calcular 1 Rep Máximo</div>

          <label class="flabel">Exercício</label>
          <select id="rm-ex" onchange="(function(){const ex=this.value;const ml=JSON.parse(this.dataset.maxloads||'{}');const w=ml[ex]||0;document.getElementById('rm-weight').value=w||'';rmCalc();})" data-maxloads='${JSON.stringify(maxLoads)}' style="width:100%">
            <option value="">Selecione...</option>
            ${allEx.map(ex=>`<option value="${ex.name}">${ex.name} — ${ex.woType}${maxLoads[ex.name]?' (max: '+maxLoads[ex.name]+'kg)':''}</option>`).join('')}
          </select>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px">
          <div>
            <label class="flabel">Carga utilizada (kg)</label>
            <input type="number" id="rm-weight" step="0.5" min="0" placeholder="kg" oninput="rmCalc()" style="width:100%"/>
          </div>
          <div>
            <label class="flabel">Repetições feitas</label>
            <input type="number" id="rm-reps" step="1" min="1" max="30" placeholder="reps" value="8" oninput="rmCalc()" style="width:100%"/>
          </div>
        </div>
        <!-- Result -->
        <div id="rm-result" style="background:var(--bg4);border-radius:12px;padding:16px;text-align:center;border:1px solid var(--border2)">
          <div style="font-size:11px;color:var(--muted);margin-bottom:6px">Preencha os campos acima</div>
        </div>
      </div>

      <!-- PR Table -->
      <div class="card" style="margin-bottom:14px">
        <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">🏆 PRs Registrados</div>
        ${allEx.filter(ex=>maxLoads[ex.name]).length===0
          ?'<div class="no-data">Registre treinos com carga para ver os PRs</div>'
          :allEx.filter(ex=>maxLoads[ex.name]).map(ex=>{
            const w=maxLoads[ex.name];
            const rm1=parseFloat((w*(1+1/30)).toFixed(1));
            return`<div class="trow">
              <div style="min-width:0;flex:1">
                <div style="font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${ex.name}</div>
                <div style="font-size:9px;color:${ex.color};margin-top:1px">${ex.woType}</div>
              </div>
              <div style="text-align:right;flex-shrink:0;margin-left:8px">
                <div style="font-size:13px;font-weight:800;color:${ac}">${w}kg</div>
                <div style="font-size:9px;color:var(--muted)">~1RM: ${rm1}kg</div>
              </div>
            </div>`;
          }).join('')
        }
      </div>

      <!-- Percentage table -->
      <div class="card">
        <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px">📊 Tabela de Percentuais</div>
        <div id="rm-pct-table">
          <div style="font-size:10px;color:var(--muted);text-align:center">Calcule um 1RM acima para ver a tabela</div>
        </div>
      </div>
    </div>`;
  }

  if(evSubTab==='metas') return buildMetas(subtabs);
  if(evSubTab==='history'){
    const rows=entries.length===0?`<div class="card empty"><div class="empty-ico">📅</div><div class="empty-txt">Nenhum registro</div></div>`:[...entries].reverse().slice(0,20).map(e=>{
      const i=entries.findIndex(x=>x.id===e.id);
      const prv=i>0?entries[i-1]:null;
      const diff=prv?(e.weight-prv.weight).toFixed(1):null;
      return`<div class="card" style="padding:12px 14px;margin-bottom:8px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
          <div style="font-size:10px;color:var(--muted);letter-spacing:1px;text-transform:uppercase">${fmtFull(e.date)}</div>
          <div style="font-size:16px;font-weight:800;color:${ac}">${e.weight}kg ${diff?`<span style="font-size:10px;font-weight:700" class="${parseFloat(diff)>0?'diff-up':'diff-dn'}">${parseFloat(diff)>0?'+':''}${diff}</span>`:''}</div>
        </div>
        <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">
          <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:8px;color:var(--muted);margin-bottom:2px">Glúteos</div><div style="font-size:12px;font-weight:700;color:var(--sub)">${e.glutes?e.glutes+'cm':'—'}</div></div>
          <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:8px;color:var(--muted);margin-bottom:2px">Coxa Sup</div><div style="font-size:12px;font-weight:700;color:var(--sub)">${e.thigh_sup_l?e.thigh_sup_l+'cm':'—'}</div></div>
          <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:8px;color:var(--muted);margin-bottom:2px">Panturrilha</div><div style="font-size:12px;font-weight:700;color:var(--sub)">${e.calf_l?e.calf_l+'cm':'—'}</div></div>
          <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:8px;color:var(--muted);margin-bottom:2px">Cintura</div><div style="font-size:12px;font-weight:700;color:var(--sub)">${e.waist?e.waist+'cm':'—'}</div></div>
        </div>
      </div>`;
    }).join('');
    return`<div class="page">
      <div class="sec-title" style="padding:0 0 14px">🗓️ Histórico</div>
      ${subtabs}
      <div style="display:none">
        <span>Data</span><span>Peso</span><span>Glúteos</span><span>Coxa Sup</span><span>Panturrilha</span><span>Cintura</span>
      </div>${rows}
    </div>`;
  }
  // Chart
  const cfs=p.measurements.slice(0,10).map(m=>`<button class="cf${m.key==='weight'?' active':''}" onclick="setChartKey('${m.key}',this)">${m.label}</button>`).join('');
  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📈 Evolução</div>
    ${subtabs}
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">${cfs}</div>
    <div class="card" style="margin-bottom:20px"><div style="height:220px;position:relative"><canvas id="mainChart"></canvas></div></div>
    <div class="sec-title" style="padding:0 0 14px">💪 Evolução por Exercício</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">
      ${CP==='him'?Object.values(getWorkoutProgram()).flatMap(w=>w.exercises).filter((_,i)=>i%3===0).slice(0,8).map(ex=>`<button class="cf${woPrgExercise===ex.name?' active':''}" onclick="setWoChart('${ex.name}',this)">${ex.name.substring(0,14)}</button>`).join(''):''}
    </div>
    <div class="card"><div style="height:200px;position:relative"><canvas id="woChart"></canvas></div></div>
  </div>`;
}
function setChartKey(k,btn){
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const entries=getEntries(),p=PROFILES[CP];
  const canvas=document.getElementById('mainChart');
  if(!canvas)return;
  const data=entries.slice(-16).map(e=>({x:fmtD(e.date),y:parseFloat(e[k]||0)})).filter(d=>d.y>0);
  if(charts.main){charts.main.destroy();}
  if(data.length<2){canvas.parentElement.innerHTML='<div class="no-data">Registre ao menos 2 medições</div>';return;}
  charts.main=mkLine(canvas,data,p.accentHex);
}
function setWoChart(name,btn){
  woPrgExercise=name;
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const canvas=document.getElementById('woChart');if(!canvas)return;
  const data=getVolumeHistory(name);
  if(charts.wo){charts.wo.destroy();}
  if(data.length<2){canvas.parentElement.innerHTML='<div class="no-data">Sem dados suficientes para este exercício</div>';return;}
  charts.wo=mkLine(canvas,data.map(d=>({x:d.date,y:d.maxW})),PROFILES[CP].accentHex);
}
function mkLine(canvas,data,color){

}
function rmCalc(){
  const w=parseFloat(document.getElementById('rm-weight')?.value)||0;
  const r=parseInt(document.getElementById('rm-reps')?.value)||1;
  const res=document.getElementById('rm-result');

  res.innerHTML=`
    <div style="font-size:11px;color:var(--muted);margin-bottom:4px">1RM ESTIMADO</div>

  if(tbl){

    tbl.innerHTML=`<div style="display:grid;grid-template-columns:auto 1fr auto;gap:0">
      <div style="font-size:8px;color:var(--muted);padding:4px 8px;font-weight:700">%</div>
      <div style="font-size:8px;color:var(--muted);padding:4px 8px;font-weight:700">Zona</div>
      <div style="font-size:8px;color:var(--muted);padding:4px 8px;font-weight:700;text-align:right">Carga</div>
      ${pcts.map(([pct,label,color])=>`
        <div style="font-size:12px;font-weight:800;color:${color};padding:6px 8px;border-top:1px solid rgba(255,255,255,.04)">${pct}%</div>
        <div style="font-size:11px;color:var(--sub);padding:6px 8px;border-top:1px solid rgba(255,255,255,.04)">${label}</div>

// Feedback de progressão de UMA série vs. o último treino / recorde
function setFeedback(w,r,prevW,prevR,maxLoad){
  if(!w||!r) return '';
  if(maxLoad>0 && w>maxLoad) return `<span style="color:var(--him)">🏆 PR ${w}kg</span>`;
  if(prevW>0){
    if(w>prevW) return `<span style="color:var(--good)">↑ +${+(w-prevW).toFixed(1)}kg</span>`;
    if(w===prevW && r>prevR) return `<span style="color:var(--good)">↑ +${r-prevR} rep</span>`;
    if(w===prevW && r===prevR) return `<span style="color:var(--warn)">= igualou</span>`;
    if(w<prevW) return `<span style="color:var(--bad)">↓ -${+(prevW-w).toFixed(1)}kg</span>`;
    if(w===prevW && r<prevR) return `<span style="color:var(--bad)">↓ -${prevR-r} rep</span>`;
  }
  if(maxLoad>0 && w===maxLoad) return `<span style="color:var(--him)">= recorde</span>`;
  return `<span style="color:var(--good)">✓ feito</span>`;
}
function doneSet(exIdx,si,restSecs,exIdxOrName,isWork,prevW,prevR,maxLoad){
  const btn=document.getElementById(`btn_${exIdx}_${si}`);
  const row=document.getElementById(`srow_${exIdx}_${si}`);
  if(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'✓':'○';}
  if(row){row.classList.toggle('done-row');}
  const isDone=btn&&btn.classList.contains('done');
  // Selo de progressão (só séries de trabalho)
  if(isWork){
    const badge=document.getElementById(`delta_${exIdx}_${si}`);
    if(badge){
      if(isDone){
        const w=parseFloat(document.getElementById(`w_${exIdx}_${si}`)?.value)||0;
        const r=parseInt(document.getElementById(`r_${exIdx}_${si}`)?.value)||0;
        badge.innerHTML=setFeedback(w,r,prevW||0,prevR||0,maxLoad||0);
      } else { badge.innerHTML=''; }
    }
  }
  if(isDone&&restSecs>0){
    // Look up exercise name safely
    let exName='';
    try{
      const prog=getWorkoutProgram();
      if(activeWorkoutType&&prog[activeWorkoutType]){
        exName=prog[activeWorkoutType].exercises[exIdxOrName]?.name||'';
      }
    }catch(e){}
    startTimer(restSecs,exName);
  }
}

// ── Vibration helpers ──
function vibrEnabled(){return localStorage.getItem('bt_vibr')!=='off';}
function toggleVibration(){
  const on=vibrEnabled();
  localStorage.setItem('bt_vibr',on?'off':'on');
  const btn=document.getElementById('vibr-toggle');
  if(btn){btn.textContent=on?'🔕':'📳';btn.style.color=on?'var(--muted)':'var(--him)';}
  if(!on&&'vibrate' in navigator) navigator.vibrate([100,50,100]);
}
function vibrate(pattern){
  if(vibrEnabled()&&'vibrate' in navigator) navigator.vibrate(pattern);
}

function startTimer(secs, exName=''){
  stopTimer();
  timerSeconds=secs;
  const el=document.getElementById('rest-timer');
  const disp=document.getElementById('timer-display');
  const exEl=document.getElementById('timer-exercise');
  const vBtn=document.getElementById('vibr-toggle');
  if(!el||!disp)return;
  if(exEl) exEl.textContent=exName||'';
  if(vBtn){vBtn.textContent=vibrEnabled()?'📳':'🔕';vBtn.style.color=vibrEnabled()?'var(--him)':'var(--muted)';}
  el.classList.add('show');
  updateTimerDisplay();
  // Short vibration when timer starts
  vibrate([50]);
  timerInterval=setInterval(()=>{
    timerSeconds--;
    updateTimerDisplay();
    // Warning at 10s — 2 short pulses
    if(timerSeconds===10) vibrate([80,40,80]);
    // Warning at 5s — pulse every second
    if(timerSeconds>0&&timerSeconds<=5) vibrate([60]);
    if(timerSeconds<=0) stopTimer();
  },1000);
}
function updateTimerDisplay(){
  const disp=document.getElementById('timer-display');
  if(disp){
    const m=Math.floor(timerSeconds/60),s=timerSeconds%60;
    disp.textContent=`${m}:${String(s).padStart(2,'0')}`;
    disp.style.color=timerSeconds<=10?'var(--bad)':timerSeconds<=30?'var(--warn)':'var(--good)';
    // Pulse animation when low
    if(timerSeconds<=5&&timerSeconds>0) disp.style.transform='scale(1.1)';
    else disp.style.transform='scale(1)';
  }
}
function stopTimer(){
  clearInterval(timerInterval);timerInterval=null;

}

function applyQuickEditSets(woKey, exIdx){
  const sets=window._qeSets||2;
  const reps=window._qeReps||'6–10';
  const rest=150;

  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}
  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  if(custom.overrides[woKey]) baseProg[woKey].exercises=custom.overrides[woKey];

  const ex=baseProg[woKey].exercises[exIdx];
  if(!ex) return;

  // Keep warm/adj sets, replace work sets
  const warmAdj=ex.sets.filter(s=>s.t!=='work');
  const newWork=[];
  for(let i=0;i<sets;i++){
    newWork.push({t:'work',l:sets===1?'Trabalho':`Série ${i+1}`,s:1,r:reps,rest,
      ...(i===sets-1&&ex.sets.find(s=>s.t==='work'&&s.note)?{note:ex.sets.find(s=>s.t==='work').note}:{})
    });
  }
  ex.sets=[...warmAdj,...newWork];

  custom.overrides[woKey]=baseProg[woKey].exercises;
  saveCustomProgram(custom);
  document.getElementById('quick-edit-sets')?.remove();
  showSyncStatus(`✅ ${ex.name} → ${sets} série${sets!==1?'s':''} de trabalho`,'var(--good)');
  render();
}
function fmtElapsed(ms){
  const s=Math.floor(ms/1000);
  const m=Math.floor(s/60);
  const h=Math.floor(m/60);
  if(h>0) return `${h}h ${String(m%60).padStart(2,'0')}min`;
  return `${m}:${String(s%60).padStart(2,'0')}`;
}

function calcSessionVolume(session){
  // Tonelagem = soma de (carga × reps) em séries de trabalho
  let total=0;
  session.exercises?.forEach(ex=>{
    ex.sets.filter(s=>s.t==='work'&&s.weight&&s.reps).forEach(s=>{total+=s.weight*s.reps;});
  });
  return parseFloat(total.toFixed(1));
}
function calcSessionSets(session){
  let total=0;
  session.exercises?.forEach(ex=>{
    total+=ex.sets.filter(s=>s.t==='work'&&s.done).length;
  });
  return total;
}
function saveWorkoutSession(){
  const prog=getWorkoutProgram()[activeWorkoutType];
  if(!prog){alert('Selecione um treino primeiro!');return;}
  const session={id:Date.now(),date:new Date().toISOString(),type:activeWorkoutType,exercises:[]};
  prog.exercises.forEach((ex,ei)=>{
    const sets=[];
    ex.sets.forEach((s,si)=>{
      const w=parseFloat(document.getElementById(`w_${ei}_${si}`)?.value)||0;
      const r=parseInt(document.getElementById(`r_${ei}_${si}`)?.value)||0;
      const done=document.getElementById(`btn_${ei}_${si}`)?.classList.contains('done')||false;
      sets.push({t:s.t,weight:w,reps:r,done});
    });
    session.exercises.push({name:ex.name,sets});
  });
  // Calcular volume da sessão e do último treino igual
  const tonnage=calcSessionVolume(session);
  const totalSets=calcSessionSets(session);
  session.tonnage=tonnage;
  session.totalSets=totalSets;
  session.duration=woStartTime?Math.round((Date.now()-woStartTime)/1000):0;
  const lastSame=getWorkouts().slice().reverse().find(s=>s.type===activeWorkoutType);
  const lastTonnage=lastSame?calcSessionVolume(lastSame):0;
  const lastSets=lastSame?calcSessionSets(lastSame):0;
  const tonnageDiff=lastTonnage>0?parseFloat((tonnage-lastTonnage).toFixed(1)):null;
  const setsDiff=lastSets>0?totalSets-lastSets:null;
  // ── Quanto me desafiei? Séries que superaram o último treino + novos recordes ──
  let beatCount=0, prCount=0, workCount=0;
  session.exercises.forEach(ex=>{
    const histMax=getMaxLoad(ex.name); // recorde ANTES desta sessão (ainda não salva)
    const lastEx=lastSame?.exercises?.find(e=>e.name===ex.name);
    const lastWork=lastEx?lastEx.sets.filter(s=>s.t==='work'&&s.weight>0):[];
    let wi=0;
    ex.sets.filter(s=>s.t==='work').forEach(s=>{
      if(s.weight>0&&s.reps>0){
        workCount++;
        if(histMax>0 && s.weight>histMax) prCount++;
        const pv=lastWork[wi];
        if(pv && (s.weight>pv.weight || (s.weight===pv.weight && s.reps>pv.reps))) beatCount++;
      }
      wi++;
    });
  });
  saveWorkout(session);
  stopTimer();
  woSubTab='history';
  render();
  setTimeout(()=>showWorkoutSummary({tonnage,tonnageDiff,totalSets,setsDiff,beatCount,prCount,workCount,color:prog.color}),120);
}

function buildWoProgress(tabs){

      const max=getMaxLoad(ex.name);

      const first=hist[0]?.maxW||max;

      <div class="grid3">${cards}</div>
    </div>`;
  }).join('');

  const muscleMap={
    'Peito':       {keys:['Supino Reto Máquina','Supino Inclinado Smith/Halteres','Crucifixo Inclinado Halteres/Cabo','Crucifixo Máquina','Paralelas com Sobrecarga','JM Press Smith / Paralelas c/ Sobrecarga'],color:'var(--push)'},

    'Ombros':      {keys:['Desenvolvimento Smith/Halteres','Desenvolvimento Máquina','Elevação Unilateral Polia Média','Elevação Lateral Halteres/Máquina'],color:'var(--upper)'},
    'Bíceps':      {keys:['Rosca Scott Bilateral Máquina','Rosca Unilateral de Costas p/ Polia','Rosca Scott Unilateral Máquina','Rosca Inclinado 45° Halteres'],color:'var(--pull)'},
    'Tríceps':     {keys:['JM Press Smith / Paralelas c/ Sobrecarga','Extensão Tríceps Polia c/ Banco','Francês no Cabo'],color:'var(--push)'},
    'Deltoide Post':{keys:['Crucifixo Inverso Unilateral no Cabo','Crucifixo Inverso Máquina'],color:'var(--upper)'},
    'Quadríceps':  {keys:['Agachamento no Hack','Cadeira Extensora','Cadeira Extensora Unilateral','Leg Press'],color:'var(--legs)'},
    'Posterior':   {keys:['Levantamento Terra Stiff','Mesa Flexora','Cadeira Flexora'],color:'var(--lower)'},
    'Glúteos':     {keys:['Extensão de Quadril Banco Romano','Elevação Pélvica','Cadeira Adutora'],color:'var(--lower)'},
    'Panturrilha': {keys:['Panturrilha Joelhos Estendidos Máq.','Panturrilha no Leg'],color:'var(--legs)'},
  };
  const muscleVolumes=Object.entries(muscleMap).map(([muscle,cfg])=>{
    const cutoff=new Date(Date.now()-7*24*3600*1000);
    const weekSets=workouts.filter(s=>new Date(s.date)>=cutoff).reduce((sum,s)=>{
      cfg.keys.forEach(n=>{const ex=s.exercises?.find(e=>e.name===n);if(ex)sum+=ex.sets.filter(st=>st.t==='work').length;});return sum;},0);
    const totalSets=workouts.reduce((sum,s)=>{cfg.keys.forEach(n=>{const ex=s.exercises?.find(e=>e.name===n);if(ex)sum+=ex.sets.filter(st=>st.t==='work'&&st.done).length;});return sum;},0);
    return{muscle,color:cfg.color,totalSets,weekSets};
  });
  const maxWeekSets=Math.max(...muscleVolumes.map(m=>m.weekSets),1);
  const avgWeek=muscleVolumes.reduce((s,m)=>s+m.weekSets,0)/muscleVolumes.length;
  const alerts=[];

    if(m.weekSets===0&&workouts.some(s=>new Date(s.date)>new Date(Date.now()-7*24*3600*1000)))alerts.push({type:'bad',msg:`${m.muscle} não foi trabalhada essa semana`});

  });
  const entries=getEntries();

  const bilateral=latest?[
    {label:'Bíceps',l:latest.bicep_l,r:latest.bicep_r},

    {label:'Coxa Sup.',l:latest.thigh_sup_l,r:latest.thigh_sup_r},
    {label:'Coxa Inf.',l:latest.thigh_inf_l,r:latest.thigh_inf_r},
    {label:'Panturrilha',l:latest.calf_l,r:latest.calf_r},

    <div class="sec-title" style="padding:0 0 14px">⚖️ Equilíbrio Muscular</div>
    <div class="card" style="margin-bottom:14px">

      <div style="height:260px;position:relative"><canvas id="radarChart"></canvas></div>
      <div style="font-size:9px;color:var(--muted);text-align:center;margin-top:8px">Área maior = mais volume semanal nesse grupo</div>
    </div>
    <div class="card" style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:700;margin-bottom:14px;color:var(--sub)">📊 Volume por Grupo</div>
      ${muscleVolumes.map(m=>{
        const pct=maxWeekSets>0?(m.weekSets/maxWeekSets)*100:0;
        const status=m.weekSets===0?'var(--bad)':m.weekSets<avgWeek*0.5?'var(--warn)':'var(--good)';
        return`<div style="margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;margin-bottom:4px">
            <span style="font-size:11px;color:var(--text)">${m.muscle}</span>
            <div style="display:flex;gap:8px;align-items:center">
              <span style="font-size:9px;color:var(--muted)">${m.totalSets} total</span>
              <span style="font-size:12px;font-weight:700;color:${status}">${m.weekSets}/sem</span>
            </div>
          </div>
          <div class="bar"><div class="fill" style="width:${Math.max(pct,m.weekSets>0?4:0)}%;background:${m.color}"></div></div>
        </div>`;
      }).join('')}
    </div>
    ${alerts.length>0?`<div class="card" style="margin-bottom:14px;border-color:rgba(251,191,36,.3)">
      <div style="font-size:10px;font-weight:700;margin-bottom:10px;color:var(--warn)">⚠️ Alertas</div>
      ${alerts.map(a=>`<div style="display:flex;gap:8px;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span>${a.type==='bad'?'🔴':'🟡'}</span><span style="font-size:11px;color:var(--sub)">${a.msg}</span></div>`).join('')}
    </div>`:'<div class="card" style="margin-bottom:14px;border-color:rgba(74,222,128,.3)"><div style="font-size:11px;color:var(--good);text-align:center;padding:8px">✅ Sem desequilíbrios essa semana</div></div>'}
    ${bilateral.length>0?`<div class="card">
      <div style="font-size:10px;font-weight:700;margin-bottom:12px;color:var(--sub)">📐 Bilateral (Esq. vs Dir.)</div>
      ${bilateral.map(b=>{
        const diff=parseFloat((b.l-b.r).toFixed(1));
        const abs=Math.abs(diff);
        const status=abs<1?'var(--good)':abs<2?'var(--warn)':'var(--bad)';
        return`<div style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;margin-bottom:5px">
            <span style="font-size:11px">${b.label}</span>

          </div>
          <div style="display:grid;grid-template-columns:1fr auto 1fr;gap:6px;align-items:center">
            <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:var(--muted)">Esq</div><div style="font-size:15px;font-weight:700;color:${diff>0?ac:'var(--sub)'}">${b.l}cm</div></div>
            <span style="font-size:10px;color:var(--muted)">vs</span>
            <div style="background:var(--bg4);border-radius:6px;padding:6px;text-align:center"><div style="font-size:9px;color:var(--muted)">Dir</div><div style="font-size:15px;font-weight:700;color:${diff<0?ac:'var(--sub)'}">${b.r}cm</div></div>

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📊 Evolução por Exercício</div>

// ══════════════════════════════════════
function getWeekPlan(){
  try{ return JSON.parse(localStorage.getItem('bt_weekplan_'+getWeekKey())||'{}'); }catch{ return {}; }
}
function saveWeekPlan(plan){
  localStorage.setItem('bt_weekplan_'+getWeekKey(), JSON.stringify(plan));
}
function toggleWeekPlan(dayIdx, woType){
  const plan=getWeekPlan();
  const key='day_'+dayIdx;
  if(plan[key]===woType) delete plan[key];
  else plan[key]=woType;
  saveWeekPlan(plan);
  render();
}
function markWeekDayDone(dayIdx){
  const plan=getWeekPlan();
  plan['done_'+dayIdx]=!plan['done_'+dayIdx];
  saveWeekPlan(plan);
  render();
}

function buildWoPlanner(tabs){
  const ac=PROFILES[CP].accentHex;
  const prog=getWorkoutProgram();
  const schedule=getActiveSchedule();
  const plan=getWeekPlan();
  const workouts=getWorkouts();

  // Get this week's actual sessions
  const now=new Date();
  const mon=new Date(now); mon.setDate(now.getDate()-((now.getDay()+6)%7)); mon.setHours(0,0,0,0);
  const thisWeekSessions=workouts.filter(s=>new Date(s.date)>=mon);

  // Day names for current week
  const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const DAYS_SHORT=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
  const todayDow=(now.getDay()+6)%7; // 0=Mon

  const woTypes=Object.entries(prog);
  const typeColors={pull:'var(--pull)',push:'var(--push)',legs:'var(--legs)',upper:'var(--upper)',lower:'var(--lower)',a:'var(--pull)',b:'var(--push)',c:'var(--legs)',d:'var(--pull)',e:'var(--push)',f:'var(--lower)',rest:'var(--muted)'};

  let planned=0, done=0, total=7;
  const dayCards=DAYS.map((day,i)=>{
    const isToday=i===todayDow;
    const plannedType=plan['day_'+i]||schedule[i]?.type||'rest';
    const isDone=plan['done_'+i]||thisWeekSessions.some(s=>s.type===plannedType&&new Date(s.date)>=mon&&new Date(s.date).getDay()===((i+1)%7));
    const color=typeColors[plannedType]||'var(--muted)';
    const label=prog[plannedType]?.label?.split('—')[0]?.trim()||'Rest';
    if(plannedType!=='rest') planned++;
    if(isDone&&plannedType!=='rest') done++;
    return`<div class="card" style="padding:12px;${isToday?`border-color:${ac};`:''}">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div>
          <div style="font-size:11px;font-weight:800;color:${isToday?ac:'var(--sub)'}">${DAYS_SHORT[i]}${isToday?' <span style="font-size:8px;background:var(--himb);color:var(--him);padding:1px 5px;border-radius:8px">hoje</span>':''}</div>
          <div style="font-size:10px;color:${color};font-weight:700;margin-top:2px">${label}</div>
        </div>
        ${plannedType!=='rest'?`<button onclick="markWeekDayDone(${i})"
          style="width:32px;height:32px;border-radius:50%;border:2px solid ${isDone?'var(--good)':'var(--border2)'};
                 background:${isDone?'rgba(74,222,128,.2)':'var(--bg4)'};cursor:pointer;font-size:14px;flex-shrink:0">
          ${isDone?'✅':'○'}
        </button>`:'<div style="font-size:18px">😴</div>'}
      </div>
      <!-- Change workout type -->
      <div style="display:flex;flex-wrap:wrap;gap:4px">
        ${[...woTypes.map(([k])=>k),'rest'].map(t=>`<button onclick="toggleWeekPlan(${i},'${t}')"
          style="padding:3px 8px;border-radius:12px;font-family:var(--font2);font-size:8px;font-weight:700;cursor:pointer;
                 border:1px solid ${plannedType===t?(typeColors[t]||'var(--border2)'):'var(--border2)'};
                 background:${plannedType===t?'rgba(255,255,255,.07)':'transparent'};
                 color:${plannedType===t?(typeColors[t]||'var(--muted)'):'var(--muted)'}"
          >${t==='rest'?'Rest':(prog[t]?.label?.split('—')[0]?.trim()||t.toUpperCase())}</button>`).join('')}
      </div>
    </div>`;
  }).join('');

  const adherePct=planned>0?Math.round(done/planned*100):0;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📅 Planejamento da Semana</div>
    ${tabs}

    <!-- Summary -->
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;text-align:center">
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Planejados</div>
        <div style="font-size:22px;font-weight:800;color:${ac}">${planned}</div>
      </div>
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Feitos</div>
        <div style="font-size:22px;font-weight:800;color:${done===planned&&planned>0?'var(--good)':'var(--good)'}">${done}</div>
      </div>
      <div style="background:var(--bg4);border-radius:10px;padding:12px">
        <div style="font-size:9px;color:var(--muted);margin-bottom:4px;text-transform:uppercase">Aderência</div>
        <div style="font-size:22px;font-weight:800;color:${adherePct>=80?'var(--good)':adherePct>=50?'var(--warn)':'var(--bad)'}">${adherePct}%</div>
      </div>
    </div>
    <div class="bar" style="margin-bottom:16px"><div class="fill" style="width:${Math.max(adherePct,2)}%"></div></div>

    <!-- Day cards -->
    <div style="display:flex;flex-direction:column;gap:10px">${dayCards}</div>

    <div style="font-size:10px;color:var(--muted);text-align:center;margin-top:12px;line-height:1.8">
      💡 Toque nos botões abaixo de cada dia para alterar o treino.<br>Marque ✅ quando completar.
    </div>
  </div>`;
}

          </div>
        </div>

              style="width:28px;height:28px;border-radius:6px;border:1px solid ${v===n?ac:'var(--border2)'};background:${v===n?`${ac}18`:'var(--bg4)'};color:${v===n?ac:'var(--muted)'};font-family:var(--font2);font-size:11px;font-weight:800;cursor:pointer;transition:all .15s"
              data-key="${key}" data-ex="${ei}" data-val="${v}">${v}</button>`).join('')}
          </div>
          <span style="font-size:9px;color:var(--muted)">Reps:</span>
          <select onchange="inlineEditReps('${key}',${ei},this.value)" style="background:var(--bg4);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--font2);font-size:10px;padding:4px 6px;cursor:pointer">
            ${['4–6','6–10','8–12','10–15','12–15'].map(r=>`<option value="${r}" ${reps===r?'selected':''}>${r}</option>`).join('')}
          </select>
        </div>`:''}

    }).join('');

    return`<div style="margin-bottom:16px">

      <div>

        <div style="font-size:10px;color:var(--sub)">${hasOverrides?'⚠️ Você tem alterações personalizadas ativas.':'Usando programa padrão — sem alterações.'}</div>
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">

          <label class="flabel">Nome do exercício</label>
          <input type="text" id="edit-ex-name" style="width:100%"/>

        <div style="margin-bottom:12px">
          <label class="flabel">Séries de trabalho</label>

          <label class="flabel">Reps (ex: 6–10)</label>

          <label class="flabel">Descanso entre séries (segundos)</label>
          <input type="number" id="edit-ex-rest" value="150" style="width:100%"/>

        <div style="display:flex;gap:8px">
          <button onclick="saveEditExercise()" style="flex:1;padding:12px;background:var(--him);color:#08080e;border:none;border-radius:8px;font-family:var(--font);font-size:10px;font-weight:700;letter-spacing:1px;cursor:pointer">💾 Salvar</button>
          <button onclick="closeEditModal()" style="padding:12px 20px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-family:var(--font);font-size:10px;cursor:pointer">Cancelar</button>
        </div>
      </div>
    </div>
  </div>`;
}

let _editCtx={woKey:null,exIdx:null,isNew:false};

function editExercise(woKey,exIdx){
  const prog=getWorkoutProgram();
  const ex=prog[woKey]?.exercises[exIdx];
  if(!ex)return;
  _editCtx={woKey,exIdx,isNew:false};
  document.getElementById('edit-modal-title').textContent=`Editar: ${ex.name}`;
  document.getElementById('edit-ex-name').value=ex.name;
  const workSets=ex.sets.filter(s=>s.t==='work');
  document.getElementById('edit-ex-sets').value=workSets.length||2;
  document.getElementById('edit-ex-reps').value=workSets[0]?.r||'6–10';
  document.getElementById('edit-ex-rest').value=workSets[0]?.rest||150;
  document.getElementById('edit-modal').style.display='flex';
}

function addExercise(woKey){
  _editCtx={woKey,exIdx:null,isNew:true};
  document.getElementById('edit-modal-title').textContent='Adicionar Exercício';
  document.getElementById('edit-ex-name').value='';
  document.getElementById('edit-ex-sets').value='2';
  document.getElementById('edit-ex-reps').value='6–10';
  document.getElementById('edit-ex-rest').value='150';
  document.getElementById('edit-modal').style.display='flex';
}

function closeEditModal(){
  document.getElementById('edit-modal').style.display='none';
}

function saveEditExercise(){
  const name=document.getElementById('edit-ex-name').value.trim();
  if(!name){alert('Digite o nome do exercício');return;}
  const sets=parseInt(document.getElementById('edit-ex-sets').value)||2;
  const reps=document.getElementById('edit-ex-reps').value.trim()||'6–10';
  const rest=parseInt(document.getElementById('edit-ex-rest').value)||150;

  // Build sets array
  const newSets=[
    {t:'warm',l:'Aquecimento',s:1,r:'10–15',rest:60},
    {t:'adj',l:'Ajuste 1',s:1,r:'4–6',rest:90},
  ];
  for(let i=0;i<sets;i++) newSets.push({t:'work',l:`Série ${i+1}`,s:1,r:reps,rest});
  const newEx={name,sets:newSets};

  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}

  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  const wk=_editCtx.woKey;
  // Apply existing overrides
  if(custom.overrides[wk]) baseProg[wk].exercises=custom.overrides[wk];

  if(_editCtx.isNew){
    baseProg[wk].exercises.push(newEx);
  } else {
    baseProg[wk].exercises[_editCtx.exIdx]=newEx;
  }
  custom.overrides[wk]=baseProg[wk].exercises;
  saveCustomProgram(custom);
  closeEditModal();
  render();
}

function deleteExercise(woKey,exIdx){
  if(!confirm('Excluir este exercício?'))return;
  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}
  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  if(custom.overrides[woKey]) baseProg[woKey].exercises=custom.overrides[woKey];

  saveCustomProgram(custom);
  render();
}

}

function confirmSaveProgram(){

function inlineEditSets(woKey, exIdx, newSets, btn){
  // Visual feedback: highlight selected button
  const card=btn.closest('[data-key]')?.parentElement;
  btn.closest('div').querySelectorAll('button[data-key]').forEach(b=>{
    const isSel=parseInt(b.dataset.val)===newSets;
    b.style.background=isSel?`var(--himb)`:'var(--bg4)';
    b.style.borderColor=isSel?`var(--himl)`:'var(--border2)';
    b.style.color=isSel?'var(--him)':'var(--muted)';
  });
  // Apply inline edit using applyQuickEditSets logic
  const repsEl=btn.closest('div[style]')?.querySelector('select');
  const reps=repsEl?.value||'6–10';

}

function inlineEditReps(woKey, exIdx, newReps){
  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}
  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  if(custom.overrides[woKey]) baseProg[woKey].exercises=custom.overrides[woKey];
  const ex=baseProg[woKey].exercises[exIdx];
  if(!ex) return;
  const workSets=ex.sets.filter(s=>s.t==='work');
  workSets.forEach(s=>{s.r=newReps;});
  custom.overrides[woKey]=baseProg[woKey].exercises;
  saveCustomProgram(custom);
  // no full render — just update UI silently
}

function _applySetEdit(woKey, exIdx, sets, reps){
  const rest=150;
  const custom=getCustomProgram()||{program:activeProgram,overrides:{}};
  if(custom.program!==activeProgram){custom.program=activeProgram;custom.overrides={};}
  const baseProg=JSON.parse(JSON.stringify(getActiveProgram()));
  if(custom.overrides[woKey]) baseProg[woKey].exercises=custom.overrides[woKey];
  const ex=baseProg[woKey].exercises[exIdx];
  if(!ex) return;
  const warmAdj=ex.sets.filter(s=>s.t!=='work');
  const existNote=ex.sets.find(s=>s.t==='work'&&s.note)?.note||null;
  const newWork=Array.from({length:sets},(_,i)=>({
    t:'work',l:sets===1?'Trabalho':`Série ${i+1}`,s:1,r:reps,rest,
    ...(i===sets-1&&existNote?{note:existNote}:{})
  }));
  ex.sets=[...warmAdj,...newWork];
  custom.overrides[woKey]=baseProg[woKey].exercises;
  saveCustomProgram(custom);
}

function getMercadoSelections(){
  try{return JSON.parse(localStorage.getItem('bt_mercado_sel')||'{}');}catch{return {};}
}
function saveMercadoSelections(sel){
  localStorage.setItem('bt_mercado_sel', JSON.stringify(sel));
}

function calcMercadoList(selections){
  // totals: {ingredient: {qty, unit, meals: []}}
  const totals = {};
  MEAL_KEYS.forEach((key, mi) => {
    const optNum = selections[key] || 1;
    const ingKey = `${key}_${optNum}`;
    const ings = MEAL_INGREDIENTS[ingKey] || [];
    ings.forEach(([name, qty, unit]) => {
      if(!totals[name]) totals[name] = {qty:0, unit, meals:[]};
      totals[name].qty += qty;
      if(!totals[name].meals.includes(MEAL_NAMES_MKT[mi]))
        totals[name].meals.push(MEAL_NAMES_MKT[mi]);
    });
  });
  return totals;
}

function fmtQty(qty, unit){
  // Convert units intelligently
  if(unit === 'ml'){
    if(qty >= 1000) return `${(qty/1000).toFixed(qty%1000===0?0:1)}L`;
    return `${qty}ml`;
  }
  if(unit === 'g'){
    if(qty >= 1000) return `${(qty/1000).toFixed(qty%1000===0?0:2).replace(/\.?0+$/,'')}kg`;
    return `${qty}g`;
  }
  if(unit === 'un') return `${qty} un`;
  if(unit === 'col') return qty === 1 ? `1 col` : `${qty} col`;
  return `${qty} ${unit}`;
}

function getMktWeeks(){
  try{ return JSON.parse(localStorage.getItem('bt_mkt_weeks')||'[]'); }catch{ return []; }
}
function saveMktWeek(spent){
  const w=getMktWeeks();
  w.push({date:localDayKey(),spent:parseFloat(spent)});
  // keep last 12 weeks
  if(w.length>12) w.splice(0,w.length-12);

}

function checkDeload(){
  // Check if deload is needed based on training volume and weeks
  const workouts=getWorkouts();
  if(workouts.length<12) return null;
  // Find consecutive training weeks
  const now=new Date();
  let consecutiveWeeks=0;
  for(let w=0;w<12;w++){
    const wStart=new Date(now); wStart.setDate(now.getDate()-(w+1)*7);
    const wEnd=new Date(now); wEnd.setDate(now.getDate()-w*7);
    const sessionsInWeek=workouts.filter(s=>{const d=new Date(s.date);return d>=wStart&&d<wEnd;}).length;
    if(sessionsInWeek>=3) consecutiveWeeks++;
    else break;
  }
  if(consecutiveWeeks>=4){
    const lastDeload=localStorage.getItem('bt_last_deload');
    const weeksSinceDeload=lastDeload?Math.floor((now-new Date(lastDeload))/(7*24*3600*1000)):99;
    if(weeksSinceDeload>=4) return consecutiveWeeks;
  }
  return null;
}

function markDeloadDone(){
  localStorage.setItem('bt_last_deload',new Date().toISOString());
  showSyncStatus('✅ Deload registrado!','var(--good)');
  render();
}

const ESTOQUE_CATS = ['🥩 Proteína','🍚 Carboidrato','🥦 Vegetal/Fruta','🥛 Laticínio','🧴 Suplemento','🧂 Tempero/Condimento','🛢️ Óleo/Gordura','🍞 Grão/Cereal','🥤 Bebida','📦 Outro'];

function saveEstoque(d){localStorage.setItem('bt_estoque',JSON.stringify(d));}
