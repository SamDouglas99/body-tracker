function addEstoqueItem(prefill){
  const name=(prefill?.name||document.getElementById('est-name')?.value||'').trim();
  const qty=prefill?.qty||document.getElementById('est-qty')?.value||'1';
  const unit=prefill?.unit||document.getElementById('est-unit')?.value||'un';
  const cat=prefill?.cat||document.getElementById('est-cat')?.value||ESTOQUE_CATS[9];
  const price=prefill?.price||parseFloat(document.getElementById('est-price')?.value)||0;
  if(!name){alert('Informe o item!');return;}
  const items=getEstoque();
  // avoid exact duplicate
  if(items.find(i=>!i.done&&i.name===name)){
    alert(`"${name}" já está na lista!`);return;
  }
  items.push({id:Date.now(),name,qty:String(qty),unit,cat,price,date:new Date().toISOString(),done:false});
  saveEstoque(items);
  if(!prefill){
    document.getElementById('est-name').value='';
    document.getElementById('est-qty').value='';
    document.getElementById('est-price').value='';
  }
  render();
}

function toggleEstoqueItem(id){
  const items=getEstoque();
  const item=items.find(i=>i.id===id);
  if(item){item.done=!item.done;if(item.done)item.doneAt=new Date().toISOString();}
  saveEstoque(items);render();
}

function deleteEstoqueItem(id){saveEstoque(getEstoque().filter(i=>i.id!==id));render();}

function clearEstoqueDone(){saveEstoque(getEstoque().filter(i=>!i.done));render();}

function finalizarCompra(){
  const items=getEstoque();
  const done=items.filter(i=>i.done);
  if(!done.length){alert('Nenhum item marcado como comprado!');return;}
  const total=done.reduce((s,i)=>s+(i.price||0),0);
  const hist=getEstoqueHistory();
  hist.unshift({
    id:Date.now(),
    date:new Date().toISOString(),
    items:done,
    total:parseFloat(total.toFixed(2)),
    count:done.length
  });
  saveEstoqueHistory(hist);
  saveEstoque(items.filter(i=>!i.done));
  estoqueSubTab='historico';
  render();
}

function deleteEstoqueHistEntry(id){
  saveEstoqueHistory(getEstoqueHistory().filter(h=>h.id!==id));render();
}

function buildEstoque(){
  const ac=PROFILES[CP].accentHex;
  const items=getEstoque();
  const pending=items.filter(i=>!i.done);
  const done=items.filter(i=>i.done);
  const hist=getEstoqueHistory();
  const totalSpentAll=hist.reduce((s,h)=>s+h.total,0);
  const avgPerShop=hist.length?totalSpentAll/hist.length:0;
  const doneCost=done.reduce((s,i)=>s+(i.price||0),0);

  const subtabs=`<div class="subtabs" style="margin-bottom:18px">
    ${[['lista','🛒 Lista'],['historico','📋 Histórico'],['analytics','📊 Análise']].map(([k,l])=>`<button class="stab${estoqueSubTab===k?' active':''}" onclick="estoqueSubTab='${k}';render()">${l}</button>`).join('')}
  </div>`;

  // ── ABA HISTÓRICO ──
  if(estoqueSubTab==='historico'){
    const histCards=hist.length===0?`<div class="card empty"><div class="empty-ico">📋</div><div class="empty-txt">Nenhuma compra finalizada ainda.<br>Finalize uma compra na aba Lista.</div></div>`:
      hist.map(h=>{
        const d=new Date(h.date);
        const dateStr=d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
        const byCat={};
        h.items.forEach(i=>{if(!byCat[i.cat])byCat[i.cat]=[];byCat[i.cat].push(i);});
        return`<div class="card" style="margin-bottom:12px">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
            <div>
              <div style="font-size:13px;font-weight:800">${dateStr}</div>
              <div style="font-size:10px;color:var(--muted);margin-top:2px">${h.count} itens</div>
            </div>
            <div style="text-align:right;display:flex;align-items:center;gap:8px">
              ${h.total>0?`<div style="font-size:20px;font-weight:800;color:${ac}">R$&nbsp;${h.total.toFixed(2)}</div>`:'<div style="font-size:11px;color:var(--muted)">sem preço</div>'}
              <button onclick="deleteEstoqueHistEntry(${h.id})" style="background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px">✕</button>
            </div>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:8px">
            ${Object.entries(byCat).map(([cat,its])=>`
              <div style="margin-bottom:6px">
                <div style="font-size:9px;color:var(--sub);font-weight:700;letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">${cat}</div>
                ${its.map(i=>`<div style="display:flex;justify-content:space-between;padding:3px 0;font-size:11px;color:var(--text)">
                  <span>${i.name} <span style="color:var(--muted)">${i.qty} ${i.unit}</span></span>
                  ${i.price>0?`<span style="color:${ac};font-weight:700">R$&nbsp;${i.price.toFixed(2)}</span>`:''}
                </div>`).join('')}
              </div>`).join('')}
          </div>
        </div>`;
      }).join('');

    return`<div class="page">
      <div class="sec-title" style="padding:0 0 14px">🛒 Estoque & Compras</div>
      ${subtabs}
      <div class="grid2" style="margin-bottom:18px">
        <div class="card"><div style="font-size:22px;font-weight:800;color:${ac}">${hist.length}</div><div class="lbl" style="margin:4px 0">Compras realizadas</div></div>
        <div class="card"><div style="font-size:22px;font-weight:800;color:var(--good)">R$&nbsp;${avgPerShop.toFixed(0)}</div><div class="lbl" style="margin:4px 0">Média por compra</div></div>
      </div>
      ${histCards}
    </div>`;
  }

  // ── ABA ANÁLISE ──
  if(estoqueSubTab==='analytics'){
    // Spending by category across all history
    const catSpend={};
    ESTOQUE_CATS.forEach(c=>{catSpend[c]=0;});
    hist.forEach(h=>h.items.forEach(i=>{if(i.price>0){if(catSpend[i.cat]!==undefined)catSpend[i.cat]+=i.price;else catSpend[ESTOQUE_CATS[9]]+=i.price;}}));
    const maxCat=Math.max(...Object.values(catSpend),1);
    const topCats=Object.entries(catSpend).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]);

    // Monthly spending
    const monthly={};
    hist.forEach(h=>{const m=h.date.slice(0,7);if(!monthly[m])monthly[m]=0;monthly[m]+=h.total;});
    const monthlyArr=Object.entries(monthly).sort((a,b)=>a[0].localeCompare(b[0])).slice(-6);

    const catColors=['var(--bad)','var(--info)','var(--good)','var(--warn)','var(--purple)','var(--pull)','var(--him)','var(--push)','var(--legs)','var(--upper)'];

    return`<div class="page">
      <div class="sec-title" style="padding:0 0 14px">🛒 Estoque & Compras</div>
      ${subtabs}
      <div class="grid3" style="margin-bottom:18px">
        <div class="card"><div style="font-size:20px;font-weight:800;color:${ac}">R$&nbsp;${totalSpentAll.toFixed(0)}</div><div class="lbl" style="margin:3px 0">Total gasto</div></div>
        <div class="card"><div style="font-size:20px;font-weight:800;color:var(--good)">R$&nbsp;${avgPerShop.toFixed(0)}</div><div class="lbl" style="margin:3px 0">Média/compra</div></div>
        <div class="card"><div style="font-size:20px;font-weight:800;color:var(--info)">${hist.length}</div><div class="lbl" style="margin:3px 0">Compras</div></div>
      </div>
      ${topCats.length>0?`<div class="card" style="margin-bottom:14px">
        <div style="font-size:10px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">💰 Gasto por Categoria</div>
        ${topCats.map(([cat,val],i)=>{
          const pct=Math.round(val/maxCat*100);
          return`<div style="margin-bottom:10px">
            <div style="display:flex;justify-content:space-between;margin-bottom:4px">
              <span style="font-size:11px">${cat}</span>
              <span style="font-size:12px;font-weight:700;color:${catColors[i%catColors.length]}">R$&nbsp;${val.toFixed(2)}</span>
            </div>
            <div class="bar"><div style="height:100%;width:${Math.max(pct,3)}%;background:${catColors[i%catColors.length]};border-radius:3px;transition:width .8s"></div></div>
          </div>`;
        }).join('')}
      </div>`:''}
      ${monthlyArr.length>0?`<div class="card">
        <div style="font-size:10px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">📅 Gasto Mensal</div>
        <div style="display:flex;align-items:flex-end;gap:6px;height:80px">
          ${(()=>{const maxM=Math.max(...monthlyArr.map(([,v])=>v),1);return monthlyArr.map(([m,v])=>{const pct=Math.round(v/maxM*100);const label=m.slice(0,7);const [year,month]=m.split('-');const mNames=['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];return`<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:4px">
            <div style="font-size:8px;color:${ac};font-weight:700">R$${Math.round(v)}</div>
            <div style="width:100%;height:${Math.max(pct*0.6,4)}px;background:${ac};border-radius:3px 3px 0 0;transition:height .8s"></div>
            <div style="font-size:8px;color:var(--muted)">${mNames[parseInt(month)-1]}</div>
          </div>`;}).join('');})()}
        </div>
      </div>`:'<div class="card empty"><div class="empty-ico">📊</div><div class="empty-txt">Finalize compras para ver a análise mensal</div></div>'}
    </div>`;
  }

  // ── ABA LISTA (default) ──
  let estPeriod=localStorage.getItem('bt_est_period')||'semana';
  const periodMult={'dia':1,'semana':7,'mes':30};
  const mult=periodMult[estPeriod]||7;

  const byCat={};
  ESTOQUE_CATS.forEach(c=>{byCat[c]=[];});
  pending.forEach(i=>{if(byCat[i.cat])byCat[i.cat].push(i);else byCat[ESTOQUE_CATS[9]].push(i);});

  // ── Painel rápido: itens da dieta agrupados por categoria ──
  const inList=new Set(getEstoque().map(i=>i.name));
  const dietByCat={};
  DIET_ITEMS.forEach(di=>{
    if(!dietByCat[di.cat]) dietByCat[di.cat]=[];
    dietByCat[di.cat].push(di);
  });

  const dietQtyLabel=(di)=>{
    const q=(di.qtyDay*mult);
    // smart rounding/conversion
    if(di.unit==='g'&&q>=1000) return `${(q/1000).toFixed(1)} kg`;
    if(di.unit==='ml'&&q>=1000) return `${(q/1000).toFixed(1)} L`;
    if(Number.isInteger(q)) return `${q} ${di.unit}`;
    return `${parseFloat(q.toFixed(1))} ${di.unit}`;
  };

  const dietPanel=`<div class="card" style="margin-bottom:18px;border-color:${ac}20">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">
      <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase">📋 Itens do Plano Alimentar</div>
      <div style="display:flex;gap:4px">
        ${['dia','semana','mes'].map(p=>`<button onclick="localStorage.setItem('bt_est_period','${p}');render()" style="padding:4px 10px;border-radius:20px;font-family:var(--font2);font-size:9px;font-weight:800;cursor:pointer;border:1px solid ${estPeriod===p?ac:'var(--border2)'};background:${estPeriod===p?`${ac}18`:'var(--bg4)'};color:${estPeriod===p?ac:'var(--muted)'}">${p==='dia'?'1 Dia':p==='semana'?'1 Semana':'1 Mês'}</button>`).join('')}
      </div>
    </div>
    <div style="font-size:10px;color:var(--muted);margin-bottom:14px">Toque no item para adicionar à lista de compras com a quantidade calculada automaticamente.</div>
    ${Object.entries(dietByCat).map(([cat,items2])=>`
      <div style="margin-bottom:14px">
        <div style="font-size:9px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">${cat}</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px">
          ${items2.map(di=>{
            const already=inList.has(di.name);
            const ql=dietQtyLabel(di);
            return`<button onclick="${already?'':  `addEstoqueItem({name:'${di.name.replace(/'/g,"\\'")}',qty:'${(()=>{const q=di.qtyDay*mult;if(di.unit==='g'&&q>=1000)return(q/1000).toFixed(1);if(di.unit==='ml'&&q>=1000)return(q/1000).toFixed(1);return Number.isInteger(q)?q:parseFloat(q.toFixed(1));})()}',unit:'${(()=>{if(di.unit==='g'&&di.qtyDay*mult>=1000)return'kg';if(di.unit==='ml'&&di.qtyDay*mult>=1000)return'L';return di.unit;})()}',cat:'${di.cat}',price:0})`}"
              title="${di.obs}"
              style="display:flex;align-items:center;gap:5px;padding:7px 10px;border-radius:20px;border:1px solid ${already?'rgba(74,222,128,.4)':'var(--border2)'};background:${already?'rgba(74,222,128,.08)':'var(--bg4)'};cursor:${already?'default':'pointer'};font-family:var(--font2);font-size:10px;font-weight:700;color:${already?'var(--good)':'var(--text)'};transition:all .15s;white-space:nowrap">
              <span>${di.icon}</span>
              <span>${di.name}</span>
              <span style="font-size:9px;color:${already?'var(--good)':'var(--him)'};font-weight:800">${already?'✓':ql}</span>
            </button>`;
          }).join('')}
        </div>
      </div>`).join('')}
  </div>`;

  const catCards=ESTOQUE_CATS.map(cat=>{
    const catItems=byCat[cat]||[];
    if(!catItems.length)return'';
    return`<div style="margin-bottom:14px">
      <div style="font-size:10px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:8px">${cat}</div>
      ${catItems.map(item=>`
        <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;margin-bottom:6px">
          <button onclick="toggleEstoqueItem(${item.id})" style="width:28px;height:28px;border-radius:50%;border:2px solid var(--border2);background:var(--bg4);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;transition:all .2s">○</button>
          <div style="flex:1;min-width:0">
            <div style="font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>
            <div style="font-size:10px;color:var(--muted);margin-top:1px">${item.qty} ${item.unit}${item.price>0?` · <span style="color:${ac};font-weight:700">R$&nbsp;${parseFloat(item.price).toFixed(2)}</span>`:''}</div>
          </div>
          <button onclick="deleteEstoqueItem(${item.id})" style="background:transparent;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:4px;flex-shrink:0">✕</button>
        </div>`).join('')}
    </div>`;
  }).join('');

  const doneSection=done.length>0?`
    <div style="margin-top:20px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <div>
          <div style="font-size:10px;font-weight:800;color:var(--good);letter-spacing:1px;text-transform:uppercase">✅ Comprado (${done.length})</div>
          ${doneCost>0?`<div style="font-size:12px;font-weight:700;color:${ac};margin-top:2px">R$&nbsp;${doneCost.toFixed(2)} nesta sessão</div>`:''}
        </div>
        <div style="display:flex;gap:6px">
          <button onclick="finalizarCompra()" style="background:rgba(226,226,64,.12);border:1px solid rgba(226,226,64,.4);color:var(--him);border-radius:6px;padding:5px 10px;font-family:var(--font2);font-size:9px;font-weight:800;cursor:pointer">Finalizar compra</button>
          <button onclick="clearEstoqueDone()" style="background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.3);color:var(--bad);border-radius:6px;padding:5px 10px;font-family:var(--font2);font-size:9px;font-weight:700;cursor:pointer">Limpar</button>
        </div>
      </div>
      ${done.map(item=>`
        <div onclick="toggleEstoqueItem(${item.id})" style="display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--bg3);border:1px solid rgba(74,222,128,.2);border-radius:10px;margin-bottom:6px;cursor:pointer;opacity:.65">
          <span style="font-size:16px">✅</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:12px;font-weight:700;text-decoration:line-through;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${item.name}</div>
            <div style="font-size:10px;color:var(--muted)">${item.qty} ${item.unit}${item.price>0?` · R$&nbsp;${parseFloat(item.price).toFixed(2)}`:''}</div>
          </div>
          <button onclick="event.stopPropagation();deleteEstoqueItem(${item.id})" style="background:transparent;border:none;color:var(--muted);font-size:14px;cursor:pointer;padding:4px">✕</button>
        </div>`).join('')}
    </div>`:'';

  const statsRow=`<div class="grid3" style="margin-bottom:16px">
    <div class="card"><div style="font-size:22px;font-weight:800;color:${ac}">${pending.length}</div><div class="lbl" style="margin:4px 0">Pendentes</div></div>
    <div class="card"><div style="font-size:22px;font-weight:800;color:var(--good)">${done.length}</div><div class="lbl" style="margin:4px 0">Comprados</div></div>
    <div class="card"><div style="font-size:${totalSpentAll>0?'16':'22'}px;font-weight:800;color:var(--info)">${totalSpentAll>0?'R$&nbsp;'+totalSpentAll.toFixed(0):hist.length}</div><div class="lbl" style="margin:4px 0">${totalSpentAll>0?'Total gasto':'Compras'}</div></div>
  </div>`;

  const addForm=`<div class="card" style="margin-bottom:18px;border-color:${ac}30">
    <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">➕ Adicionar Manualmente</div>
    <div style="display:grid;grid-template-columns:1fr 60px;gap:8px;margin-bottom:8px">
      <div><label class="flabel">Item</label><input type="text" id="est-name" placeholder="Nome do item…" onkeydown="if(event.key==='Enter')addEstoqueItem()"/></div>
      <div><label class="flabel">Qtd</label><input type="number" id="est-qty" placeholder="1" min="0" step="0.1"/></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px">
      <div><label class="flabel">Unidade</label>
        <select id="est-unit">${UNIT_OPTIONS.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
      </div>
      <div><label class="flabel">Categoria</label>
        <select id="est-cat">${ESTOQUE_CATS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div><label class="flabel">R$ Preço</label><input type="number" id="est-price" placeholder="0,00" min="0" step="0.01"/></div>
    </div>
    <button onclick="addEstoqueItem()" style="width:100%;padding:12px;background:${ac};color:#08080e;border:none;border-radius:10px;font-family:var(--font2);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;cursor:pointer">Adicionar à lista</button>
  </div>`;

  const emptyState=pending.length===0&&done.length===0?`<div class="card" style="margin-bottom:16px;text-align:center;padding:20px 16px;border-style:dashed"><div style="font-size:11px;color:var(--muted)">Lista vazia. Selecione itens do plano acima ou adicione manualmente.</div></div>`:'';

  const templates=getEstoqueTemplates();
  const templateBar=`<div style="margin-bottom:14px">
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <button onclick="saveEstoqueTemplate()" style="display:flex;align-items:center;gap:5px;padding:7px 12px;background:var(--bg4);border:1px dashed var(--border2);border-radius:20px;color:var(--muted);font-family:var(--font2);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap">
        💾 Salvar lista como template
      </button>
      ${templates.map(t=>`
        <div style="display:flex;align-items:center;gap:0;background:var(--bg4);border:1px solid var(--border2);border-radius:20px;overflow:hidden">
          <button onclick="loadEstoqueTemplate('${t.name.replace(/'/g,"\\'")})" style="padding:7px 12px;background:transparent;border:none;color:var(--text);font-family:var(--font2);font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap">
            📋 ${t.name} <span style="color:var(--muted);font-size:9px">(${t.items.length})</span>
          </button>
          <button onclick="deleteEstoqueTemplate('${t.name.replace(/'/g,"\\'")})" style="padding:7px 8px;background:transparent;border:none;border-left:1px solid var(--border2);color:var(--muted);font-size:12px;cursor:pointer">✕</button>
        </div>`).join('')}
    </div>
  </div>`;

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">🛒 Estoque & Compras</div>
    ${subtabs}
    ${statsRow}
    ${templateBar}
    ${dietPanel}
    ${emptyState}
    ${pending.length>0?`<div class="sec-title" style="padding:0 0 12px">📋 Lista Atual</div>${catCards}`:''}
    ${addForm}
    ${doneSection}
  </div>`;
}

// CHECK-IN SEMANAL (toda segunda-feira)

function showWeeklyCheckin(){
  if(document.getElementById('weekly-checkin')) return;
  const ac=PROFILES[CP].accentHex;
  const lastWo=getWorkouts().slice(-7);
  const lastWeekCount=lastWo.filter(s=>{
    const d=new Date(s.date);
    const mon=new Date(); mon.setDate(mon.getDate()-7); mon.setHours(0,0,0,0);
    const sun=new Date(); sun.setDate(sun.getDate()-1); sun.setHours(23,59,59,999);
    return d>=mon&&d<=sun;
  }).length;
  const overlay=document.createElement('div');
  overlay.id='weekly-checkin';
  overlay.style.cssText='position:fixed;inset:0;background:rgba(8,8,14,.92);z-index:600;display:flex;align-items:flex-end;justify-content:center;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom))';
  overlay.innerHTML=`
    <div style="background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:24px 20px;width:100%;max-width:460px;max-height:85vh;overflow-y:auto">
      <div style="text-align:center;width:40px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px"></div>
      <div style="font-size:18px;font-weight:800;margin-bottom:4px">📋 Check-in Semanal</div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:22px">Leva 30 segundos. Ajuda o app a te dar melhores alertas.</div>

      <div style="margin-bottom:18px">

      <button onclick="document.getElementById('weekly-checkin').remove();localStorage.setItem('bt_last_checkin',new Date().toISOString())" style="width:100%;padding:11px;background:transparent;border:1px solid var(--border2);border-radius:10px;font-family:var(--font2);font-size:11px;font-weight:700;color:var(--muted);cursor:pointer">Pular esta semana</button>

  window._ciWo=lastWeekCount;

  window._ciSleep=0;
  document.body.appendChild(overlay);
}

function saveWeeklyCheckin(){
  const weightEl=document.getElementById('ci-weight');
  const weight=parseFloat(weightEl?.value)||getD().curW;
  const checkin={
    date:new Date().toISOString(),
    week:getWeekKey(),
    weight,
    workouts:window._ciWo||0,
    diet:window._ciDiet||0,
    sleep:window._ciSleep||0,
  };
  // Save checkin history
  const history=JSON.parse(localStorage.getItem('bt_checkin_hist')||'[]');
  history.push(checkin);
  localStorage.setItem('bt_checkin_hist',JSON.stringify(history));
  localStorage.setItem('bt_last_checkin',new Date().toISOString());
  // Update weight if provided
  if(weight&&weight!==getD().curW){
    const s=getSettings()||{};
    s.weight=weight;
    saveSettings(s);
  }
  document.getElementById('weekly-checkin')?.remove();
  showSyncStatus('✅ Check-in salvo!','var(--good)');
  render();
}

// TEMPLATES DE LISTA (Estoque)
// ══════════════════════════════════════
function getEstoqueTemplates(){try{return JSON.parse(localStorage.getItem('bt_est_templates')||'[]');}catch{return [];}}
function saveEstoqueTemplates(d){localStorage.setItem('bt_est_templates',JSON.stringify(d));}

function saveEstoqueTemplate(){
  const pending=getEstoque().filter(i=>!i.done);
  if(!pending.length){alert('Lista vazia — adicione itens primeiro!');return;}
  const name=prompt('Nome do template:','Compra Padrão');
  if(!name)return;
  const templates=getEstoqueTemplates();
  const existing=templates.findIndex(t=>t.name===name);
  const tpl={name,items:pending.map(({name,qty,unit,cat})=>({name,qty,unit,cat})),date:new Date().toISOString()};
  if(existing>=0) templates[existing]=tpl;
  else templates.push(tpl);
  saveEstoqueTemplates(templates);
  showSyncStatus(`✅ Template "${name}" salvo!`,'var(--good)');
  render();
}

function loadEstoqueTemplate(name){
  const templates=getEstoqueTemplates();
  const tpl=templates.find(t=>t.name===name);
  if(!tpl)return;
  const current=getEstoque();
  const currentNames=new Set(current.filter(i=>!i.done).map(i=>i.name));
  let added=0;
  tpl.items.forEach(item=>{
    if(!currentNames.has(item.name)){
      current.push({id:Date.now()+Math.random(),name:item.name,qty:item.qty,unit:item.unit,cat:item.cat,price:0,date:new Date().toISOString(),done:false});
      added++;
    }
  });
  saveEstoque(current);
  showSyncStatus(`✅ ${added} itens adicionados da lista "${name}"!`,'var(--good)');
  render();
}

function deleteEstoqueTemplate(name){
  saveEstoqueTemplates(getEstoqueTemplates().filter(t=>t.name!==name));
  render();
}

function getDietAdj(){

function saveDietAdj(d){localStorage.setItem('bt_diet_adj',JSON.stringify(d));}

function buildSimulador(subtabs,d,ac,w){
  // ── Simulator params (persisted) ──
  const simW   = parseFloat(localStorage.getItem('bt_sim_w')  || w)   || w;
  const simGoal= parseFloat(localStorage.getItem('bt_sim_goal')|| '0.35');
  const simDays= parseInt(  localStorage.getItem('bt_sim_days')|| '5');
  const simAge = parseInt(  localStorage.getItem('bt_sim_age') || '25');
  const simH   = parseFloat(localStorage.getItem('bt_sim_h')   || d.h || '1.71');

  // ── Harris-Benedict ♂ + NEAT multiplier ──
  // BMR = 88.362 + (13.397 × kg) + (4.799 × cm) – (5.677 × years)
  const bmr   = 88.362 + (13.397 * simW) + (4.799 * simH * 100) - (5.677 * simAge);
  const mults = {4:1.55, 5:1.65, 6:1.725, 7:1.8};
  const tdee  = Math.round(bmr * (mults[simDays] || 1.65));

  // Surplus needed for simGoal kg/week: 1kg fat ≈ 7700 kcal
  const surplusPerDay = Math.round(simGoal * 7700 / 7);
  const kcalTarget    = tdee + surplusPerDay;

  // Macros: protein 2.4g/kg, fat 25%, rest carbs
  const protTarget = Math.round(simW * 2.4);
  const fatTarget  = Math.round(kcalTarget * 0.25 / 9);
  const carbTarget = Math.round((kcalTarget - protTarget * 4 - fatTarget * 9) / 4);

  // ── Baseline: what you're eating NOW (profile weight) ──
  const curW    = w; // real profile weight
  const curKcal = Math.round(curW * 41);
  const curProt = Math.round(curW * 2.4);
  const curCarb = Math.round(curKcal * 0.47 / 4);
  const curFat  = Math.round(curKcal * 0.25 / 9);

  // ── Delta ──
  const diffKcal = kcalTarget - curKcal;
  const diffProt = protTarget - curProt;
  const diffCarb = carbTarget - curCarb;
  const diffFat  = fatTarget  - curFat;

  // ── Weeks to goal ──
  const goalW        = d.goalW || 80;
  const remaining    = Math.max(0, goalW - simW);
  const weeksToGoal  = remaining > 0 ? Math.round(remaining / simGoal) : 0;

  // ── Dynamic meal suggestions ──
  // Each entry: base portion + kcal. Scale multiplier adjusts portions to fill diffKcal.
  const MEAL_BLOCKS = [
    {meal:'Pré-Treino', icon:'⚡', items:[
      {food:'aveia',unit:'g',  base:35,  kcalPer100:380, minAdd:15, maxAdd:60},
      {food:'banana',unit:'un',base:1,   kcalPer100:89,  minAdd:1,  maxAdd:2},
    ]},
    {meal:'Pós-Treino', icon:'💪', items:[
      {food:'whey protein',unit:'scoop',base:1,  kcalPer100:120, minAdd:1, maxAdd:2},
      {food:'pão francês', unit:'un',   base:2,  kcalPer100:135, minAdd:1, maxAdd:2},
    ]},
    {meal:'Almoço', icon:'🍛', items:[
      {food:'arroz cozido',  unit:'g', base:200, kcalPer100:130, minAdd:50, maxAdd:150},
      {food:'batata-doce',   unit:'g', base:0,   kcalPer100:86,  minAdd:100,maxAdd:200},
    ]},
    {meal:'Lanche', icon:'🥪', items:[
      {food:'hipercalórico',unit:'g',   base:100, kcalPer100:400, minAdd:30, maxAdd:100},
      {food:'pasta amendoim',unit:'col',base:0,   kcalPer100:590, minAdd:1,  maxAdd:3},
    ]},
    {meal:'Jantar', icon:'🌙', items:[
      {food:'arroz cozido',unit:'g',    base:250, kcalPer100:130, minAdd:50, maxAdd:150},
      {food:'feijão cozido',unit:'g',   base:200, kcalPer100:87,  minAdd:50, maxAdd:100},
    ]},
    {meal:'Ceia', icon:'😴', items:[
      {food:'whey protein',unit:'scoop',base:1,   kcalPer100:120, minAdd:1,  maxAdd:1},
      {food:'aveia',       unit:'g',    base:10,  kcalPer100:380, minAdd:15, maxAdd:30},
    ]},
  ];

  // Distribute diffKcal evenly across 6 meals, then scale each meal's items
  const kcalPerMeal = diffKcal > 0 ? diffKcal / MEAL_BLOCKS.length : 0;

  const mealSuggestions = MEAL_BLOCKS.map(block => {
    let mealKcalBudget = kcalPerMeal;
    const adds = [];
    for(const item of block.items){
      if(mealKcalBudget <= 5) break;
      // How many units/grams needed to fill budget
      const kcalPerUnit = item.unit === 'g'
        ? item.kcalPer100 / 100
        : item.kcalPer100; // scoop/un/col already in kcal/unit
      const rawAdd = mealKcalBudget / kcalPerUnit;
      const add = Math.min(item.maxAdd, Math.max(item.minAdd, Math.round(rawAdd / (item.unit==='g'?5:1)) * (item.unit==='g'?5:1)));
      const addKcal = Math.round(add * kcalPerUnit);
      adds.push({...item, add, addKcal});
      mealKcalBudget -= addKcal;
    }
    const totalKcal = adds.reduce((s,a)=>s+a.addKcal, 0);
    const desc = adds.map(a => `+${a.add}${a.unit==='g'?'g':a.unit==='col'?' col':' '+a.unit} ${a.food}`).join(' + ');
    return {meal: block.meal, icon: block.icon, desc, totalKcal, active: totalKcal > 0};
  });

  const totalSuggested = mealSuggestions.reduce((s,m)=>s+m.totalKcal, 0);

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">⚡ Simulador de Superávit</div>
    ${subtabs}

    <!-- Parâmetros -->
    <div class="card" style="margin-bottom:14px;border-color:${ac}30">
      <div style="font-size:11px;font-weight:800;color:var(--sub);letter-spacing:1px;text-transform:uppercase;margin-bottom:14px">🎚️ Parâmetros</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px">
        <div>
          <label class="flabel">Peso simulado (kg)</label>
          <input type="number" step="0.1" value="${simW}"  onchange="localStorage.setItem('bt_sim_w',this.value);render()" style="width:100%"/>
          <div style="font-size:9px;color:var(--muted);margin-top:3px">Perfil: ${curW}kg</div>
        </div>
        <div>
          <label class="flabel">Altura (m)</label>
          <input type="number" step="0.01" value="${simH}" onchange="localStorage.setItem('bt_sim_h',this.value);render()" style="width:100%"/>
        </div>
        <div>
          <label class="flabel">Idade</label>
          <input type="number" value="${simAge}" onchange="localStorage.setItem('bt_sim_age',this.value);render()" style="width:100%"/>
        </div>
        <div>
          <label class="flabel">Treinos/semana</label>
          <select onchange="localStorage.setItem('bt_sim_days',this.value);render()" style="width:100%">
            ${[4,5,6,7].map(n=>`<option value="${n}" ${n===simDays?'selected':''}>${n}x/semana</option>`).join('')}
          </select>
        </div>
      </div>
      <div>
        <label class="flabel">Meta de ganho semanal</label>
        <div style="display:flex;gap:6px;margin-top:4px">
          ${[[0.25,'🐢 0,25kg'],[0.35,'✅ 0,35kg'],[0.50,'🔥 0,50kg'],[0.70,'⚡ 0,70kg']].map(([v,l])=>`<button onclick="localStorage.setItem('bt_sim_goal','${v}');render()" style="flex:1;padding:8px 2px;border-radius:8px;border:1px solid ${simGoal===v?ac:'var(--border2)'};background:${simGoal===v?`${ac}18`:'var(--bg4)'};color:${simGoal===v?ac:'var(--muted)'};font-family:var(--font2);font-size:9px;font-weight:700;cursor:pointer;text-align:center">${l}</button>`).join('')}
        </div>
      </div>
    </div>

    <!-- Resultado: TDEE + metas -->
    <div class="card-accent" style="margin-bottom:14px;border-color:${ac}40">
      <div style="font-size:9px;color:${ac};letter-spacing:2px;text-transform:uppercase;margin-bottom:12px">📊 Cálculo — ${simW}kg · ${simDays}x/sem · +${simGoal*1000/10}g/sem</div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px">
        <div style="background:var(--bg4);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--muted);margin-bottom:2px">BMR</div>
          <div style="font-size:18px;font-weight:800;color:var(--sub)">${Math.round(bmr)}</div>
          <div style="font-size:8px;color:var(--muted)">kcal basal</div>
        </div>
        <div style="background:var(--bg4);border-radius:10px;padding:12px;text-align:center">
          <div style="font-size:9px;color:var(--muted);margin-bottom:2px">TDEE</div>
          <div style="font-size:18px;font-weight:800;color:var(--info)">${tdee}</div>
          <div style="font-size:8px;color:var(--muted)">manutenção</div>
        </div>
      </div>

      <!-- Tabela comparativa -->
      <div style="background:var(--bg4);border-radius:10px;overflow:hidden;margin-bottom:12px">
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:8px 10px;border-bottom:1px solid var(--border)">
          <div style="font-size:8px;color:var(--muted);font-weight:700;text-transform:uppercase"></div>
          <div style="font-size:8px;color:var(--muted);font-weight:700;text-align:center;text-transform:uppercase">Atual</div>
          <div style="font-size:8px;color:${ac};font-weight:700;text-align:center;text-transform:uppercase">Meta</div>
          <div style="font-size:8px;color:var(--good);font-weight:700;text-align:center;text-transform:uppercase">Δ</div>
        </div>
        ${[
          ['⚡ Kcal',  curKcal,  kcalTarget, diffKcal, 'kcal'],
          ['🥩 Prot',  curProt+'g', protTarget+'g', (diffProt>0?'+':'')+diffProt+'g', ''],
          ['🍚 Carbs', curCarb+'g', carbTarget+'g', (diffCarb>0?'+':'')+diffCarb+'g', ''],
          ['🥑 Gord',  curFat+'g',  fatTarget+'g',  (diffFat>0?'+':'')+diffFat+'g', ''],
        ].map(([label,cur,tgt,dlt,unit])=>`
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr;padding:9px 10px;border-bottom:1px solid var(--border)">
            <div style="font-size:11px;font-weight:700">${label}</div>
            <div style="font-size:11px;text-align:center;color:var(--sub)">${cur}${unit}</div>
            <div style="font-size:11px;font-weight:800;text-align:center;color:${ac}">${tgt}${unit}</div>
            <div style="font-size:11px;font-weight:800;text-align:center;color:${String(dlt).startsWith('-')?'var(--bad)':'var(--good)'}">${String(dlt).startsWith('-')||String(dlt).startsWith('+')?dlt:'+'+dlt}</div>
          </div>`).join('')}
      </div>

      <!-- Superávit + projeção -->
      <div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:${diffKcal>0?'rgba(74,222,128,.08)':'rgba(96,165,250,.08)'};border-radius:8px;border:1px solid ${diffKcal>0?'rgba(74,222,128,.25)':'rgba(96,165,250,.25)'}">
        <div>
          <div style="font-size:10px;font-weight:700;color:${diffKcal>0?'var(--good)':'var(--info)'}">Superávit diário necessário</div>
          <div style="font-size:18px;font-weight:800;color:var(--text)">${diffKcal>0?'+':'-'}${Math.abs(diffKcal)} kcal/dia</div>
          <div style="font-size:9px;color:var(--muted);margin-top:2px">${Math.abs(surplusPerDay)} kcal de superávit sobre TDEE</div>
        </div>
        ${weeksToGoal>0?`<div style="text-align:right;flex-shrink:0;background:var(--bg4);border-radius:10px;padding:10px 12px">
          <div style="font-size:9px;color:var(--muted)">Meta ${goalW}kg</div>
          <div style="font-size:20px;font-weight:800;color:${ac}">~${weeksToGoal}</div>
          <div style="font-size:9px;color:var(--muted)">semanas</div>
        </div>`:''}
      </div>
    </div>

    <!-- Ajustes por refeição (dinâmico) -->
    ${diffKcal>0?`<div class="card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

        <div style="font-size:10px;font-weight:700;color:${ac}">+${diffKcal} kcal/dia</div>
      </div>
      <div style="font-size:10px;color:var(--muted);margin-bottom:12px;padding:7px 10px;background:rgba(226,226,64,.06);border-radius:6px;border-left:2px solid ${ac}">
        Porções calculadas para distribuir <strong style="color:${ac}">+${diffKcal} kcal</strong> entre as 7 refeições do seu plano.
        ${totalSuggested>0?`Total estimado: <strong style="color:var(--good)">+${totalSuggested} kcal</strong>`:''}
      </div>
      ${mealSuggestions.filter(m=>m.active).map(m=>`
        <div style="display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,.04)">
          <span style="font-size:20px;flex-shrink:0">${m.icon}</span>
          <div style="flex:1;min-width:0">
            <div style="font-size:11px;font-weight:800">${m.meal}</div>
            <div style="font-size:10px;color:var(--sub);margin-top:3px">${m.desc}</div>
          </div>
          <div style="text-align:right;flex-shrink:0">
            <div style="font-size:12px;font-weight:800;color:var(--good)">+${m.totalKcal}</div>
            <div style="font-size:8px;color:var(--muted)">kcal</div>
          </div>
        </div>`).join('')}
      ${mealSuggestions.filter(m=>!m.active).length>0?`<div style="font-size:9px;color:var(--muted);padding-top:8px;text-align:center">${mealSuggestions.filter(m=>!m.active).map(m=>m.meal).join(', ')} — sem ajuste necessário</div>`:''}
    </div>`:`<div class="card" style="margin-bottom:14px;border-color:rgba(96,165,250,.3)">
      <div style="padding:10px;text-align:center">
        <div style="font-size:22px;margin-bottom:6px">✅</div>
        <div style="font-size:12px;font-weight:700;color:var(--info)">Plano atual já supre este peso!</div>
        <div style="font-size:10px;color:var(--muted);margin-top:4px">Com ${simW}kg você precisaria de ${kcalTarget} kcal — seu plano atual (${curKcal} kcal) já está ${Math.abs(diffKcal)} kcal acima.</div>
      </div>
    </div>`}

    <!-- CTA -->

function getConsumedMacros(){
  // Returns macros consumed today based on checked meals and chosen options
  const log=getMealLog(getTodayKey());
  let kcal=0,prot=0,carb=0,gord=0,fibra=0;
  for(let i=0;i<7;i++){
    const entry=log['meal_'+i];
    if(!entry) continue;
    const optIdx=(entry.option||1)-1;
    const macros=ALL_MEAL_MACROS[i]?.[optIdx]||ALL_MEAL_MACROS[i]?.[0]||{kcal:0,prot:0,carb:0,gord:0,fibra:0};
    kcal+=macros.kcal; prot+=macros.prot; carb+=macros.carb;
    gord+=macros.gord; fibra+=macros.fibra;
  }
  return{kcal:Math.round(kcal),prot:parseFloat(prot.toFixed(1)),carb:parseFloat(carb.toFixed(1)),gord:parseFloat(gord.toFixed(1)),fibra:parseFloat(fibra.toFixed(1))};
}

// Chave de dia no FUSO LOCAL (não UTC) — evita registros caírem no dia errado à noite
function localDayKey(d=new Date()){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function getTodayKey(){ return localDayKey(); }
function getWeekKey(d=new Date()){
  const mon=new Date(d); mon.setDate(d.getDate()-((d.getDay()+6)%7)); return localDayKey(mon);
}
function getMealLog(date){

function saveMealLog(date,log){

function getMealStats(){
  const totalMeals=7; // refeições por dia no plano
  // Today
  const todayLog=getMealLog(getTodayKey());
  const todayDone=Object.keys(todayLog).filter(k=>k.startsWith('meal_')).length;
  // This week
  let weekDone=0, weekTotal=0;
  for(let i=0;i<7;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dk=localDayKey(d);
    const log=getMealLog(dk);
    const done=Object.keys(log).filter(k=>k.startsWith('meal_')).length;
    if(i===0||done>0){ weekTotal+=totalMeals; weekDone+=done; }
  }
  // Streak
  let streak=0;
  for(let i=0;i<60;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const dk=localDayKey(d);
    const log=getMealLog(dk);
    const done=Object.keys(log).filter(k=>k.startsWith('meal_')).length;
    if(done>=totalMeals) streak++;
    else if(i>0) break;
  }
  // Most skipped meal
  const skipCount=Array(totalMeals).fill(0);
  for(let i=0;i<30;i++){
    const d=new Date(); d.setDate(d.getDate()-i);
    const log=getMealLog(localDayKey(d));
    for(let m=0;m<totalMeals;m++){
      if(!log['meal_'+m]) skipCount[m]++;
    }
  }
  const mostSkippedIdx=skipCount.indexOf(Math.max(...skipCount));
  // Water today
  const water=parseInt(localStorage.getItem('bt_water_'+getTodayKey())||'0');
  return{todayDone,todayTotal:totalMeals,weekDone,weekTotal,streak,mostSkippedIdx,skipCount,water};
}
function addWater(ml){
  const key='bt_water_'+getTodayKey();
  const cur=parseInt(localStorage.getItem(key)||'0');
  localStorage.setItem(key, Math.max(0,cur+ml));
  render();
}

  {hour:16,min:30},{hour:17,min:30},{hour:18,min:0},

];

let _mealTimers=[];
let _waterTimers=[];

function scheduleWaterReminders(){
  if(localStorage.getItem('bt_water_reminders')==='off') return;
  _waterTimers.forEach(t=>clearTimeout(t));
  _waterTimers=[];
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date();
  const waterMessages=[
    'Beba 500ml agora — meta: 4L/dia',
    'Hidratação em dia? Beba mais um copo!',
    'Água é anabolismo! Mais 500ml.',
    'Lembre do 1L durante o treino!',
    'Já tomou água hoje? Beba agora!',
  ];
  WATER_TIMES.forEach(({hour,min},i)=>{
    let target=new Date();
    target.setHours(hour,min,0,0);
    if(target-now <= 0) target.setDate(target.getDate()+1);
    const diff=target-now;
    const t=setTimeout(()=>{
      const taken=(parseInt(localStorage.getItem('bt_water_'+getTodayKey())||'0')/1000).toFixed(1);
      if(parseFloat(taken)>=4) return;
      const msg=waterMessages[i%waterMessages.length];
      fireNotif('💧 Hora da água!', `${msg} (${taken}L tomados)`, 'water_reminder');
    }, diff);
    _waterTimers.push(t);

async function fireNotif(title, body, tag){
  // Try SW first (works in background), fallback to Notification API
  if('serviceWorker' in navigator){
    try{
      const reg=await navigator.serviceWorker.ready;
      await reg.showNotification(title,{
        body, tag, renotify:true,
        icon:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        badge:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        data:{url:'./'}
      });
      return;
    }catch(e){}
  }
  sendNotif(title, body, tag);
}

function scheduleMealReminders(){
  if(localStorage.getItem('bt_reminders')==='off') return;
  _mealTimers.forEach(t=>clearTimeout(t));
  _mealTimers=[];
  if(!('Notification' in window)||Notification.permission!=='granted') return;
  const now=new Date();

  MEAL_TIMES.forEach(({meal,hour,min,icon})=>{
    // Try today first, then tomorrow if already passed
    let target=new Date();
    target.setHours(hour,min,0,0);
    if(target-now <= 0){
      // Already passed today — schedule for tomorrow
      target.setDate(target.getDate()+1);
    }
    const diff=target-now;
    const t=setTimeout(()=>{
      fireNotif(`${icon} Hora da refeição!`,`${meal} — confira seu plano alimentar`,`meal_${meal}`);
      // Re-schedule for next day
      setTimeout(()=>scheduleMealReminders(), 60*1000);
    }, diff);
    _mealTimers.push(t);
  });

  scheduleWaterReminders();
  console.log(`Lembretes agendados: ${_mealTimers.length} refeições`);
}

function toggleMealReminders(){
  const cur=localStorage.getItem('bt_reminders');
  if(cur==='off'){
    localStorage.removeItem('bt_reminders');
    localStorage.removeItem('bt_water_reminders');
    // Pede permissão diretamente aqui — gesto do usuário garantido
    if('Notification' in window && Notification.permission==='default'){
      Notification.requestPermission().then(async p=>{
        if(p==='granted'){
          scheduleMealReminders();
          if(_swReg) await subscribePush();
          showSyncStatus('🔔 Lembretes ativados','var(--good)');
        } else {
          localStorage.setItem('bt_reminders','off');
          showSyncStatus('⚠️ Permissão negada — ative nas configurações','var(--warn)');
        }
      });
    } else if('Notification' in window && Notification.permission==='granted'){
      scheduleMealReminders();
      if(_swReg) subscribePush();
      showSyncStatus('🔔 Lembretes ativados','var(--good)');
    } else {
      showSyncStatus('⚠️ Notificações não suportadas neste navegador','var(--warn)');
    }
  } else {
    localStorage.setItem('bt_reminders','off');
    localStorage.setItem('bt_water_reminders','off');
    _mealTimers.forEach(t=>clearTimeout(t));
    _waterTimers.forEach(t=>clearTimeout(t));
    showSyncStatus('🔕 Lembretes desativados','var(--muted)');
  }
}
function buildEvolutionReport(period){
  const entries=getEntries();
  const workouts=getWorkouts();
  if(entries.length<2&&workouts.length<2)return null;
  const now=new Date();
  const days={semanal:7,mensal:30,trimestral:90,semestral:180}[period]||7;
  const cutoff=new Date(now-days*24*3600*1000);
  const recent=entries.filter(e=>new Date(e.date)>=cutoff);
  const recentWo=workouts.filter(w=>new Date(w.date)>=cutoff);
  const msgs=[];
  const achievements=[];
  const improvements=[];

  // Peso
  if(recent.length>=2){
    const first=recent[0],last=recent[recent.length-1];
    const wDiff=parseFloat((last.weight-first.weight).toFixed(1));
    const goal=_cache.settings.him?.goal||80;
    if(wDiff>0) achievements.push(`Ganhou ${wDiff}kg — avançando para ${goal}kg! 💪`);
    else if(wDiff<0) improvements.push(`Peso caiu ${Math.abs(wDiff)}kg — revise as calorias`);
    else improvements.push('Peso estável — aumente as calorias em 200kcal');
  }

  // Medidas prioritárias
  if(recent.length>=2){
    const first=recent[0],last=recent[recent.length-1];
    const p=PROFILES[CP];
    p.priorityKeys.forEach(k=>{
      const m=p.measurements.find(x=>x.key===k);
      if(!m||!first[k]||!last[k])return;
      const diff=parseFloat((last[k]-first[k]).toFixed(1));
      if(diff>0) achievements.push(`${m.label}: +${diff}cm 📈`);
      else if(diff<-0.5) improvements.push(`${m.label}: -${Math.abs(diff)}cm — foco nessa região`);
    });
  }

  // Treinos
  if(recentWo.length>0){
    const expected=Math.round(days/7*5);
    const consistency=Math.round((recentWo.length/expected)*100);
    if(consistency>=80) achievements.push(`${recentWo.length} treinos em ${days} dias — consistência de ${consistency}%! 🔥`);
    else if(consistency<50) improvements.push(`Só ${recentWo.length} treinos em ${days} dias (esperado ~${expected}) — mais consistência!`);
    // PR de carga
    const allEx=Object.values(getWorkoutProgram()).flatMap(w=>w.exercises);
    allEx.forEach(ex=>{
      const recentSessions=recentWo.filter(s=>s.exercises?.find(e=>e.name===ex.name));
      if(recentSessions.length>=2){
        const firstMax=recentSessions[0].exercises.find(e=>e.name===ex.name)?.sets.filter(s=>s.t==='work'&&s.weight).reduce((m,s)=>Math.max(m,s.weight),0)||0;
        const lastMax=recentSessions[recentSessions.length-1].exercises.find(e=>e.name===ex.name)?.sets.filter(s=>s.t==='work'&&s.weight).reduce((m,s)=>Math.max(m,s.weight),0)||0;
        if(lastMax>firstMax) achievements.push(`PR: ${ex.name} ${firstMax}→${lastMax}kg! 🏆`);
      }
    });
    // Deload check
    const deloadNeeded=checkDeload();
    if(deloadNeeded) improvements.push(`Você treinou ${deloadNeeded} semanas seguidas — semana de deload recomendada! Vá ao Guia para mais detalhes`);
    // Desequilíbrio
    const typeCount={pull:0,push:0,legs:0,upper:0,lower:0,a1:0,b1:0,c1:0,a2:0,b2:0,c2:0};
    recentWo.forEach(s=>{if(typeCount[s.type]!==undefined)typeCount[s.type]++;});
    const minType=Object.entries(typeCount).sort(([,a],[,b])=>a-b)[0];
    const maxType=Object.entries(typeCount).sort(([,a],[,b])=>b-a)[0];
    if(maxType[1]>0&&minType[1]<maxType[1]*0.4)
      improvements.push(`Desequilíbrio: ${getWorkoutProgram()[minType[0]]?.label||minType[0]} com só ${minType[1]}x — equalize o volume`);
  }

  return{achievements,improvements,period};
}

function closeEvoCard(){
  const el=document.getElementById('evo-card');
  if(el) el.remove();
}

function showEvolutionCard(period){
  const report=buildEvolutionReport(period);
  if(!report)return;
  const existing=document.getElementById('evo-card');
  if(existing)existing.remove();
  const card=document.createElement('div');
  card.id='evo-card';
  const labels={semanal:'📅 Semana',mensal:'📆 Mês',trimestral:'📊 Trimestre',semestral:'🗓️ Semestre'};
  card.style.cssText='position:fixed;top:0;left:0;right:0;z-index:500;background:var(--bg2);border-bottom:2px solid var(--him);padding:14px 16px 16px;max-height:75vh;overflow-y:auto;box-shadow:0 8px 32px rgba(0,0,0,.7)';
  card.innerHTML=`
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div style="font-family:var(--font2);font-size:15px;font-weight:800;color:var(--him)">${labels[period]} — Relatório de Evolução</div>
      <button onclick="closeEvoCard()" style="background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;line-height:1;z-index:510;position:relative">✕</button>
    </div>
    ${report.achievements.length?`
      <div style="font-size:9px;color:var(--good);letter-spacing:2px;text-transform:uppercase;margin-bottom:8px">✅ Conquistas</div>
      ${report.achievements.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--good);flex-shrink:0">▶</span><span style="font-size:11px;color:var(--sub);line-height:1.6">${a}</span></div>`).join('')}`:''}
    ${report.improvements.length?`
      <div style="font-size:9px;color:var(--warn);letter-spacing:2px;text-transform:uppercase;margin:12px 0 8px">⚠️ Pontos de Melhora</div>
      ${report.improvements.map(a=>`<div style="display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.04)"><span style="color:var(--warn);flex-shrink:0">▶</span><span style="font-size:11px;color:var(--sub);line-height:1.6">${a}</span></div>`).join('')}`:''}
    ${!report.achievements.length&&!report.improvements.length?'<div style="font-size:11px;color:var(--muted);text-align:center;padding:12px">Registre mais dados para ver sua evolução!</div>':''}
    <div style="display:flex;gap:6px;margin-top:14px;flex-wrap:wrap">
      ${['semanal','mensal','trimestral','semestral'].map(p=>`<button onclick="showEvolutionCard('${p}')" style="padding:5px 12px;border-radius:20px;font-family:var(--font);font-size:8px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;background:${p===period?'var(--himb)':'var(--bg3)'};border:1px solid ${p===period?'var(--himl)':'var(--border2)'};color:${p===period?'var(--him)':'var(--muted)'}">${{semanal:'Semana',mensal:'Mês',trimestral:'Trimestre',semestral:'Semestre'}[p]}</button>`).join('')}
    </div>`;
  document.body.prepend(card);
  // Notificação push
  if(report.achievements.length)
    sendNotif('Body Tracker 💪',report.achievements[0]);
}

function checkAndShowEvolutionReport(){
  const workouts=getWorkouts();
  const entries=getEntries();
  if(entries.length<2&&workouts.length<3)return;
  const lastShown=parseInt(localStorage.getItem('bt_last_report')||'0');
  const now=Date.now();
  if(now-lastShown > 6*24*3600*1000){ // mostra a cada ~6 dias
    localStorage.setItem('bt_last_report',now);
    setTimeout(()=>showEvolutionCard('semanal'),2000);
  }
}

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const rawData=window.atob(base64);
  return Uint8Array.from([...rawData].map(c=>c.charCodeAt(0)));
}

let _swReg=null;

async function subscribePush(){
  if(!_swReg) return;
  try{
    const existing=await _swReg.pushManager.getSubscription();
    if(existing) return existing;
    const sub=await _swReg.pushManager.subscribe({
      userVisibleOnly:true,
      applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
    });
    // Save subscription to localStorage for reference
    localStorage.setItem('bt_push_sub',JSON.stringify(sub));
    console.log('Push subscription:', JSON.stringify(sub));
    return sub;
  }catch(e){
    console.warn('Push subscribe failed:',e);
  }
}

async function schedulePushMealReminder(meal,hour,min,icon){
  // Use SW periodic sync if available, otherwise setTimeout
  const now=new Date();
  const target=new Date();
  target.setHours(hour,min,0,0);
  const diff=target-now;
  if(diff<=0||diff>=24*3600*1000) return;
  setTimeout(async()=>{
    if('Notification' in window&&Notification.permission==='granted'){
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification(`${icon} Hora da refeição!`,{
        body:`${meal} — confira seu plano alimentar`,
        icon:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        badge:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        tag:`meal_${meal}`,
        renotify:true,
        data:{url:'./'}
      });
    }
  },diff);
}

async function schedulePushWaterReminder(hour,min,msgFn){
  const now=new Date();
  const target=new Date();
  target.setHours(hour,min,0,0);
  const diff=target-now;
  if(diff<=0||diff>=24*3600*1000) return;
  setTimeout(async()=>{
    const taken=(parseInt(localStorage.getItem('bt_water_'+getTodayKey())||'0')/1000).toFixed(1);
    if(parseFloat(taken)>=4) return;
    if('Notification' in window&&Notification.permission==='granted'){
      const reg=await navigator.serviceWorker.ready;
      reg.showNotification('💧 Hora da água!',{
        body:msgFn(taken),
        icon:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        badge:'https://em-content.zobj.net/source/apple/354/flexed-biceps_1f4aa.png',
        tag:'water_reminder',
        renotify:true,
        data:{url:'./'}
      });
    }
  },diff);
}
