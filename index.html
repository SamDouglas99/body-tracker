<html lang="pt-BR">
<head>

<title>Body Tracker Pro 💪</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getFirestore, doc, getDoc, setDoc, collection, getDocs, addDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const firebaseConfig={apiKey:"AIzaSyBlw4eUTiY9tj2DVrOriGGhfabn91POR0c",authDomain:"body-tracker-6631d.firebaseapp.com",projectId:"body-tracker-6631d",storageBucket:"body-tracker-6631d.firebasestorage.app",messagingSenderId:"526453249400",appId:"1:526453249400:web:1353e6dfb5442d7f5be48d"};
const fbApp=initializeApp(firebaseConfig);
const db=getFirestore(fbApp);
window._fb={async getEntries(p){const q=query(collection(db,`entries_${p}`),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},async saveEntry(p,e){const r=doc(collection(db,`entries_${p}`));await setDoc(r,e);},async getSettings(p){const s=await getDoc(doc(db,"settings",p));return s.exists()?s.data():null;},async saveSettings(p,d){await setDoc(doc(db,"settings",p),d);},async getWorkouts(){const q=query(collection(db,"workouts"),orderBy("date"));const s=await getDocs(q);return s.docs.map(d=>({id:d.id,...d.data()}));},async saveWorkout(s){await addDoc(collection(db,"workouts"),s);},listenEntries(p,cb){const q=query(collection(db,`entries_${p}`),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});},listenWorkouts(cb){const q=query(collection(db,"workouts"),orderBy("date"));return onSnapshot(q,s=>{cb(s.docs.map(d=>({id:d.id,...d.data()})));});}};
// Dispara _btInit assim que window._fb estiver pronto
if(document.readyState==="complete"){if(window._btInit)window._btInit();}else{window.addEventListener("load",()=>{if(window._btInit)window._btInit();});}
</script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#08080e;--bg2:#0d0d18;--bg3:#111120;--bg4:#171728;--bg5:#1d1d30;
  --border:#1e1e30;--border2:#262638;--muted:#505070;--text:#ddddf0;--sub:#9090b8;
  --him:#e2e240;--him2:#a0e240;--him3:#ffaa00;--himb:rgba(226,226,64,.1);--himl:rgba(226,226,64,.4);
  --her:#f472b6;--her2:#c084fc;--her3:#fb923c;--herb:rgba(244,114,182,.1);--herl:rgba(244,114,182,.4);
  --good:#4ade80;--bad:#f87171;--warn:#fbbf24;--info:#60a5fa;--purple:#a78bfa;
  --r:12px;--font:'Space Mono',monospace;--font2:'Syne',sans-serif;
  --pull:#4a9eff;--push:#ff6b4a;--legs:#e2e240;--upper:#c084fc;--lower:#fb923c;
}
html,body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;overflow-x:hidden}
#shell{display:flex;min-height:100vh}
#sidebar{width:220px;background:var(--bg2);border-right:1px solid var(--border);position:fixed;top:0;left:0;height:100vh;z-index:200;display:flex;flex-direction:column}
#main{margin-left:220px;flex:1;min-height:100vh}
#content{padding:0 0 60px}
.sb-header{padding:20px 16px 14px;border-bottom:1px solid var(--border)}
.sb-logo{font-family:var(--font2);font-size:18px;font-weight:800;margin-bottom:12px}
.him-mode .sb-logo span{color:var(--him)}
.her-mode .sb-logo span{color:var(--her)}
.sb-profiles{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.pb{padding:8px 4px;background:transparent;border:1px solid var(--border2);border-radius:8px;cursor:pointer;font-family:var(--font);text-align:center;color:var(--muted);font-size:9px;letter-spacing:1px;text-transform:uppercase;transition:all .2s}
.pb .pe{font-size:20px;display:block;margin-bottom:3px}
.pb.him.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.pb.her.active{background:var(--herb);border-color:var(--herl);color:var(--her)}
.sb-nav{flex:1;padding:12px 0;overflow-y:auto}
.sn{display:flex;align-items:center;gap:10px;padding:10px 16px;cursor:pointer;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;transition:all .15s;border-left:3px solid transparent;background:none;border-top:none;border-right:none;border-bottom:none;width:100%;font-family:var(--font)}
.sn:hover{color:var(--text);background:var(--bg3)}
.him-mode .sn.active{color:var(--him);border-left-color:var(--him);background:var(--himb)}
.her-mode .sn.active{color:var(--her);border-left-color:var(--her);background:var(--herb)}
.sn .si{font-size:15px;width:18px;text-align:center}
.sb-footer{padding:12px 16px;border-top:1px solid var(--border);font-size:9px;color:var(--muted);letter-spacing:1px}
#topbar{padding:16px 24px;border-bottom:1px solid var(--border);background:var(--bg);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100}
.tb-title{font-family:var(--font2);font-size:20px;font-weight:800}
.him-mode .tb-accent{color:var(--him)}
.her-mode .tb-accent{color:var(--her)}
.tb-sub{font-size:10px;color:var(--muted);margin-top:2px}
.tb-badge{padding:5px 12px;border-radius:20px;font-size:9px;letter-spacing:2px;text-transform:uppercase;font-weight:700}
.him-mode .tb-badge{background:var(--himb);color:var(--him);border:1px solid var(--himl)}
.her-mode .tb-badge{background:var(--herb);color:var(--her);border:1px solid var(--herl)}
.page{padding:22px 24px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:16px}
.card-accent{background:linear-gradient(135deg,var(--bg4),var(--bg3));border:1px solid var(--border2);border-radius:var(--r);padding:16px}
.lbl{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;display:block;margin-bottom:6px}
.sec-title{font-family:var(--font2);font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;color:var(--sub);padding:20px 24px 10px;display:flex;align-items:center;gap:8px}
.sec-title::after{content:'';flex:1;height:1px;background:var(--border);margin-left:8px}
.him-mode .accent-val{color:var(--him)}
.her-mode .accent-val{color:var(--her)}
.big-num{font-size:38px;font-weight:700;line-height:1;font-family:var(--font2)}
.him-mode .big-num{color:var(--him)}
.her-mode .big-num{color:var(--her)}
.bar{height:6px;background:var(--bg5);border-radius:3px;overflow:hidden}
.bar.sm{height:4px}
.fill{height:100%;border-radius:3px;transition:width 1s ease}
.him-mode .fill{background:linear-gradient(90deg,var(--him),var(--him2))}
.her-mode .fill{background:linear-gradient(90deg,var(--her),var(--her2))}
.him-mode .fill-warm{background:linear-gradient(90deg,var(--him),var(--him3))}
.her-mode .fill-warm{background:linear-gradient(90deg,var(--her),var(--her3))}
.badge{display:inline-block;font-size:8px;letter-spacing:1px;padding:2px 7px;border-radius:4px;text-transform:uppercase}
.him-mode .badge{background:var(--himb);border:1px solid var(--himl);color:var(--him)}
.her-mode .badge{background:var(--herb);border:1px solid var(--herl);color:var(--her)}
.badge-good{background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.4);color:var(--good)}
.badge-warn{background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.4);color:var(--warn)}
.badge-bad{background:rgba(248,113,113,.1);border:1px solid rgba(248,113,113,.4);color:var(--bad)}
.badge-info{background:rgba(96,165,250,.1);border:1px solid rgba(96,165,250,.4);color:var(--info)}
.badge-purple{background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.4);color:var(--purple)}
input[type=number],input[type=text],select{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font);font-size:13px;padding:10px 12px;outline:none;transition:border-color .2s;-webkit-appearance:none}
input:focus,select:focus{border-color:var(--muted)}
.him-mode input:focus,.him-mode select:focus{border-color:var(--him)}
.her-mode input:focus,.her-mode select:focus{border-color:var(--her)}
.him-mode .finput{border-color:rgba(226,226,64,.3)}
.her-mode .finput{border-color:rgba(244,114,182,.3)}
.flabel{display:block;font-size:9px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:5px}
.fgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.btn{padding:12px 20px;border:none;border-radius:8px;font-family:var(--font);font-size:11px;font-weight:700;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .2s}
.him-mode .btn-primary{background:var(--him);color:#08080e}
.her-mode .btn-primary{background:var(--her);color:#08080e}
.btn-ghost{background:transparent;border:1px solid var(--border2);color:var(--muted);font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;padding:6px 12px;border-radius:6px;cursor:pointer}
.btn-ghost:hover{border-color:var(--muted);color:var(--text)}
.trow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;border-bottom:1px solid rgba(255,255,255,.04)}
.trow:last-child{border:none}
.diff-up{color:var(--good)}
.diff-dn{color:var(--bad)}
.diff-0{color:var(--muted)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.stab{background:var(--bg3);border:1px solid var(--border2);border-radius:20px;padding:6px 14px;font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);transition:all .2s}
.him-mode .stab.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.her-mode .stab.active{background:var(--herb);border-color:var(--herl);color:var(--her)}
.chart-wrap{height:220px;position:relative}
.no-data{text-align:center;padding:40px;color:var(--muted);font-size:11px}
.empty{text-align:center;padding:48px 20px;color:var(--muted)}
.empty-ico{font-size:48px;margin-bottom:12px}
.empty-txt{font-size:12px;line-height:2}
::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--border2);border-radius:2px}
/* ── WORKOUT TRACKER ── */
.wo-day-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:20px}
.wo-day{padding:10px 4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;text-align:center;cursor:pointer;transition:all .2s}
.wo-day .wd-label{font-size:8px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:4px}
.wo-day .wd-type{font-size:10px;font-weight:700;margin-bottom:2px}
.wo-day .wd-dot{width:6px;height:6px;border-radius:50%;margin:0 auto;background:var(--border2)}
.wo-day.pull .wd-type{color:var(--pull)}
.wo-day.push .wd-type{color:var(--push)}
.wo-day.legs .wd-type{color:var(--legs)}
.wo-day.upper .wd-type{color:var(--upper)}
.wo-day.lower .wd-type{color:var(--lower)}
.wo-day.pull.active,.wo-day.pull:hover{background:rgba(74,158,255,.1);border-color:var(--pull)}
.wo-day.pull.active .wd-dot{background:var(--pull)}
.wo-day.push.active,.wo-day.push:hover{background:rgba(255,107,74,.1);border-color:var(--push)}
.wo-day.push.active .wd-dot{background:var(--push)}
.wo-day.legs.active,.wo-day.legs:hover{background:rgba(226,226,64,.1);border-color:var(--legs)}
.wo-day.legs.active .wd-dot{background:var(--legs)}
.wo-day.upper.active,.wo-day.upper:hover{background:rgba(192,132,252,.1);border-color:var(--upper)}
.wo-day.upper.active .wd-dot{background:var(--upper)}
.wo-day.lower.active,.wo-day.lower:hover{background:rgba(251,146,60,.1);border-color:var(--lower)}
.wo-day.lower.active .wd-dot{background:var(--lower)}
.wo-day.rest .wd-type{color:var(--muted);font-size:9px}
/* Exercise card in logging mode */
.ex-log-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.ex-log-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border-bottom:1px solid var(--border)}
.ex-log-name{font-size:13px;font-weight:700}
.ex-log-prev{font-size:10px;color:var(--muted)}
.ex-log-body{padding:12px 14px}
.set-row{display:grid;grid-template-columns:80px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px;padding:8px;border-radius:8px;background:var(--bg4)}
.set-row.done-row{border-left:3px solid var(--good)}
.set-badge{font-size:8px;padding:3px 6px;border-radius:4px;text-align:center;letter-spacing:0.5px}
.set-badge.warm{background:rgba(96,165,250,.15);color:var(--info)}
.set-badge.adj{background:rgba(251,191,36,.15);color:var(--warn)}
.set-badge.work{background:rgba(74,222,128,.15);color:var(--good)}
.set-label{font-size:9px;color:var(--muted);text-align:center;margin-top:2px}
.set-inp{background:var(--bg2);border:1px solid var(--border2);border-radius:6px;color:var(--text);font-family:var(--font);font-size:15px;font-weight:700;padding:8px;text-align:center;width:100%;outline:none;-webkit-appearance:none}
.set-inp:focus{border-color:var(--good)}
.set-done-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border2);background:var(--bg5);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s;flex-shrink:0}
.set-done-btn.done{background:rgba(74,222,128,.2);border-color:var(--good)}
.set-prev{font-size:9px;color:var(--muted);text-align:center}
/* Timer */
#rest-timer{position:fixed;bottom:70px;right:20px;background:var(--bg3);border:1px solid var(--border2);border-radius:14px;padding:12px 18px;z-index:150;display:none;align-items:center;gap:12px;box-shadow:0 8px 32px rgba(0,0,0,.5)}
#rest-timer.show{display:flex}
#timer-display{font-size:24px;font-weight:700;font-family:var(--font2);color:var(--good)}
#timer-skip{background:transparent;border:1px solid var(--border2);color:var(--muted);border-radius:6px;padding:4px 10px;font-family:var(--font);font-size:9px;cursor:pointer}
/* Workout history */
.wo-hist-card{background:var(--bg3);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px}
.wo-hist-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.wo-type-chip{padding:3px 10px;border-radius:12px;font-size:9px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
.chip-pull{background:rgba(74,158,255,.15);color:var(--pull);border:1px solid rgba(74,158,255,.4)}
.chip-push{background:rgba(255,107,74,.15);color:var(--push);border:1px solid rgba(255,107,74,.4)}
.chip-legs{background:rgba(226,226,64,.15);color:var(--legs);border:1px solid rgba(226,226,64,.4)}
.chip-upper{background:rgba(192,132,252,.15);color:var(--upper);border:1px solid rgba(192,132,252,.4)}
.chip-lower{background:rgba(251,146,60,.15);color:var(--lower);border:1px solid rgba(251,146,60,.4)}
.wo-hist-ex{font-size:10px;color:var(--sub);padding:3px 0;border-bottom:1px solid rgba(255,255,255,.03)}
.wo-hist-ex:last-child{border:none}
.wo-hist-sets{font-size:9px;color:var(--muted);margin-left:8px}
/* Progress chart filters */
.cf{background:var(--bg4);border:1px solid var(--border2);border-radius:6px;font-family:var(--font);font-size:9px;padding:5px 10px;cursor:pointer;letter-spacing:1px;text-transform:uppercase;color:var(--muted);transition:all .2s}
.him-mode .cf.active{background:var(--himb);border-color:var(--himl);color:var(--him)}
.her-mode .cf.active{background:var(--herb);border-color:var(--herl);color:var(--her)}
/* Meal cards */
.meal-tab-btn{padding:5px 12px;border-radius:20px;font-family:var(--font);font-size:9px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);background:var(--bg3);border:1px solid var(--border2);transition:all .2s}
.meal-tab-btn.active{background:rgba(74,222,128,.1);border-color:rgba(74,222,128,.4);color:var(--good)}
.meal-option{background:var(--bg4);border-radius:8px;padding:12px;margin-bottom:8px;font-size:11px;color:var(--sub);line-height:1.8;border-left:3px solid var(--border2)}
.meal-option.opt1{border-left-color:var(--him)}
.meal-option.opt2{border-left-color:var(--info)}
.meal-option.opt3{border-left-color:var(--purple)}
/* Modal */
#modal{position:fixed;inset:0;background:rgba(8,8,14,.95);z-index:300;display:none;align-items:center;justify-content:center;padding:20px}
#modal.show{display:flex}
.modal-box{background:var(--bg3);border:1px solid var(--border2);border-radius:16px;padding:28px 22px;width:100%;max-width:400px}
/* ── MOBILE NAV — base (oculta em desktop) ── */
#mobile-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-top:1px solid var(--border);z-index:200;padding:3px 0 calc(3px + env(safe-area-inset-bottom))}
.mn{flex:1;background:none;border:none;font-family:var(--font);font-size:7px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;color:var(--muted);padding:7px 2px;border-top:2px solid transparent;display:flex;flex-direction:column;align-items:center;gap:2px}
.mn .mi{font-size:18px}
.him-mode .mn.active{color:var(--him);border-top-color:var(--him)}
.her-mode .mn.active{color:var(--her);border-top-color:var(--her)}
/* ── MOBILE / iPhone 16 ── */
@media(max-width:430px){
  #sidebar{display:none}
  #main{margin-left:0}
  #mobile-nav{display:flex !important}
  .grid2,.grid3,.grid4{grid-template-columns:1fr 1fr}
  .grid3{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .page{padding:12px}
  .wo-day-grid{grid-template-columns:repeat(7,1fr);gap:3px}
  .wo-day{padding:8px 2px}
  .wo-day .wd-label{font-size:6px}
  .wo-day .wd-type{font-size:9px}
  .set-row{grid-template-columns:64px 1fr 1fr 38px;gap:5px;padding:6px}
  .set-inp{font-size:14px;padding:7px 4px}
  .big-num{font-size:30px}
  #topbar{padding:12px 14px;padding-top:calc(12px + env(safe-area-inset-top))}
  .tb-title{font-size:17px}
  .card{padding:12px}
  .card-accent{padding:12px}
  .sec-title{padding:14px 12px 8px;font-size:11px}
  .subtabs{gap:5px}
  .stab{padding:5px 10px;font-size:8px}
  .btn{padding:14px 16px;font-size:10px}
  #content{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  #rest-timer{bottom:calc(72px + env(safe-area-inset-bottom));right:12px;padding:10px 14px}
  #timer-display{font-size:20px}
  .modal-box{padding:22px 16px}
  .ex-log-header{padding:12px}
  .ex-log-body{padding:10px 10px}
  .sb-footer{padding-bottom:calc(12px + env(safe-area-inset-bottom))}
  .wo-hist-card{padding:12px}
  input[type=number],input[type=text],select{font-size:16px !important}
  .set-inp{font-size:16px !important}
}
@media(max-width:720px){
  #sidebar{width:100%;height:auto;position:sticky;top:0;flex-direction:column;border-right:none;border-bottom:1px solid var(--border)}
  #main{margin-left:0}
  #mobile-nav{display:flex !important}
  .sb-nav{display:none}
  .grid2,.grid3,.grid4{grid-template-columns:1fr}
  .fgrid{grid-template-columns:1fr 1fr}
  .page{padding:14px}
  .wo-day-grid{grid-template-columns:repeat(7,1fr);gap:4px}
  .wo-day .wd-label{font-size:7px}
  .set-row{grid-template-columns:70px 1fr 1fr 40px}
  input[type=number],input[type=text],select{font-size:16px !important}
  .set-inp{font-size:16px !important}
}
</style>
</head>
<body>
<div id="shell">
<div id="sidebar">
  <div class="sb-header">
    <div class="sb-logo">Body<span>Tracker</span></div>

function getD(){
  const p=PROFILES[CP],s=getSettings(),entries=getEntries();
  const initW=s?.weight||p.initialWeight||60;
  const goalW=s?.goal||p.goalWeight||55;
  const h=s?.height||p.height||1.65;
  const latest=entries.length>0?entries[entries.length-1]:null;
  const curW=latest?.weight||initW;
  const totalD=goalW-initW;
  const progress=totalD!==0?Math.min(Math.max(((curW-initW)/totalD)*100,0),100):100;
  const remaining=(goalW-curW).toFixed(1);
  const bmi=h?(curW/(h*h)).toFixed(1):null;
  const bmiInfo=getBMI(bmi);
  const wp=entries.length>=2?((entries[entries.length-1].weight-entries[entries.length-2].weight).toFixed(1)):null;
  const weeks=Math.abs(remaining)>0.1?Math.ceil(Math.abs(remaining)/0.3):0;
  const bf=estimateBF(latest,h);
  return{p,s,entries,initW,goalW,h,latest,curW,totalD,progress,remaining,bmi,bmiInfo,wp,weeks,bf};
}
function getBMI(b){

  if(n<25)return{label:'Peso normal',color:'var(--good)'};
  if(n<30)return{label:'Sobrepeso',color:'var(--warn)'};
  return{label:'Obesidade',color:'var(--bad)'};
}
function estimateBF(l,h){
  if(!l||!h)return null;
  if(CP==='him'&&l.waist&&l.neck){
    const v=495/(1.0324-0.19077*Math.log10(l.waist-l.neck)+0.15456*Math.log10(h*100))-450;
    return Math.max(4,Math.min(50,parseFloat(v.toFixed(1))));
  }
  if(CP==='her'&&l.waist&&l.hip&&l.neck){
    const v=495/(1.29579-0.35004*Math.log10(l.waist+l.hip-l.neck)+0.22100*Math.log10(h*100))-450;
    return Math.max(10,Math.min(55,parseFloat(v.toFixed(1))));
  }
  return null;
}
function fmtD(d){return new Date(d).toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'});}
function fmtFull(d){return new Date(d).toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'});}

// ── Workout stats ──
function getMaxLoad(exName){
  return getWorkouts().reduce((mx,s)=>{
    const ex=s.exercises?.find(e=>e.name===exName);
    if(ex){ex.sets.forEach(st=>{if(st.weight&&st.weight>mx)mx=st.weight;});}
    return mx;
  },0);
}
function getLastLoad(exName,type){
  const last=getLastWorkout(type);
  if(!last)return null;
  const ex=last.exercises?.find(e=>e.name===exName);
  if(!ex)return null;
  const ws=ex.sets.filter(s=>s.t==='work'&&s.weight);
  if(!ws.length)return null;
  return{weight:ws[0].weight,reps:ws[0].reps,all:ws.map(s=>`${s.weight}kg×${s.reps}`).join(' / ')};
}
function getVolumeHistory(exName){
  return getWorkouts()
    .filter(s=>s.exercises?.find(e=>e.name===exName))
    .slice(-12)
    .map(s=>{
      const ex=s.exercises.find(e=>e.name===exName);
      const max=ex.sets.filter(st=>st.t==='work'&&st.weight).reduce((m,st)=>st.weight>m?st.weight:m,0);
      return{date:fmtD(s.date),maxW:max};
    });
}
function getTotalSessions(){return getWorkouts().length;}
function getThisWeekSessions(){
  const now=new Date(),wk=now.getDay();
  const mon=new Date(now);mon.setDate(now.getDate()-((wk+6)%7));mon.setHours(0,0,0,0);
  return getWorkouts().filter(s=>new Date(s.date)>=mon).length;
}

    <div class="grid2" style="margin-bottom:14px">

function buildWeekBar(){

  const days=WEEK_SCHEDULE.map((d,i)=>{
    const jsDay=[1,2,3,4,5,6,0][i];
    const isToday=jsDay===today;
    const t=d.type;
    return`<div class="wo-day ${t}${isToday?' active':''}" onclick="go('treinos');activeWorkoutType='${t}';setTimeout(()=>{woSubTab='log';render();},10)">
      <div class="wd-label">${d.day}</div>

    <div class="sec-title" style="padding:0 0 14px">💪 Evolução por Exercício</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px">

    </div>
    <div class="card"><div style="height:200px;position:relative"><canvas id="woChart"></canvas></div></div>
  </div>`;

function setChartKey(k,btn){
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const entries=getEntries(),p=PROFILES[CP];
  const canvas=document.getElementById('mainChart');
  if(!canvas)return;
  const data=entries.slice(-16).map(e=>({x:fmtD(e.date),y:parseFloat(e[k]||0)})).filter(d=>d.y>0);
  if(charts.main){charts.main.destroy();}
  if(data.length<2){canvas.parentElement.innerHTML='<div class="no-data">Registre ao menos 2 medições</div>';return;}
  charts.main=mkLine(canvas,data,p.accentHex);
}
function setWoChart(name,btn){
  woPrgExercise=name;
  document.querySelectorAll('.cf').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  const canvas=document.getElementById('woChart');if(!canvas)return;
  const data=getVolumeHistory(name);
  if(charts.wo){charts.wo.destroy();}
  if(data.length<2){canvas.parentElement.innerHTML='<div class="no-data">Sem dados suficientes para este exercício</div>';return;}
  charts.wo=mkLine(canvas,data.map(d=>({x:d.date,y:d.maxW})),PROFILES[CP].accentHex);
}
function mkLine(canvas,data,color){
  return new Chart(canvas,{type:'line',data:{labels:data.map(d=>d.x),datasets:[{data:data.map(d=>d.y),borderColor:color,backgroundColor:color+'18',borderWidth:2.5,pointBackgroundColor:color,pointRadius:5,tension:0.3,fill:true}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{backgroundColor:'#111120',borderColor:color+'66',borderWidth:1,titleColor:color,bodyColor:'#9090b8',padding:10,cornerRadius:8}},scales:{x:{grid:{color:'#1a1a28'},ticks:{color:'#505070',font:{family:'Space Mono',size:9}}},y:{grid:{color:'#1a1a28'},ticks:{color:'#505070',font:{family:'Space Mono',size:9}}}}}});
}
function initCharts(){
  if(CT==='evolucao'){
    const entries=getEntries(),p=PROFILES[CP];
    const canvas=document.getElementById('mainChart');
    if(!canvas||entries.length<2)return;
    const data=entries.slice(-16).map(e=>({x:fmtD(e.date),y:parseFloat(e.weight||0)}));
    charts.main=mkLine(canvas,data,p.accentHex);
  }
}

function buildTreinos(){

  if(woSubTab==='history') return buildWoHistory(tabs);
  if(woSubTab==='progress') return buildWoProgress(tabs);
  return buildWoLog(tabs);
}

function buildWoLog(tabs){

function doneSet(exIdx,si,restSecs){
  const btn=document.getElementById(`btn_${exIdx}_${si}`);
  const row=document.getElementById(`srow_${exIdx}_${si}`);
  if(btn){btn.classList.toggle('done');btn.textContent=btn.classList.contains('done')?'✓':'○';}
  if(row){row.classList.toggle('done-row');}
  if(btn&&btn.classList.contains('done')&&restSecs>0) startTimer(restSecs);
}

function startTimer(secs){
  stopTimer();
  timerSeconds=secs;
  const el=document.getElementById('rest-timer');
  const disp=document.getElementById('timer-display');
  if(!el||!disp)return;
  el.classList.add('show');
  updateTimerDisplay();
  timerInterval=setInterval(()=>{
    timerSeconds--;
    updateTimerDisplay();
    if(timerSeconds<=0)stopTimer();
  },1000);
}
function updateTimerDisplay(){
  const disp=document.getElementById('timer-display');
  if(disp){const m=Math.floor(timerSeconds/60),s=timerSeconds%60;disp.textContent=`${m}:${String(s).padStart(2,'0')}`;disp.style.color=timerSeconds<=10?'var(--bad)':'var(--good)';}
}
function stopTimer(){
  clearInterval(timerInterval);timerInterval=null;
  const el=document.getElementById('rest-timer');
  if(el)el.classList.remove('show');
}

function saveWorkoutSession(){
  const prog=WORKOUT_PROGRAM[activeWorkoutType];
  if(!prog){alert('Selecione um treino primeiro!');return;}
  const session={id:Date.now(),date:new Date().toISOString(),type:activeWorkoutType,exercises:[]};
  prog.exercises.forEach((ex,ei)=>{
    const sets=[];
    ex.sets.forEach((s,si)=>{
      const w=parseFloat(document.getElementById(`w_${ei}_${si}`)?.value)||0;
      const r=parseInt(document.getElementById(`r_${ei}_${si}`)?.value)||0;
      const done=document.getElementById(`btn_${ei}_${si}`)?.classList.contains('done')||false;
      sets.push({t:s.t,weight:w,reps:r,done});
    });
    session.exercises.push({name:ex.name,sets});
  });
  saveWorkout(session);
  stopTimer();
  woSubTab='history';
  render();
  setTimeout(()=>alert('✅ Treino salvo! Continue evoluindo! 💪'),100);
}

function buildWoHistory(tabs){
  const sessions=getWorkouts();
  const ac=PROFILES[CP].accentHex;
  const chipClass={pull:'chip-pull',push:'chip-push',legs:'chip-legs',upper:'chip-upper',lower:'chip-lower'};
  const labels={pull:'Pull',push:'Push',legs:'Legs',upper:'Upper',lower:'Lower'};

  // Stats
  const totalW=sessions.length;
  const thisWeek=getThisWeekSessions();
  const typeCount={pull:0,push:0,legs:0,upper:0,lower:0};
  sessions.forEach(s=>{if(typeCount[s.type]!==undefined)typeCount[s.type]++;});

  const stats=`<div class="grid4" style="margin-bottom:20px">
    <div class="card"><div style="font-size:22px;font-weight:700;color:${ac}">${totalW}</div><div class="lbl" style="margin:4px 0">Total treinos</div></div>

    <div class="card"><div style="font-size:22px;font-weight:700;color:var(--info)">${Math.round(totalW/Math.max(1,Math.ceil((Date.now()-(sessions[0]?new Date(sessions[0].date):Date.now()))/(7*24*3600*1000))))}</div><div class="lbl" style="margin:4px 0">Média /semana</div></div>
    <div class="card">${Object.entries(typeCount).map(([t,n])=>`<div class="trow" style="padding:3px 0"><span style="font-size:9px;" class="wo-type-chip ${chipClass[t]||''}">${labels[t]}</span><span style="font-size:11px;font-weight:700;color:${ac}">${n}x</span></div>`).join('')}</div>
  </div>`;

  const list=sessions.length===0?`<div class="card empty"><div class="empty-ico">🏋️</div><div class="empty-txt">Nenhum treino registrado ainda.<br>Vá em "Registrar Treino" e comece!</div></div>`:
    [...sessions].reverse().map(s=>{
      const prog=WORKOUT_PROGRAM[s.type]||{};
      const exRows=s.exercises?.map(ex=>{
        const workSets=ex.sets.filter(st=>st.t==='work'&&st.weight>0);
        if(!workSets.length)return'';
        return`<div class="wo-hist-ex">💪 ${ex.name} <span class="wo-hist-sets">${workSets.map(st=>`${st.weight}kg×${st.reps}`).join(' · ')}</span></div>`;
      }).join('')||'';
      return`<div class="wo-hist-card">
        <div class="wo-hist-header">
          <div>
            <span class="wo-type-chip ${chipClass[s.type]||''}">${labels[s.type]||s.type}</span>
            <span style="font-size:10px;color:var(--muted);margin-left:8px">${fmtFull(s.date)}</span>
          </div>
          <span style="font-size:10px;color:var(--muted)">${s.exercises?.filter(ex=>ex.sets.some(st=>st.done)).length||0}/${s.exercises?.length||0} exerc.</span>
        </div>
        ${exRows}
      </div>`;
    }).join('');

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📚 Histórico de Treinos</div>
    ${tabs}
    ${stats}
    ${list}
  </div>`;
}

function buildWoProgress(tabs){
  const ac=PROFILES[CP].accentHex;
  const allEx=Object.values(WORKOUT_PROGRAM).flatMap(w=>w.exercises.map(e=>({...e,woType:w.label,color:w.color})));
  const exWithData=allEx.filter(ex=>getMaxLoad(ex.name)>0);

  const progressCards=exWithData.length===0?`<div class="card empty"><div class="empty-ico">📊</div><div class="empty-txt">Registre treinos para ver a evolução de carga</div></div>`:
    exWithData.map(ex=>{
      const max=getMaxLoad(ex.name);
      const hist=getVolumeHistory(ex.name);
      const first=hist[0]?.maxW||max;
      const gain=max-first;
      const sessions=getWorkouts().filter(s=>s.exercises?.find(e=>e.name===ex.name)).length;
      return`<div class="card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px">
          <div>
            <div style="font-size:12px;font-weight:700">${ex.name}</div>

          </div>
        </div>
        <div style="display:flex;gap:14px;font-size:10px;color:var(--sub)">
          <span>🏋️ ${sessions} sessões</span>
          ${gain>0?`<span class="diff-up">▲ ${gain}kg de evolução</span>`:'<span style="color:var(--muted)">Início</span>'}
        </div>
      </div>`;
    }).join('');

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">📊 Evolução de Carga</div>
    ${tabs}
    <div class="grid3">${progressCards}</div>

}

        <div class="card"><div style="font-size:28px;font-weight:700;color:${ac}">${Math.round((w*(CP==='him'?38:30))*0.28/9)}g</div><div class="lbl" style="margin:3px 0">Gorduras</div></div>
      </div>
      <div class="sec-title" style="padding:0 0 12px">5 erros que travam o ganho de massa</div>
      <div class="grid2">
        ${[
          {icon:'🍚',err:'Baixa ingestão de carboidratos','sol':'Carbs são combustível do treino. Sem eles, performance cai.'},
          {icon:'🥩',err:'Proteína insuficiente','sol':'Fração as proteínas em 5–6 refeições. Mín. 25g por refeição.'},
          {icon:'🍺',err:'Bebida alcoólica','sol':'Álcool = calorias vazias + reduz síntese proteica + hormônios.'},
          {icon:'😴',err:'Má qualidade do sono','sol':'GH é liberado no sono. Sem 7–9h, você desperdiça os treinos.'},
          {icon:'🎯',err:'Treino incoerente com o objetivo','sol':'Push·Pull·Legs·Upper·Lower é perfeito para o seu objetivo.'},
        ].map(e=>`<div class="card"><div style="display:flex;gap:10px;align-items:flex-start"><span style="font-size:24px">${e.icon}</span><div><div style="font-size:11px;font-weight:700;color:var(--bad);margin-bottom:4px">${e.err}</div><div style="font-size:11px;color:var(--sub);line-height:1.7">${e.sol}</div></div></div></div>`).join('')}
      </div>
    </div>`;
  }

  // Plano alimentar
  const mealCards=DIET_PLAN.map(meal=>`<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
      <div><span style="font-size:20px">${meal.icon}</span><span style="font-size:13px;font-weight:700;margin-left:8px">${meal.meal}</span></div>
      <span style="font-size:9px;color:${ac};letter-spacing:1px">${meal.time}</span>
    </div>
    ${meal.options.map((opt,i)=>`<div class="meal-option opt${i+1}"><div style="font-size:8px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:3px">Opção ${i+1}</div>${opt}</div>`).join('')}
  </div>`).join('');

  return`<div class="page">
    <div class="sec-title" style="padding:0 0 14px">🥗 Plano Alimentar — Nutri Carla Barros</div>
    ${subtabs}
    <div class="card-accent" style="margin-bottom:16px;border-color:${ac}30">
      <div style="font-size:9px;color:${ac};letter-spacing:3px;text-transform:uppercase;margin-bottom:8px">🎯 Objetivo: Hipertrofia</div>
      <div style="display:flex;gap:20px;flex-wrap:wrap;font-size:11px;color:var(--sub)">
        <span>💧 4L água/dia (1L no treino)</span>
        <span>🏋️ 4–6x musculação/semana</span>
        <span>🎉 1 refeição livre/semana</span>
        <span>😴 Sono é parte do tratamento</span>
      </div>
    </div>
    <div class="grid2">${mealCards}</div>
  </div>`;
}

// ══════════════════════════════════════
// GUIA
// ══════════════════════════════════════
function buildGuia(){
  const d=getD();
  const entries=getEntries();
  const weeksPassed=entries.length>1?Math.ceil((new Date(entries[entries.length-1].date)-new Date(entries[0].date))/(7*24*3600*1e3)):0;
  const totalGain=(d.curW-d.initW).toFixed(1);
  const avgPerWeek=weeksPassed>0?(totalGain/weeksPassed).toFixed(2):0;
  const ac=d.p.accentHex;
  const sessions=getTotalSessions();

  const guide=[
    {icon:'📈',cat:'Sobrecarga Progressiva',color:'var(--good)',text:'Regra #1 de hipertrofia: aumente peso ou repetições toda semana. Use o módulo de treinos para rastrear cada carga e não deixar de progredir.'},
    {icon:'📅',cat:'Frequência e Volume',color:'var(--info)',text:'O Push·Pull·Legs·Upper·Lower te dá 2x por semana de estímulo em cada músculo — frequência ideal para hipertrofia. Cada grupo recebe 10–20 séries semanais.'},
    {icon:'💡',cat:'Entendendo os Ajustes',color:'var(--warn)',text:'O protocolo do PDF usa Aquecimento → Ajuste 1 → Ajuste 2 → Trabalho. Os "ajustes" são series de aproximação (ramping) que preparam o músculo para as séries de trabalho máximo.'},
    {icon:'🍽️',cat:'Calorias e Massa',color:'var(--him)',text:`Com ${d.curW}kg, você precisa de ~${Math.round(d.curW*38)} kcal/dia para ganhar 0,3–0,5kg/semana. Se não estiver ganhando peso, adicione 200kcal a cada semana.`},
    {icon:'🔄',cat:'Deload',color:'var(--purple)',text:'A cada 4–6 semanas, faça uma semana com 50% da carga normal. Isso evita overtraining, melhora recuperação e você volta mais forte.'},
    {icon:'📸',cat:'Fotos de Progresso',color:'var(--good)',text:'Tire fotos mensais com a mesma iluminação, horário e posição. A balança não conta tudo — fotos mostram o que as medidas e o peso não mostram.'},
    {icon:'😴',cat:'Sono = Anabolismo',color:'var(--info)',text:'GH, testosterona e IGF-1 são liberados no sono profundo. Dormir 7–9h é obrigatório. Sem sono, você desperdiça treino, dieta e qualquer protocolo.'},
    {icon:'🧪',cat:'Protocolo Anabólico',color:'var(--warn)',text:'Com suporte hormonal, a janela de recuperação é menor e a síntese proteica é mais alta. Isso exige mais calorias (+400–600 acima da manutenção), mais proteína (2,2–2,5g/kg) e mais volume de treino. Acompanhamento médico é essencial.'},
  ];

  return`<div class="page">
    ${entries.length>=2?`<div class="sec-title" style="padding:0 0 14px">📊 Seu Relatório</div>
    <div class="grid4" style="margin-bottom:20px">
      <div class="card"><div style="font-size:24px;font-weight:700;color:${ac}">${weeksPassed}</div><div class="lbl" style="margin:3px 0">Semanas rastreadas</div></div>
      <div class="card"><div style="font-size:24px;font-weight:700;color:${ac}">${parseFloat(totalGain)>=0?'+':''}${totalGain}kg</div><div class="lbl" style="margin:3px 0">Variação total</div></div>
      <div class="card"><div style="font-size:24px;font-weight:700;color:${ac}">${avgPerWeek}kg</div><div class="lbl" style="margin:3px 0">Média/semana</div></div>
      <div class="card"><div style="font-size:24px;font-weight:700;color:${ac}">${sessions}</div><div class="lbl" style="margin:3px 0">Treinos realizados</div></div>
    </div>`:''}
    <div class="sec-title" style="padding:0 0 14px">💡 Guia Completo</div>
    <div class="grid2">
      ${guide.map(g=>`<div class="card"><div style="display:flex;gap:12px;align-items:flex-start"><span style="font-size:26px;flex-shrink:0">${g.icon}</span><div><div style="font-size:9px;color:${g.color};letter-spacing:2px;text-transform:uppercase;margin-bottom:6px">${g.cat}</div><div style="font-size:11px;color:var(--sub);line-height:1.8">${g.text}</div></div></div></div>`).join('')}
    </div>
  </div>`;
}

// ══════════════════════════════════════
// SYNC STATUS UI
// ══════════════════════════════════════
function showSyncStatus(msg, color='var(--muted)'){
  let el=document.getElementById('sync-status');
  if(!el){
    el=document.createElement('div');
    el.id='sync-status';
    el.style.cssText='position:fixed;top:8px;right:12px;font-size:9px;letter-spacing:1px;z-index:999;padding:4px 10px;border-radius:20px;background:var(--bg3);border:1px solid var(--border2);transition:opacity .5s;font-family:var(--font)';
    document.body.appendChild(el);
  }
  el.textContent=msg; el.style.color=color; el.style.opacity='1';
  setTimeout(()=>el.style.opacity='0', 3000);
}

// ══════════════════════════════════════
// INIT — carrega dados do Firebase
// ══════════════════════════════════════
window._btInit = async function(){
  document.getElementById('shell').className='him-mode';
  document.getElementById('mobile-nav').className='him-mode';
  if(window.innerWidth<=720) document.getElementById('mobile-nav').style.display='flex';

  showSyncStatus('⟳ Sincronizando...', 'var(--info)');

  try {
    // Carrega settings e entradas dos dois perfis
    const [sHim, sHer, eHim, eHer, workouts] = await Promise.all([
      window._fb.getSettings('him'),
      window._fb.getSettings('her'),
      window._fb.getEntries('him'),
      window._fb.getEntries('her'),
      window._fb.getWorkouts()
    ]);

    _cache.settings.him = sHim || {weight:63, goal:80, height:1.71};
    _cache.settings.her = sHer;
    _cache.entries.him  = eHim;
    _cache.entries.her  = eHer;
    _cache.workouts     = workouts;

    if(!sHim) await window._fb.saveSettings('him', _cache.settings.him);

    showSyncStatus('✓ Sincronizado', 'var(--good)');

    // Escuta mudanças em tempo real
    window._fb.listenEntries('him', data=>{ _cache.entries.him=data; if(CP==='him') render(); });
    window._fb.listenEntries('her', data=>{ _cache.entries.her=data; if(CP==='her') render(); });
    window._fb.listenWorkouts(data=>{ _cache.workouts=data; render(); });

  } catch(e) {
    console.error('Firebase load error:', e);
    showSyncStatus('⚠ Offline', 'var(--warn)');
    _cache.settings.him = {weight:63, goal:80, height:1.71};
  }

  render();
};

// O módulo Firebase chama _btInit via evento "load".
// Este bloco é o fallback caso o módulo já tenha carregado antes deste script.
// (não chama direto para evitar dupla execução — o módulo cuida disso)
</script>
